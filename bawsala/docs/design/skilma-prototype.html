:root{
  --paper:#F8F6EF;--card:#FFFFFF;--soft:#EFEADF;--line:#E2DCCD;
  --g:#0F3D36;--g2:#174E45;--gold:#D4AF7C;--goldtx:#7E6130;--hl:#F3E6CF;
  --ink:#17231F;--mute:#55625D;--onp:#F8F6EF;--btn:#0F3D36;--btntx:#F8F6EF;
  --shadow:0 18px 40px -26px rgba(15,61,54,.45);
  --r:20px;--fs:17px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0D1412;--card:#15201D;--soft:#1C2925;--line:#2A3833;
  --g:#E9E4D6;--g2:#D4AF7C;--gold:#D4AF7C;--goldtx:#E2C394;--hl:rgba(212,175,124,.2);
  --ink:#EEF0EC;--mute:#A9B4AF;--onp:#0D1412;--btn:#D4AF7C;--btntx:#0D1412;
  --shadow:0 18px 40px -26px rgba(0,0,0,.8);color-scheme:dark;
}
:root[data-fs="l"]{--fs:19px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;font-size:var(--fs);line-height:1.75;-webkit-font-smoothing:antialiased}
.lat,.num{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance;color:var(--g)}
img{max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.sr{position:absolute;top:0;inset-inline-start:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero .wrap>*{min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:16px;border:0;background:var(--btn);color:var(--btntx);font-weight:600;font-size:17px;text-decoration:none;cursor:pointer;box-shadow:0 14px 28px -18px rgba(15,61,54,.8);transition:transform .16s ease,box-shadow .16s ease}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--g);border:1.5px solid var(--line);box-shadow:none}
.btn.soft{background:var(--soft);color:var(--g);box-shadow:none}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px;border-radius:14px}
.btn svg{flex:none}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--g)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--g);color:var(--onp);border-color:var(--g)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--gold);color:#0D1412;border-color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:12px;padding:3px 10px;background:var(--hl);color:var(--goldtx)}
.tag.g{background:var(--soft);color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.mute{color:var(--mute)}
.kicker{font-size:15px;font-weight:600;color:var(--goldtx)}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:38px;height:38px;border-radius:11px}
.brand b{font-family:'IBM Plex Sans';font-weight:700;font-size:18px;letter-spacing:.6px;color:var(--g)}
.nav{display:flex;gap:4px;margin-inline-start:24px}
.nav a{text-decoration:none;font-size:16px;color:var(--mute);padding:10px 14px;border-radius:12px}
.nav a:hover{color:var(--g);background:var(--soft)}
.top .sp{flex:1}
@media (max-width:860px){.nav{display:none}}

/* settings pop */
.pop{position:absolute;inset-inline-end:20px;top:66px;width:300px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px;z-index:40}
.pop h3{font-size:15px;color:var(--mute);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btntx);border-color:transparent}

/* hero */
.hero{padding:48px 0 72px}
.hero .wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(36px,5.2vw,62px);line-height:1.22;font-weight:700;letter-spacing:-.2px}
.hero h1 em{font-style:normal;color:var(--goldtx)}
.hero .sub{margin-top:18px;font-size:clamp(17px,1.6vw,20px);color:var(--mute);max-width:30em}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .proof{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;font-size:15px;color:var(--mute)}
.hero .proof span{display:inline-flex;gap:8px;align-items:center}
@media (max-width:960px){.hero .wrap{grid-template-columns:1fr;gap:28px}.hero{padding:20px 0 48px}}
@media (max-width:600px){.hero .ctas .btn{width:100%}.hero .proof{gap:14px}}

/* live try */
.try{padding:20px;border-radius:28px;background:var(--card);border:1.5px solid var(--g);box-shadow:var(--shadow);position:relative}
:root[data-theme="dark"] .try{border-color:var(--line)}
.try-who{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:-2px -4px 12px;scrollbar-width:none}
.try-who::-webkit-scrollbar{display:none}
.try-who .chip{flex:none;min-height:40px;font-size:14px}
.try label{font-size:14px;font-weight:600;color:var(--goldtx)}
.ed{position:relative;margin-top:6px}
.ed textarea,.ed .mirror{width:100%;min-height:132px;font-size:18px;line-height:2;padding:12px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;letter-spacing:normal}
.ed textarea{position:relative;z-index:2;background:transparent;border:1px solid var(--line);resize:none;outline:none;color:var(--ink);caret-color:var(--g)}
.ed textarea:focus{border-color:var(--gold)}
.ed .mirror{position:absolute;inset:0;z-index:1;color:transparent;border:1px solid transparent;overflow:hidden;pointer-events:none}
.mirror mark{background:var(--hl);color:transparent;border-radius:5px;box-shadow:inset 0 -2px 0 var(--gold);transition:background .3s}
.try-out{margin-top:14px;display:grid;gap:12px}
.try-n{display:flex;align-items:baseline;gap:8px;font-weight:600;color:var(--g);font-size:17px}
.try-n b{font-size:28px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sk{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 12px;border-radius:20px;background:var(--g);color:var(--onp);font-size:15px;font-weight:600;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i,0)*70ms)}
:root[data-theme="dark"] .sk{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.sk svg{color:var(--gold)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.fit{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--soft)}
.fit .seg4{display:flex;gap:4px;margin-inline-start:auto}
.fit .seg4 i{width:18px;height:8px;border-radius:4px;background:var(--line)}
.fit .seg4 i.on{background:var(--gold)}
.try-empty{padding:12px 4px;color:var(--mute);font-size:15px}

/* sections */
section.s{padding:88px 0}
section.s.alt{background:var(--card);border-block:1px solid var(--line)}
.s-head{max-width:720px;margin-bottom:40px;display:grid;gap:12px}
.s-head h2{font-size:clamp(28px,3.4vw,42px);line-height:1.3}
.s-head p{font-size:18px;color:var(--mute)}
@media (max-width:600px){section.s{padding:60px 0}}

/* problem */
.prob{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.bars{padding:24px;display:flex;align-items:flex-end;gap:16px;height:320px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;justify-content:flex-end}
.bars .col{width:100%;max-width:84px;border-radius:14px 14px 6px 6px;background:var(--soft);position:relative;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.bars .b.top .col{background:var(--g)}
:root[data-theme="dark"] .bars .b.top .col{background:var(--gold)}
.bars .v{font-weight:700;font-size:22px;color:var(--g)}
.bars .l{font-size:14px;color:var(--mute);text-align:center}
@keyframes grow{from{transform:scaleY(.05)}to{transform:none}}
.big{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:var(--g);color:var(--onp);border-color:transparent}
:root[data-theme="dark"] .big{background:var(--soft)}
.big b{font-size:64px;line-height:1;color:var(--gold)}
.big span{font-size:18px}
.src{margin-top:14px;font-size:14px;color:var(--mute);display:flex;gap:8px}
@media (max-width:860px){.prob{grid-template-columns:1fr}.bars{height:260px}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{padding:26px;display:grid;gap:12px;align-content:start}
.step .n{width:44px;height:44px;border-radius:14px;background:var(--hl);color:var(--goldtx);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.step h3{font-size:21px;color:var(--g)}
.step p{color:var(--mute);font-size:16px}
.step .vis{margin-top:6px;padding:14px;border-radius:16px;background:var(--paper);border:1px dashed var(--line);font-size:15px;min-height:76px}
@media (max-width:860px){.steps{grid-template-columns:1fr}}

/* personas */
.who{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.wcard{padding:20px;display:grid;gap:12px;align-content:start;text-align:start;cursor:pointer;transition:transform .2s,border-color .2s}
.wcard:hover{transform:translateY(-3px);border-color:var(--gold)}
.wcard .ico{width:48px;height:48px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--g)}
.wcard h3{font-size:18px;color:var(--g)}
.wcard q{font-size:15px;color:var(--mute);quotes:"«" "»"}
@media (max-width:1060px){.who{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.who{grid-template-columns:1fr}}

/* passport visual */
.pp-sec{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.ul-check{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:14px}
.ul-check li{display:flex;gap:12px;align-items:flex-start;font-size:17px}
.ul-check svg{flex:none;margin-top:4px;color:var(--goldtx)}
@media (max-width:960px){.pp-sec{grid-template-columns:1fr;gap:32px}}

.passport{position:relative;border-radius:28px;padding:26px;background:linear-gradient(155deg,#0F3D36 0%,#0B2F29 100%);color:#F8F6EF;box-shadow:0 30px 60px -30px rgba(15,61,54,.9);overflow:hidden;isolation:isolate}
.passport::before{content:"";position:absolute;inset:10px;border:1px solid rgba(212,175,124,.45);border-radius:20px;pointer-events:none}
.passport::after{content:"";position:absolute;width:340px;height:340px;inset-inline-end:-120px;top:-120px;background:radial-gradient(circle,rgba(212,175,124,.22),transparent 65%);z-index:-1}
.pp-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pp-top .t{display:flex;align-items:center;gap:10px;font-size:14px;color:#D9C29A;letter-spacing:.3px}
.pp-top img{width:30px;height:30px;border-radius:9px;box-shadow:0 0 0 1px rgba(212,175,124,.5)}
.pp-no{font-family:'IBM Plex Sans';font-size:13px;color:#D9C29A;letter-spacing:1.5px}
.pp-id{display:flex;align-items:center;gap:14px;margin-top:22px}
.pp-av{width:58px;height:58px;border-radius:50%;background:#D4AF7C;color:#0F3D36;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px}
.pp-id b{font-size:24px;display:block;line-height:1.3}
.pp-id span{font-size:15px;color:#C9D6D1}
.pp-sk{margin-top:22px;display:grid;gap:10px}
.pp-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(248,246,239,.07);border:1px solid rgba(248,246,239,.08)}
.pp-row .ic{width:36px;height:36px;border-radius:11px;background:rgba(212,175,124,.16);display:flex;align-items:center;justify-content:center;color:#D4AF7C;flex:none}
.pp-row .tx{flex:1;min-width:0}
.pp-row b{font-size:16px;font-weight:600;display:block}
.pp-row small{font-size:13px;color:#BFCFC9;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{font-size:12.5px;font-weight:600;border-radius:10px;padding:2px 9px;background:rgba(212,175,124,.18);color:#E6CFA4;flex:none}
.lvl.earned{background:#D4AF7C;color:#0F3D36}
.pp-foot{margin-top:18px;display:flex;justify-content:space-between;font-size:13px;color:#BFCFC9}

/* privacy */
.prom{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.prom .card{padding:26px;display:grid;gap:10px}
.prom h3{font-size:19px;color:var(--g)}
.prom p{color:var(--mute);font-size:16px}
@media (max-width:860px){.prom{grid-template-columns:1fr}}

/* faq */
.faq{display:grid;gap:12px;max-width:820px}
.faq details{padding:0 22px}
.faq summary{list-style:none;cursor:pointer;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:18px;color:var(--g)}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{transition:transform .2s;flex:none}
.faq details[open] summary svg{transform:rotate(45deg)}
.faq details p{padding-bottom:20px;color:var(--mute)}

/* final */
.final{background:var(--g);color:var(--onp);border-radius:36px;padding:64px 40px;text-align:center;display:grid;gap:18px;justify-items:center;position:relative;overflow:hidden}
:root[data-theme="dark"] .final{background:var(--soft);color:var(--ink)}
.final h2{color:inherit;font-size:clamp(28px,4vw,46px)}
.final p{opacity:.85;font-size:18px;max-width:34em}
.final .btn{background:var(--gold);color:#0F3D36}
footer{padding:48px 0 120px;color:var(--mute);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer a{text-decoration:none}
footer a:hover{color:var(--g)}

/* auth */
.auth{min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:32px 0 80px}
.auth .card{width:min(460px,100%);padding:32px 28px;display:grid;gap:18px;box-shadow:var(--shadow)}
.auth h1{font-size:28px;line-height:1.35}
.field{display:grid;gap:8px}
.field label{font-size:15px;font-weight:600}
.inp{min-height:54px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);font-size:17px;outline:none;width:100%}
.inp:focus{border-color:var(--gold)}
textarea.inp{padding:14px 16px;line-height:1.9;resize:vertical}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;direction:ltr}
.otp input{min-width:0;width:100%;min-height:58px;text-align:center;font-size:24px;font-family:'IBM Plex Sans';font-weight:600;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);outline:none}
.otp input:focus{border-color:var(--gold)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:16px;cursor:pointer}
.check input{width:24px;height:24px;margin:2px 0 0;accent-color:#0F3D36;flex:none}
.err{color:#B3261E;font-size:15px}
:root[data-theme="dark"] .err{color:#F2B8B5}

/* app shell */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.side .brand{padding:6px 10px 22px}
.side a.it{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;border-radius:14px;text-decoration:none;color:var(--mute);font-weight:500}
.side a.it:hover{background:var(--soft);color:var(--g)}
.side a.it[aria-current="page"]{background:var(--g);color:var(--onp)}
:root[data-theme="dark"] .side a.it[aria-current="page"]{background:var(--gold);color:#0D1412}
.side .sp{flex:1}
.main{min-width:0;padding:28px 40px 120px}
.main-in{max-width:820px;margin:0 auto}
.apptop{display:none}
.tabs{display:none}
@media (max-width:960px){
  .app{display:block}
  .side{display:none}
  .main{padding:8px 20px 120px}
  .apptop{display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:20;margin:0 -20px;padding:0 20px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center;text-decoration:none;font-size:12.5px;color:var(--mute);border-radius:14px}
  .tabs a[aria-current="page"]{color:var(--g);font-weight:600}
  .tabs a[aria-current="page"] svg{background:var(--hl);border-radius:12px;padding:3px 12px;box-sizing:content-box}
}
.ph{display:grid;gap:8px;margin:18px 0 22px}
.ph h1{font-size:clamp(26px,3.4vw,36px);line-height:1.3}
.ph p{color:var(--mute)}

/* compose */
.starters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.compose{padding:20px;display:grid;gap:12px}
.compose textarea{border:0;background:transparent;font-size:19px;line-height:1.95;min-height:220px;resize:none;outline:none;padding:0}
.c-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.mic{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:24px;border:0;background:var(--soft);color:var(--g);font-weight:600;cursor:pointer}
.mic.rec{background:#B3261E;color:#fff}
.live{font-size:15px;color:var(--goldtx);font-weight:600}
.sticky-cta{position:sticky;bottom:86px;margin-top:18px}
@media (min-width:961px){.sticky-cta{bottom:20px}}

/* discover */
.story{padding:18px 20px;font-size:18px;line-height:2.1}
.story mark{background:var(--hl);color:var(--ink);border-radius:5px;padding:1px 3px;box-shadow:inset 0 -2px 0 var(--gold)}
.slist{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.srow{display:flex;align-items:center;gap:14px;padding:12px 14px;animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i,0)*90ms)}
.srow .ic{width:46px;height:46px;flex:none;border-radius:14px;background:var(--g);color:var(--gold);display:flex;align-items:center;justify-content:center}
:root[data-theme="dark"] .srow .ic{background:var(--soft)}
.srow .tx{flex:1;min-width:0;display:grid;gap:2px}
.srow b{font-size:17px;font-weight:600;color:var(--g)}
.srow small{font-size:14.5px;color:var(--mute)}
.srow.off{opacity:.45}
.srow.off b{text-decoration:line-through}

/* opps */
.ocard{padding:20px;display:grid;gap:14px}
.ohead{display:flex;gap:14px;align-items:flex-start}
.logo{width:50px;height:50px;border-radius:15px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--g);flex:none;font-family:'IBM Plex Sans'}
.ohead h3{font-size:19px;color:var(--g);line-height:1.4}
.ohead .meta{font-size:15px;color:var(--mute)}
.fitbar{display:flex;align-items:center;gap:12px}
.fitbar .segs{display:flex;gap:5px;flex:1}
.fitbar .segs i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.fitbar .segs i.on{background:var(--gold)}
.fitbar b{font-size:16px;color:var(--g);white-space:nowrap}
.need{display:flex;flex-wrap:wrap;gap:8px}
.need span{font-size:14px;border-radius:12px;padding:4px 12px;border:1px dashed var(--gold);color:var(--goldtx)}
.need span.has{border-style:solid;border-color:transparent;background:var(--soft);color:var(--g)}
.olist{display:grid;gap:14px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:14px;background:var(--hl);color:var(--goldtx);font-size:15px;margin-bottom:16px}

/* path */
.goal{padding:22px;display:flex;align-items:center;gap:20px;background:var(--g);color:var(--onp);border-color:transparent}
:root[data-theme="dark"] .goal{background:var(--soft);color:var(--ink)}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--gold)}
.goal h2{color:inherit;font-size:22px;line-height:1.4}
.goal p{opacity:.85;font-size:15px}
.weeks{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px;position:relative}
.wk{padding:18px 20px;display:grid;gap:10px;position:relative}
.wk .wh{display:flex;align-items:center;gap:12px}
.wk .wn{font-size:14px;font-weight:600;color:var(--goldtx)}
.wk h3{font-size:19px;color:var(--g);line-height:1.4}
.wk .res{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--mute)}
.wk .res span{display:inline-flex;gap:6px;align-items:center}
.wk.now{border:2px solid var(--gold);box-shadow:var(--shadow)}
.wk.later{opacity:.6}
.wk.done{background:var(--soft)}
.wk.done h3{color:var(--mute)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.wk.done .dot{background:var(--gold);border-color:var(--gold);color:#0F3D36}
.wk.now .dot{border-color:var(--gold)}

/* interview */
.iv{padding:26px;display:grid;gap:18px}
.iv .q{font-size:clamp(22px,2.6vw,28px);font-weight:600;line-height:1.5;color:var(--g)}
.prog{display:flex;gap:6px}
.prog i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--gold)}
.fb{display:grid;gap:10px;padding:16px;border-radius:16px;background:var(--soft);animation:pop .4s both}
.fb p{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.fb svg{flex:none;margin-top:5px}

/* me */
.set{padding:6px 20px}
.set .row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px;border-bottom:1px solid var(--line)}
.set .row:last-child{border-bottom:0}
.set .row b{font-weight:600;display:block}
.set .row small{color:var(--mute);font-size:14.5px}
.sw{width:56px;height:32px;border-radius:16px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset .2s}
.sw[aria-checked="true"]{background:var(--g)}
:root[data-theme="dark"] .sw[aria-checked="true"]{background:var(--gold)}
.sw[aria-checked="true"]::after{inset-inline-start:28px}
select.inp{min-height:48px;width:auto}
.danger{color:#B3261E}
:root[data-theme="dark"] .danger{color:#F2B8B5}

/* trust page */
.doc{max-width:760px;display:grid;gap:26px}
.doc h2{font-size:24px}
.doc ul{margin:0;padding-inline-start:22px;display:grid;gap:8px}

/* toast */
.toasts{position:fixed;bottom:96px;inset-inline:16px;display:flex;justify-content:center;pointer-events:none;z-index:60}
.toast{max-width:420px;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:14px;font-size:15px;box-shadow:var(--shadow);animation:pop .3s both;display:flex;gap:10px;align-items:center}
@media (min-width:961px){.toasts{bottom:28px}}

/* reveal */
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
:root[data-lite="1"] *,:root[data-lite="1"] *::before{animation:none!important;transition:none!important}
:root[data-lite="1"] .rv{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.view{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
</style>

const W=/[\p{L}\p{M}\p{N}’'-]/u;
function read(text){
  const out=[];const sents=sentences(text);const full=norm(text);
  for(const id of Object.keys(HINT)){
    if(!SKN[id])continue;
    if(id==="multilingual"&&LANG_WORDS.filter(r=>r.test(full)).length<2)continue;
    for(const s of sents){const n=norm(s);if(HINT[id].test(n)&&!negated(n,HINT[id])){out.push({id,quote:quoteOf(s,HINT[id])});break}}
  }
  return out;
}
function quoteOf(s,re){
  const m=s.match(re); if(!m) return s.slice(0,40);
  let a=m.index,b=a+m[0].length;
  while(a>0&&W.test(s[a-1]))a--; while(b<s.length&&W.test(s[b]))b++;
  // extend to ~3 words
  let words=0,e=b;while(e<s.length&&words<2){e++;if(s[e]===" ")words++;}
  return s.slice(a,Math.min(e,s.length)).replace(/[،,.]+$/,"").trim();
}
function marked(text){
  const ranges=[];
  for(const id of Object.keys(HINT)){if(!SKN[id])continue;
    const re=new RegExp(HINT[id].source,"gi");let m;
    while((m=re.exec(text))){let a=m.index,b=a+m[0].length;if(!m[0].length){re.lastIndex++;continue}
      while(a>0&&W.test(text[a-1]))a--;while(b<text.length&&W.test(text[b]))b++;ranges.push([a,b]);}
  }
  ranges.sort((x,y)=>x[0]-y[0]);const mg=[];for(const r of ranges){const l=mg[mg.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else mg.push(r.slice())}
  let o="",p=0;for(const [a,b] of mg){o+=esc(text.slice(p,a))+"<mark>"+esc(text.slice(a,b))+"</mark>";p=b}
  return o+esc(text.slice(p))+"\n";
}

function ivFeedback(a){
  const good=[],imp=[];const t=a.trim();
  if(/\d|مرة|كنت|عندما|نهار|يوم|once|quand|when/i.test(t))good.push("أعطيت مثالاً حقيقياً من تجربتك، وهذا أقوى شيء في أي مقابلة.");
  if(read(t).length)good.push("ذكرت مهارة واضحة: "+read(t).slice(0,2).map(x=>skName(x.id)).join(" و")+".");
  if(t.length>140)good.push("جوابك مفصّل ويُفهم بسهولة.");
  if(!good.length)good.push("بدأت بجواب صادق ومباشر.");
  if(t.length<80)imp.push("أضف جملة عن النتيجة: ماذا تغيّر بعد ما فعلته؟");
  else if(!/\d/.test(t))imp.push("أضف رقماً إن أمكن: كم شخصاً؟ كم مرة؟ كم من الوقت؟");
  else imp.push("اختم بجملة تربط تجربتك بهذه الفرصة بالذات.");
  return {good:good[0],imp:imp[0]};
}

      <div class="fb"><p>${ic("check",18,2.2)}<span>${esc(ui.ivFb.good)}</span></p><p>${ic("bulb",18)}<span>${esc(ui.ivFb.imp)}</span></p></div>
      <button class="btn" data-act="iv-next">${i+1<IVQ.length?"السؤال التالي":"شاهد الملخص"}</button>`:
     `<label for="ivA" class="sr">جوابك</label><textarea id="ivA" class="inp" rows="5" placeholder="أجب كما تتكلم، بأي لغة.">${esc(ui.ivDraft)}</textarea>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="mic" data-act="mic">${ic("mic",20)} أجب بصوتك</button><button class="btn" data-act="iv-send" style="flex:1">أرسل جوابي</button></div>`}
   </div><p class="mute" style="font-size:14px;margin-top:12px">${ic("lock",15)} ملاحظات للتدريب فقط. لا نعطيك نقطة، ولا يراها أحد غيرك.</p>`);
}
function vMe(){
  const th=document.documentElement.dataset.theme;
  return shell("me",`<div class="ph"><p class="kicker">حسابي</p><h1>${esc(S.user.name)}</h1><p class="lat" dir="ltr" style="text-align:end">${esc(S.user.email)}</p></div>
   <div class="card set">
    <div class="row"><span><b>الوضع الداكن</b><small>أريح للعين في الليل</small></span><button class="sw" role="switch" aria-checked="${th==="dark"}" data-act="theme" data-v="${th==="dark"?"light":"dark"}" aria-label="الوضع الداكن"></button></div>
    <div class="row"><span><b>خط أكبر</b><small>لقراءة أسهل</small></span><button class="sw" role="switch" aria-checked="${S.fs==="l"}" data-act="fs" data-v="${S.fs==="l"?"m":"l"}" aria-label="خط أكبر"></button></div>
    <div class="row"><span><b>وضع خفيف</b><small>بلا حركة، للهواتف البطيئة</small></span><button class="sw" role="switch" aria-checked="${!!S.lite}" data-act="lite" aria-label="وضع خفيف"></button></div>
    <div class="row"><span><b>اللغة</b><small>العربية، الفرنسية، الإنجليزية</small></span><select class="inp" aria-label="اللغة" data-act="lang-sel"><option>العربية</option><option class="lat">Français</option><option class="lat">English</option></select></div>
   </div>
   <div class="card set" style="margin-top:14px">
    <div class="row"><span><b>بياناتي</b><small>ما نحفظه وكيف نحميه</small></span><a class="btn sm soft" href="#/trust">اقرأ</a></div>
    <div class="row"><span><b>تسجيل الخروج</b></span><button class="btn sm soft" data-act="logout">${ic("out",18)} خروج</button></div>
    <div class="row"><span><b class="danger">حذف حسابي</b><small>يحذف كل قصصك ومهاراتك نهائياً</small></span>${ui.confirmDel?`<span style="display:flex;gap:8px"><button class="btn sm soft" data-act="del-no">إلغاء</button><button class="btn sm" data-act="del-yes" style="background:#B3261E;color:#fff">احذف نهائياً</button></span>`:`<button class="btn sm ghost danger" data-act="del">${ic("trash",18)} حذف</button>`}</div>
   </div>`);
}
function vTrust(){
  return pubTop()+`<main id="main" class="view"><section class="s" style="padding-top:40px"><div class="wrap doc">
    <div class="s-head" style="margin:0"><p class="kicker">الخصوصية والبيانات</p><h2>ما نحفظه، ولماذا، وكيف تتحكم فيه</h2><p>بكلمات بسيطة، بلا لغة قانونية معقدة.</p></div>
    <div class="card" style="padding:24px;display:grid;gap:12px"><h2>ما نحفظه</h2><ul><li>بريدك الإلكتروني، لتدخل إلى حسابك.</li><li>اسمك الأول ومدينتك.</li><li>القصص التي تكتبها، والمهارات التي تختار حفظها.</li></ul></div>
    <div class="card" style="padding:24px;display:grid;gap:12px"><h2>ما لا نفعله أبداً</h2><ul><li>لا نبيع بياناتك ولا نعرض إعلانات.</li><li>لا نرسل اسمك ولا بريدك إلى الذكاء الاصطناعي، بل القصة وحدها.</li><li>لا نعطيك «نقطة» ولا نقرر بدلاً من أي مشغّل.</li></ul></div>
    <div class="card" style="padding:24px;display:grid;gap:12px"><h2>حقوقك</h2><ul><li>ترى كل ما نحفظه عنك في أي وقت.</li><li>تحذف حسابك وكل بياناتك بزر واحد.</li><li>نلتزم بالقانون المغربي 09-08 لحماية المعطيات الشخصية.</li></ul></div>
    <a class="btn" href="#/" style="justify-self:start">${ic("back",20)} العودة</a>
  </div></section></main>`+footer();
}

/* ---------- router ---------- */
const AUTH=["passport","opportunities","path","interview","me","start","discover"];
function route(){
  const r=(location.hash.replace(/^#\/?/,"")||"").split("?")[0];
  if(AUTH.includes(r)&&!S.user){location.hash="#/signin";return}
  if(r==="signin"&&S.user){location.hash="#/passport";return}
  const V={"":vHome,signin:vSignin,start:vStart,discover:vDiscover,passport:vPassport,opportunities:vOpps,path:vPath,interview:vInterview,me:vMe,trust:vTrust};
  ui.pop=false;
  $("#root").innerHTML=(V[r]||vHome)();
  window.scrollTo(0,0);mount();
}
function rerender(keepScroll=true){const y=scrollY;const r=(location.hash.replace(/^#\/?/,"")||"");const V={"":vHome,signin:vSignin,start:vStart,discover:vDiscover,passport:vPassport,opportunities:vOpps,path:vPath,interview:vInterview,me:vMe,trust:vTrust};$("#root").innerHTML=(V[r]||vHome)();if(keepScroll)window.scrollTo(0,y);mount(true)}
function mount(quiet){
  const top=$("#top");if(top){const f=()=>top.classList.toggle("scrolled",scrollY>8);f();onscroll=f}else onscroll=null;
  const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"}):null;
  document.querySelectorAll(".rv").forEach((el,i)=>{if(quiet||!io)el.classList.add("in");else{el.style.transitionDelay=(i%4)*70+"ms";io.observe(el)}});
  const tt=$("#tryT");if(tt){let to;tt.addEventListener("input",()=>{ui.try=tt.value;$("#mir").innerHTML=marked(ui.try);clearTimeout(to);to=setTimeout(()=>{$("#tryOut").innerHTML=tryOut()},180)});tt.addEventListener("scroll",()=>{$("#mir").scrollTop=tt.scrollTop})}
  const c=$("#cmp");if(c){c.addEventListener("input",()=>{ui.draft=c.value;const n=read(ui.draft).length;$("#liveN").textContent=n?`${n} ${n===1?"مهارة":"مهارات"} حتى الآن`:"";const b=document.querySelector('[data-act="discover"]');if(ui.draft.trim().length>=8){b.disabled=false;b.style.opacity=1}else{b.disabled=true;b.style.opacity=.5}})}
  const iv=$("#ivA");if(iv)iv.addEventListener("input",()=>{ui.ivDraft=iv.value});
  const otp=document.querySelectorAll("[data-otp]");otp.forEach((el,i)=>{el.addEventListener("input",()=>{el.value=el.value.replace(/\D/g,"").slice(0,1);if(el.value&&otp[i+1])otp[i+1].focus()});el.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!el.value&&otp[i-1])otp[i-1].focus()})});if(otp[0])otp[0].focus();
}

/* ---------- actions ---------- */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){e.preventDefault();const id=g.dataset.go;const go=()=>{const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:"smooth"})};if(location.hash&&location.hash!=="#/"){location.hash="#/";setTimeout(go,60)}else go();return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  const A={
    pop(){ui.pop=!ui.pop;rerender()},
    theme(){S.theme=a.dataset.v;save();applyPrefs();rerender()},
    fs(){S.fs=a.dataset.v;save();applyPrefs();rerender()},
    lite(){S.lite=S.lite?0:1;save();applyPrefs();rerender()},
    "lang-soon"(){toast("الفرنسية والإنجليزية جاهزتان في النسخة الحقيقية","globe")},
    ex(){ui.ex=+a.dataset.i;ui.try=EX[ui.ex].t;if(a.dataset.up){rerender();document.querySelector(".hero").scrollIntoView({behavior:"smooth"})}else rerender()},
    keep(){S.pending=ui.try;save();if(S.user){location.hash="#/discover"}},
    "auth-back"(){ui.auth="email";rerender()},
    starter(){const s=["في المحل كنت ","في الدراسة ","في الجمعية ","في البيت "][+a.dataset.i];ui.draft=(ui.draft?ui.draft.trim()+" ":"")+s;rerender();const c=$("#cmp");c.focus();c.setSelectionRange(c.value.length,c.value.length)},
    mic(){a.classList.toggle("rec");toast(a.classList.contains("rec")?"أستمع… تكلّم بالدارجة أو العربية أو الفرنسية":"توقف التسجيل","mic");},
    discover(){if(ui.draft.trim().length<8)return;S.pending=ui.draft;S.removed=[];save();location.hash="#/discover"},
    "toggle-sk"(){const id=a.dataset.id;S.removed=S.removed.includes(id)?S.removed.filter(x=>x!==id):[...S.removed,id];save();rerender()},
    "keep-skills"(){const st=S.pending;const f=read(st).filter(x=>!S.removed.includes(x.id));S.stories.unshift({t:st,at:Date.now()});f.forEach(x=>{if(!S.skills[x.id])S.skills[x.id]={q:x.quote,earned:0}});S.pending=null;ui.draft="";save();location.hash="#/passport";setTimeout(()=>toast(f.length+" مهارات أُضيفت إلى جوازك","pass"),200)},
    share(){const u="https://skilma.ma/p/"+passNo();try{navigator.clipboard.writeText(u).then(()=>toast("نُسخ رابط جوازك"),()=>toast(u,"share"))}catch(_){toast(u,"share")}},
    img(){toast("صورة الجواز جاهزة للتحميل في النسخة الحقيقية","down")},
    oppf(){ui.oppF=a.dataset.v;rerender()},
    target(){S.target=a.dataset.id;save();location.hash="#/path"},
    "go-iv"(){S.target=a.dataset.id;S.iv={i:0,a:[]};save();location.hash="#/interview"},
    res(){toast("يفتح المورد المجاني في صفحة جديدة","book")},
    done(){const id=a.dataset.id;if(!S.done.includes(id))S.done.push(id);S.skills[id]={q:"أنهى خطوة: "+(RES[id]?RES[id][0]:skName(id)),earned:1};save();rerender();toast(skName(id)+" أُضيفت إلى جوازك","pass")},
    "iv-send"(){const v=($("#ivA").value||"").trim();if(v.length<10){toast("اكتب جواباً قصيراً على الأقل","info");return}ui.ivDraft=v;ui.ivFb=ivFeedback(v);rerender()},
    "iv-next"(){S.iv.a.push(ui.ivDraft);S.iv.i++;ui.ivDraft="";ui.ivFb=null;save();rerender(false)},
    "iv-reset"(){S.iv={i:0,a:[]};save();rerender()},
    logout(){const keep={theme:S.theme,fs:S.fs,lite:S.lite};S=Object.assign(blank(),keep);save();location.hash="#/"},
    del(){ui.confirmDel=true;rerender()},"del-no"(){ui.confirmDel=false;rerender()},
    "del-yes"(){ui.confirmDel=false;S=blank();save();applyPrefs();location.hash="#/";setTimeout(()=>toast("حُذف حسابك وكل بياناتك","trash"),200)}
  };
  if(A[act]){if(a.tagName==="A"&&(act!=="keep"||S.user))e.preventDefault();A[act]()}
});
document.addEventListener("change",e=>{if(e.target.dataset.act==="lang-sel"&&e.target.selectedIndex){toast("الفرنسية والإنجليزية جاهزتان في النسخة الحقيقية","globe");e.target.selectedIndex=0}});
document.addEventListener("submit",e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==="email"){const v=$("#em").value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){$("#emErr").hidden=false;$("#em").focus();return}ui.email=v;ui.auth="code";rerender();toast("أرسلنا الرمز إلى بريدك","info")}
  if(f==="code"){const c=[...document.querySelectorAll("[data-otp]")].map(i=>i.value).join("");if(c.length<6){toast("أدخل الأرقام الستة","info");return}ui.auth="profile";rerender()}
  if(f==="profile"){const n=$("#nm").value.trim();if(!n||!$("#age").checked||!$("#ok").checked){$("#pErr").hidden=false;return}
    S.user={name:n,city:$("#ct").value,email:ui.email};ui.auth="email";
    if(S.pending){save();location.hash="#/discover"}else{save();location.hash="#/start"}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.pop){ui.pop=false;rerender()}});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(!S.theme){applyPrefs()}});
window.addEventListener("hashchange",route);
applyPrefs();route();
})();
</script>
</body>
</html>
