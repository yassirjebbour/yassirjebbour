<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030B16">
<meta name="description" content="BAWSALA — discover what you can do, not just what you studied.">
<title>BAWSALA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
<style>
/* =====================================================================
   BAWSALA v3 — one file, seven stations.
   Palette is five colours, nothing else. Alpha variants of the same five
   are used for lines and soft fills; no new hue is ever introduced.
     --void   #030B16  background
     --navy   #071A2F  surfaces
     --teal   #19E6C1  interaction · progress · proof
     --amber  #FFB547  opportunity — and only opportunity
     --white  #FFFFFF  text
   Typography: IBM Plex Sans + IBM Plex Sans Arabic only. Hierarchy comes
   from weight, size and tracking, never from a second family.

   Motion inventory (24): 1 headline word rise · 2 mark stroke draw ·
   3 compass needle follows pointer · 4 needle idle sway · 5 orbit spin ·
   6 magnetic CTA · 7 direction-aware screen transitions (RTL-flipped) ·
   8 journey spine fill + live pulse · 9 typing playback · 10 live detail
   meter · 11 chip spring press · 12 scan-line sweep · 13 keyword highlight
   cascade · 14 skill chips pop · 15 stage ticks · 16 passport 3D tilt ·
   17 count-up numbers · 18 confirm stamp · 19 readiness ring draw ·
   20 gap ladder fill · 21 proof particle burst + meter rise · 22 recruiter
   typing dots · 23 feedback bars fill · 24 impact 10→1 cascade · + toasts.
   All of it collapses under prefers-reduced-motion.
   ===================================================================== */
:root{
  --void:#030B16; --navy:#071A2F; --teal:#19E6C1; --amber:#FFB547; --white:#FFFFFF;
  --t2:rgba(255,255,255,.72); --t3:rgba(255,255,255,.56);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.18); --lift:rgba(255,255,255,.04);
  --teal-a:rgba(25,230,193,.10); --teal-b:rgba(25,230,193,.30);
  --amber-a:rgba(255,181,71,.12); --amber-b:rgba(255,181,71,.40);
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;
  --num:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --gut:clamp(20px,4vw,56px); --dir:1; --origin:left;
}
[dir=rtl]{--dir:-1;--origin:right;--font:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--void);-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;min-height:100dvh;background:var(--void);color:var(--white);font:400 16px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(70% 50% at 85% -10%,rgba(25,230,193,.10),transparent 60%),radial-gradient(60% 40% at 0% 110%,rgba(7,26,47,.9),transparent 70%)}
[dir=rtl] body::before{transform:scaleX(-1)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
p{margin:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
::selection{background:var(--teal);color:var(--void)}
bdi{unicode-bidi:isolate}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ---------- Chrome ---------- */
.proto{position:relative;z-index:50;text-align:center;font-size:12px;letter-spacing:.04em;color:var(--t3);padding:7px var(--gut);border-bottom:1px solid var(--line);background:var(--void)}
[dir=rtl] .proto{letter-spacing:0}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;height:68px;padding:0 var(--gut);background:rgba(3,11,22,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:4px;color:var(--white);flex:none}
.logo svg{width:28px;height:28px;color:var(--teal);transition:transform .5s var(--spring)}
.logo:hover svg{transform:rotate(-12deg)}
.logo b{font-family:"IBM Plex Sans",sans-serif;font-weight:600;letter-spacing:.16em;font-size:15px}
.logo .ar-n{font-family:"IBM Plex Sans Arabic",sans-serif;color:var(--t3);font-size:14px;padding-inline-start:10px;border-inline-start:1px solid var(--line2);line-height:1}
.bw-bowl{fill:none;stroke:currentColor;stroke-linecap:round}
.bw-dot{fill:currentColor}
.spine{flex:1;display:flex;justify-content:center;min-width:0}
.spine ol{list-style:none;display:flex;align-items:center;margin:0;padding:0}
.spine li{display:flex;align-items:center}
.spine li+li::before{content:"";width:22px;height:1.5px;background:var(--line2);margin:0 2px;transition:background .6s var(--ease)}
.spine li.lit+li.lit::before{background:var(--teal)}
.spine button{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--t3);font-size:13px;font-weight:500;padding:8px;border-radius:999px;transition:color .2s,background .2s}
.spine button:hover:not(:disabled){color:var(--white);background:var(--lift)}
.spine button:disabled{cursor:default;opacity:.45}
.spine .dot{position:relative;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line2);flex:none;transition:all .4s var(--ease)}
.spine .done .dot{background:var(--teal);border-color:var(--teal)}
.spine .now .dot{border-color:var(--teal);background:var(--void)}
.spine .now .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--teal);animation:pulse 2.2s var(--ease) infinite}
.spine .now button{color:var(--white)}
.spine .lbl{white-space:nowrap}
@media (max-width:1240px){.spine li:not(.now) .lbl{display:none}}
.tools{display:flex;align-items:center;gap:8px;flex:none;margin-inline-start:auto}
.langs{display:flex;padding:3px;border:1px solid var(--line2);border-radius:999px}
.langs button{min-width:40px;height:32px;padding:0 10px;border:0;border-radius:999px;background:none;color:var(--t2);font-size:13px;font-weight:600;transition:background .25s,color .25s}
.langs button[lang=ar]{font-family:"IBM Plex Sans Arabic",sans-serif}
.langs button[aria-pressed=true]{background:var(--white);color:var(--void)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:none;display:grid;place-items:center;color:var(--t2);transition:color .2s,border-color .2s,transform .5s var(--spring)}
.iconbtn:hover{color:var(--white);border-color:var(--white);transform:rotate(-90deg)}
.iconbtn svg{width:18px;height:18px}
.mprog{display:none;position:sticky;top:68px;z-index:39;padding:10px var(--gut);background:rgba(3,11,22,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);font-size:13px;color:var(--t2);align-items:center;gap:14px}
.mp-bar{flex:1;height:4px;border-radius:4px;background:var(--line2);overflow:hidden}
.mp-bar i{display:block;height:100%;background:var(--teal);border-radius:4px;transition:width .8s var(--ease)}
@media (max-width:900px){.spine{display:none}.mprog{display:flex}body[data-screen=welcome] .mprog{display:none}}
body[data-screen=welcome] .spine{visibility:hidden}
@media (max-width:480px){.logo .ar-n{display:none}.top{gap:10px}}

/* ---------- Layout ---------- */
main{position:relative;z-index:1}
.screen{max-width:1280px;margin:0 auto;padding:clamp(36px,7vh,88px) var(--gut) 140px}
.screen.enter{animation:sIn .6s var(--ease) both}
.screen.leave{animation:sOut .18s ease both}
.screen.fade{animation:fadeIn .4s ease both}
@keyframes sIn{from{opacity:0;transform:translateX(calc(var(--d) * var(--dir) * 56px))}to{opacity:1;transform:none}}
@keyframes sOut{to{opacity:0;transform:translateX(calc(var(--d) * var(--dir) * -28px))}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.narrow{max-width:860px}
.kicker{display:inline-flex;align-items:center;gap:10px;margin:0 0 22px;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
.kicker::before{content:"";width:22px;height:1.5px;background:var(--teal)}
[dir=rtl] .kicker{letter-spacing:0;font-size:14px;text-transform:none}
.display{margin:0;font-size:clamp(52px,7.6vw,128px);line-height:.98;letter-spacing:-.045em;font-weight:600;text-wrap:balance}
[dir=rtl] .display{letter-spacing:0;line-height:1.24;font-weight:700;font-size:clamp(46px,6.8vw,112px)}
.h1{margin:0;font-size:clamp(40px,5.4vw,88px);line-height:1.02;letter-spacing:-.038em;font-weight:600;max-width:17ch;text-wrap:balance}
[dir=rtl] .h1{letter-spacing:0;line-height:1.32;font-weight:700;font-size:clamp(36px,4.8vw,76px)}
.sub{margin-top:20px;font-size:clamp(17px,1.35vw,20px);line-height:1.6;color:var(--t2);max-width:56ch}
[dir=rtl] .sub{line-height:1.85}
.label{display:block;font-size:14px;font-weight:600;color:var(--white);margin-bottom:10px}
.hint{font-size:14px;color:var(--t3);margin-top:8px}
.err{display:flex;gap:8px;align-items:center;color:var(--white);font-size:14px;margin-top:10px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);border-inline-start:3px solid var(--white)}
.err svg{width:16px;height:16px;flex:none}
.panel{background:var(--navy);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,3vw,36px)}
.stack>*+*{margin-top:28px}
.actions{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:40px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}

/* ---------- Buttons ---------- */
.btn{--h:48px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--h);padding:0 24px;border-radius:999px;border:1px solid transparent;background:none;color:var(--white);font-size:15px;font-weight:600;line-height:1.2;text-decoration:none;white-space:nowrap;transition:transform .35s var(--spring),background .25s,border-color .25s,color .25s,box-shadow .35s var(--ease),opacity .25s}
.btn:active:not(:disabled){transform:scale(.96)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--teal);color:var(--void);box-shadow:0 12px 34px -14px rgba(25,230,193,.75)}
.btn.primary:hover:not(:disabled){box-shadow:0 18px 44px -12px rgba(25,230,193,.95)}
.btn.amber{background:var(--amber);color:var(--void);box-shadow:0 12px 34px -14px rgba(255,181,71,.75)}
.btn.amber:hover:not(:disabled){box-shadow:0 18px 44px -12px rgba(255,181,71,.95)}
.btn.ghost{border-color:var(--line2)}
.btn.ghost:hover:not(:disabled){border-color:var(--white)}
.btn.link{--h:36px;padding:0 6px;color:var(--teal)}
.btn.link:hover{text-decoration:underline;text-underline-offset:4px}
.btn.sm{--h:40px;padding:0 16px;font-size:14px}
.btn.lg{--h:56px;padding:0 30px;font-size:16px}
.btn.xl{--h:66px;padding:0 34px;font-size:17px}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
.btn.amber:disabled{opacity:1;background:var(--amber-a);color:var(--amber);border-color:var(--amber-b)}
[dir=rtl] .flip{transform:scaleX(-1)}
@media (max-width:560px){.actions .btn{flex:1 1 100%}.btn{white-space:normal;text-align:center}}

/* ---------- Inputs & chips ---------- */
.input,.textarea{width:100%;background:var(--lift);border:1px solid var(--line2);border-radius:16px;color:var(--white);font-size:17px;padding:16px 18px;transition:border-color .25s,box-shadow .3s var(--ease),background .25s}
.textarea{min-height:190px;resize:vertical;line-height:1.7}
.input::placeholder,.textarea::placeholder{color:rgba(255,255,255,.4)}
.input:hover,.textarea:hover{border-color:rgba(255,255,255,.32)}
.input:focus,.textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(25,230,193,.14);background:rgba(25,230,193,.03)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line2);background:none;color:var(--t2);font-size:15px;font-weight:500;transition:background .25s,color .25s,border-color .25s,transform .4s var(--spring)}
.chip:hover{border-color:var(--white);color:var(--white)}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:var(--void);font-weight:600;animation:press .45s var(--spring)}
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.92)}100%{transform:scale(1)}}

/* ---------- Welcome ---------- */
.hero{position:relative;min-height:calc(100dvh - 190px);display:flex;align-items:center}
.hero-copy{position:relative;z-index:2;max-width:1120px}
.display .w{display:inline-block;opacity:0;transform:translateY(.42em);animation:wRise .9s var(--ease) forwards;animation-delay:calc(var(--i) * 70ms + 120ms)}
.display em{font-style:normal;color:var(--teal);position:relative;white-space:nowrap}
.display em::after{content:"";position:absolute;inset-inline:0;bottom:.04em;height:.06em;background:var(--teal);transform:scaleX(0);transform-origin:var(--origin);animation:line 1s var(--ease) 1.1s forwards;border-radius:4px}
[dir=rtl] .display em::after{bottom:-.02em}
@keyframes wRise{to{opacity:1;transform:none}}
@keyframes line{to{transform:scaleX(1)}}
.rise{opacity:0;animation:wRise .9s var(--ease) forwards;animation-delay:calc(var(--i) * 70ms + 120ms);transform:translateY(16px)}
.lede{margin-top:30px;font-size:clamp(18px,1.5vw,22px);line-height:1.6;color:var(--t2);max-width:50ch}
[dir=rtl] .lede{line-height:1.85}
.ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px}
.loop{display:flex;flex-wrap:wrap;align-items:center;gap:10px;list-style:none;padding:0;margin:56px 0 0;color:var(--t3);font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
[dir=rtl] .loop{letter-spacing:0;text-transform:none;font-size:14px}
.loop li+li::before{content:"→";margin-inline-end:10px;color:var(--teal)}
[dir=rtl] .loop li+li::before{content:"←"}
.dial{position:absolute;z-index:1;inset-inline-end:-14%;top:50%;width:min(92vh,800px);aspect-ratio:1;transform:translateY(-50%);pointer-events:none}
.dial svg{width:100%;height:100%;overflow:visible}
.d-ring{fill:none;stroke:var(--line2);stroke-width:1}
.tk{stroke:rgba(255,255,255,.18);stroke-width:1}
.tk.big{stroke:rgba(255,255,255,.45);stroke-width:1.5}
.d-orbit{fill:none;stroke:var(--teal-b);stroke-width:1;stroke-dasharray:2 10;transform-origin:200px 200px;animation:spin 60s linear infinite}
.d-glow{fill:url(#glow)}
.needle{transform-origin:200px 200px;transform:rotate(var(--a,32deg));transition:transform 1.1s var(--ease)}
.needle line{stroke:var(--teal);stroke-width:2;stroke-linecap:round}
.needle circle{fill:var(--teal)}
.sway{transform-origin:200px 200px;animation:sway 7s ease-in-out infinite}
.d-mark .bowl{fill:none;stroke:var(--white);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.8s var(--ease) .3s forwards}
.d-mark .mdot{fill:var(--teal);transform-origin:16px 6.4px;transform:scale(0);animation:pop .6s var(--spring) 1.6s forwards}
.d-hub{fill:var(--teal)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
@media (max-width:900px){.dial{width:150vw;max-width:620px;top:auto;bottom:-34%;inset-inline-end:-46%;transform:none;opacity:.5}.hero{align-items:flex-start;min-height:calc(100dvh - 160px)}}

/* ---------- Story ---------- */
.meter{margin-top:14px;display:grid;gap:10px}
.meter .bar{height:6px;border-radius:6px;background:var(--line2);overflow:hidden}
.meter .bar i{display:block;height:100%;width:4%;border-radius:6px;background:rgba(255,255,255,.55);transition:width .5s var(--ease),background .4s}
.meter[data-band=ok] .bar i{background:rgba(25,230,193,.55)}
.meter[data-band=rich] .bar i{background:var(--teal)}
.meter p{font-size:14px;color:var(--t2)}
.meter b{color:var(--white);font-weight:600}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}

/* ---------- Analysis ---------- */
.scan{position:relative;overflow:hidden;margin-top:44px}
.scanline{position:absolute;inset-inline:0;top:-40%;height:40%;background:linear-gradient(to bottom,transparent,rgba(25,230,193,.16),transparent);animation:scan 2.4s cubic-bezier(.65,0,.35,1) infinite;pointer-events:none}
@keyframes scan{to{top:110%}}
.scan-text{font-size:clamp(18px,1.6vw,22px);line-height:1.8;color:var(--t3);max-width:70ch}
[dir=rtl] .scan-text{line-height:2}
.scan-text mark{background:transparent;color:inherit;border-radius:5px;padding:0 3px;transition:background .45s var(--ease),color .45s}
.scan-text mark.lit{background:rgba(25,230,193,.2);color:var(--white)}
.an-grid{display:grid;gap:36px;margin-top:40px}
@media (min-width:900px){.an-grid{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.stages li{display:flex;align-items:center;gap:14px;color:var(--t3);font-weight:500;transition:color .3s}
.stages .st{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:all .3s}
.stages .st svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .4s var(--spring)}
.stages .on{color:var(--white)}
.stages .on .st{border-color:var(--teal);border-top-color:transparent;animation:spin .8s linear infinite}
.stages .ok{color:var(--t2)}
.stages .ok .st{background:var(--teal);border-color:var(--teal);color:var(--void);animation:none}
.stages .ok .st svg{opacity:1;transform:none}
.found{display:flex;flex-wrap:wrap;gap:10px;min-height:48px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--teal-b);background:var(--teal-a);font-size:14px;font-weight:500;animation:chipIn .55s var(--spring) both}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--teal)}
@keyframes chipIn{from{opacity:0;transform:translateY(10px) scale(.7)}to{opacity:1;transform:none}}
.note{margin-top:44px;font-size:13px;color:var(--t3);display:flex;gap:8px;align-items:flex-start}
.note svg{width:16px;height:16px;flex:none;margin-top:2px}

/* ---------- Passport ---------- */
.pp-head{display:grid;gap:40px;align-items:end}
@media (min-width:1000px){.pp-head{grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr)}}
.pcard{position:relative;border-radius:30px;padding:28px;min-height:250px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:radial-gradient(120% 110% at 100% 0%,rgba(25,230,193,.24),transparent 55%),var(--navy);border:1px solid var(--line2);box-shadow:0 30px 70px -40px rgba(25,230,193,.5);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease)}
[dir=rtl] .pcard{background:radial-gradient(120% 110% at 0% 0%,rgba(25,230,193,.24),transparent 55%),var(--navy)}
.pcard::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.025) 22px 23px);pointer-events:none}
.pc-id{font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--t3)}
[dir=rtl] .pc-id{letter-spacing:0;font-size:13px}
.pc-name{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.pc-meta{color:var(--t2);font-size:14px}
.pc-n{display:flex;align-items:baseline;gap:10px}
.pc-n b{font-family:var(--num);font-size:84px;font-weight:600;line-height:.9;letter-spacing:-.04em;color:var(--teal)}
.pc-n span{color:var(--t2);font-size:14px}
.pc-mark{position:absolute;top:24px;inset-inline-end:24px;width:44px;height:44px;color:var(--teal)}
.skills{list-style:none;margin:48px 0 0;padding:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr))}
.sk{position:relative;display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:24px;background:var(--navy);border:1px solid var(--line);transition:border-color .35s,box-shadow .35s,opacity .35s,transform .45s var(--spring);animation:chipIn .6s var(--ease) both;animation-delay:calc(var(--i) * 45ms)}
.sk:hover{border-color:var(--line2)}
.sk h3{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;padding-inline-end:40px}
[dir=rtl] .sk h3{letter-spacing:0}

.pay{color:var(--amber);font-weight:600;font-family:var(--num)}
.otype{font-size:13px;color:var(--t3)}
.opp-foot .btn{margin-inline-start:auto}
.ring{position:relative;width:var(--s);height:var(--s);flex:none}

.toasts{position:fixed;z-index:90;inset-inline:0;bottom:24px;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}

function ring(score, size){
  const r = 26, c = +(2*Math.PI*r).toFixed(2), off = +(c*(1-score/100)).toFixed(2);
  return `<div class="ring" style="--s:${size}px" role="img" aria-label="${score}%"><svg viewBox="0 0 64 64"><circle class="trk" cx="32" cy="32" r="${r}" stroke-width="5"/><circle class="val" cx="32" cy="32" r="${r}" stroke-width="5" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/></svg><b><bdi class="num" data-count="${score}">0</bdi></b></div>`;
}
function drawRings(root=document){ requestAnimationFrame(() => requestAnimationFrame(() => $$(".ring .val", root).forEach(v => v.style.strokeDashoffset = v.dataset.off))); $$(".ring [data-count]", root).forEach(el => countUp(el, 0, +el.dataset.count, 1300)); }
function countUp(el, from, to, dur=900, suffix=""){
  if(!el) return; if(RM() || from === to){ el.textContent = to + suffix; return; }
  const t0 = performance.now();
  const f = now => { const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = Math.round(from+(to-from)*e) + suffix; if(k<1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}

  $("#toasts").append(el); while($("#toasts").children.length > 2) $("#toasts").firstElementChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 320); }, 3800);

function burst(from){
  if(RM() || !from) return; const r = from.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i=0;i<14;i++){ const p = document.createElement("span"); p.className = "pt"; const a = Math.random()*Math.PI*2, d = 40 + Math.random()*70;
    p.style.cssText = `left:${cx-3}px;top:${cy-3}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;animation-delay:${Math.random()*80}ms`;
    document.body.append(p); setTimeout(() => p.remove(), 1100); }
}
function typeInto(el, text, done){
  if(!el) return; if(RM()){ el.value = text; el.dispatchEvent(new Event("input",{bubbles:true})); done && done(); return; }
  el.value = ""; let i = 0; const step = Math.max(2, Math.round(text.length/90));
  const tick = () => { if(!document.body.contains(el)) return; i = Math.min(text.length, i+step); el.value = text.slice(0,i); el.scrollTop = el.scrollHeight; el.dispatchEvent(new Event("input",{bubbles:true})); if(i < text.length) setTimeout(tick, 16); else done && done(); };
  tick();
}

/* =====================================================================
   5. Engine — analysis, matching, plan, interview scoring.
   Deterministic on purpose: every number on screen can be explained.
   ===================================================================== */
const sentences = text => text.replace(/([.!?؟])\s+/g, "$1\n").split(/\n+/).map(s => s.trim()).filter(Boolean);
function analyze(){
  const out = {}, sents = sentences(S.story.text);
  for(const [id, re] of Object.entries(HINT)){
    for(const s of sents){ const m = s.match(re); if(!m) continue;
      out[id] = out[id] || { id, status:"found", conf:"high", ev:[] };
      if(out[id].ev.length < 2 && !out[id].ev.some(e => e.text === s)) out[id].ev.push({ src:"words", text:s, hl:m[0] }); }
  }
  for(const id of TYPE_SKILLS[S.story.type] || []) if(!out[id]) out[id] = { id, status:"found", conf:"med", ev:[{ src:"type" }] };
  if(S.profile.langs.length >= 3 && !out.multilingual) out.multilingual = { id:"multilingual", status:"found", conf:"high", ev:[{ src:"lang" }] };
  return out;
}
function merge(found){
  const prev = S.skills, next = {};
  for(const [id, f] of Object.entries(found)){ const p = prev[id];
    next[id] = { ...f, status: p && p.status !== "found" ? p.status : "found", ev:[...f.ev, ...(p ? p.ev.filter(e => e.src === "plan") : [])] }; }
  for(const [id, p] of Object.entries(prev)) if(!next[id] && p.ev.some(e => e.src === "plan")) next[id] = { ...p, ev:p.ev.filter(e => e.src === "plan") };
  S.skills = next;
}
function matchOpp(o){
  let tot = 0, got = 0; const have = [], miss = [];
  for(const [id, core] of o.req){ const w = core ? 2 : 1; tot += w; if(owned(id)){ got += w; have.push({id, core}); } else miss.push({id, core}); }
  miss.sort((a,b) => b.core - a.core);
  return { score: Math.round(got/tot*100), have, miss };
}
function buildSteps(){
  const o = opp(S.target), gaps = S.planSkills.slice(0,3), n = gaps.length, steps = [];
  if(n){ const span = Math.floor(21/n);
    gaps.forEach((id,k) => { const s = k*span + 1, e = (k+1)*span, l2 = s + Math.max(1, Math.round(span*.4)) - 1;
      steps.push({ key:id+":learn", kind:"learn", skill:id, d1:s, d2:l2 }, { key:id+":practice", kind:"practice", skill:id, d1:l2+1, d2:e-1 }, { key:id+":prove", kind:"prove", skill:id, d1:e, d2:e }); }); }
  steps.push({ key:"project", kind:"project", d1:22, d2:27 }, { key:"interview", kind:"interview", d1:28, d2:29 }, { key:"apply", kind:"apply", d1:30, d2:30 });
  return steps.map(s => ({ ...s, week: Math.min(4, Math.ceil(s.d1/7)) }));
}
function stepText(st){
  const o = opp(S.target), x = st.skill ? skName(st.skill) : "", Lr = LEARN[st.skill];
  if(st.kind === "learn") return Lr ? tx(Lr.learn) : t("gen_learn",{x});

  let extra = "";
  if(st.kind === "prove" || st.kind === "project") extra = `<p class="prove-note">${ic("spark")}${esc(t("r_prove_note"))}</p>`;
  if(st.kind === "interview") extra = `<button class="btn sm ${done?"ghost":"primary"}" data-act="goto" data-v="interview">${ic("mic")}${esc(t("r_open"))}</button>`;
  if(st.kind === "apply") extra = `<button class="btn sm ${S.applied?"ghost":"amber"}" data-act="goto" data-v="ready">${esc(t("r_see"))}${ic("arrow")}</button>`;
  const tick = st.kind === "interview" || st.kind === "apply"
    ? `<span class="tick" aria-hidden="true" style="cursor:default">${ic("check")}</span>`
    : `<button class="tick" data-act="step" data-v="${st.key}" aria-pressed="${done}" aria-label="${esc(t("kinds")[st.kind])}: ${esc(text)}">${ic("check")}</button>`;
  return `<li class="step k-${st.kind} ${done?"done":""}" data-key="${st.key}">${tick}
    <div><p class="step-meta">${ic(KIND_IC[st.kind])}${esc(t("kinds")[st.kind])}${st.skill ? " · " + esc(skName(st.skill)) : ""} · <bdi>${esc(day)}</bdi>${esc(hrs)}</p>
      <p class="step-t">${esc(text)}</p>${extra}</div></li>`;
}
function planProgress(){ const steps = buildSteps(); return { steps, done: steps.filter(s => S.done[s.key]).length }; }
VIEW.plan = () => {
  const o = opp(S.target), m = matchOpp(o), { steps, done } = planProgress();
  if(S.startScore == null) S.startScore = m.score;
  const weeks = [1,2,3,4].map(w => steps.filter(s => s.week === w)).map((ss,i) => ss.length ? `<section class="panel week"><h2>${esc(t("r_week",{n:i+1}))}</h2><ol class="steps">${ss.map(stepHTML).join("")}</ol></section>` : "").join("");
  return `<div>
    <p class="kicker">${esc(t("r_kicker"))}</p><h1 class="h1">${esc(t("r_title",{a:S.startScore}))}</h1><p class="sub">${esc(t("r_sub"))}</p>
    <div class="plan-grid">
      <aside class="plan-aside"><div class="panel">
        <p class="label" style="color:var(--t2);font-weight:500">${esc(t("r_readiness",{role:tx(o.title)}))}</p>
        <p class="r-num"><bdi class="num" id="r-num">${m.score}</bdi><small>%</small></p>
        <div class="r-bar"><i id="r-bar" style="width:${m.score}%"></i></div>
        <div class="r-meta"><span id="r-steps">${t("r_steps",{a:done,b:steps.length})}</span><span>${t("r_start",{a:S.startScore})}</span></div>
        <button class="btn primary btn-block" style="width:100%;margin-top:22px" data-act="goto" data-v="interview">${ic("mic")}${esc(t("r_go"))}</button>
      </div></aside>
      <div>${weeks}</div>
    </div></div>`;
};
function bubble(q, i, typing){
  const o = opp(S.target);
  return `<div class="bub rec" data-q="${i}"><p class="who"><span class="av">${mark(2.4)}</span>${esc(t("i_rec",{org:o.org}))} · ${esc(t("i_q",{a:i+1,b:3}))}</p>
    ${typing ? `<span class="dots" role="status" aria-label="${esc(t("i_typing"))}"><i></i><i></i><i></i></span><p class="qt" hidden>${esc(q)}</p>` : `<p class="qt">${esc(q)}</p>`}</div>`;
}
function feedback(s, anim){
  return `<div class="fb ${anim?"anim":""}"><div class="fb-top"><b class="num">${s.total}</b><span>/100</span></div>
    ${["clarity","evidence","relevance"].map(k => `<div class="fb-row"><span>${esc(t("i_scores")[k])}</span><div class="bar"><i style="--w:${s[k]}%"></i></div><b>${s[k]}</b></div>`).join("")}
    <p class="fb-tip">${ic("spark")}<span>${esc(t(s.tip))}</span></p></div>`;
}
function chatHTML(animLast){
  let h = ""; const n = S.iv.answers.length;
  for(let i=0;i<=S.iv.cur;i++){
    h += bubble(ivQuestion(i), i, i === S.iv.cur && ui.seenQ < i && n === i);
    if(i < n) h += `<div class="bub you" aria-label="${esc(t("i_ans"))}">${esc(S.iv.answers[i])}</div>` + feedback(S.iv.scores[i], animLast && i === n-1);
  }
  return h;
}
function composerHTML(){
  const n = S.iv.answers.length;
  if(n === S.iv.cur) return `<label class="sr" for="f-ans">${esc(t("i_ans"))}</label>
    <textarea class="textarea" id="f-ans" placeholder="${esc(t("i_ph"))}"></textarea>
    <p class="err" id="ans-err" hidden role="alert">${ic("alert")}${esc(t("i_err"))}</p>
    <div class="row"><button class="btn link" data-act="suggest">${ic("spark")}${esc(t("i_suggest"))}</button>
      <button class="btn primary lg" data-act="answer">${ic("send")}${esc(t("i_send"))}</button></div>`;
  if(S.iv.cur < 2) return `<div class="row" style="justify-content:flex-end"><button class="btn primary lg" data-act="next-q">${esc(t("i_next"))}${ic("arrow")}</button></div>`;
  return `<div class="row" style="justify-content:flex-end"><button class="btn primary lg magnetic" data-act="finish-iv">${esc(t("i_finish"))}${ic("arrow")}</button></div>`;
}
VIEW.interview = () => {
  const o = opp(S.target);
  return `<div class="narrow">
    <p class="kicker">${esc(t("i_kicker"))}</p><h1 class="h1">${esc(t("i_title"))}</h1><p class="sub">${esc(t("i_sub",{role:tx(o.title)}))}</p>
    <div class="chat" id="chat" aria-live="polite">${chatHTML(false)}</div>
    <div class="composer" id="composer">${composerHTML()}</div></div>`;
};
VIEW.ready = () => {
  const o = opp(S.target), m = matchOpp(o), hi = m.score >= 80;
  const iv = S.iv.scores.length ? Math.round(S.iv.scores.reduce((a,s) => a + s.total, 0) / S.iv.scores.length) : null;
  return `<div>
    <div class="ready-hero"><p class="kicker">${esc(t("y_kicker"))}</p>
      <p class="big" aria-label="${m.score}% ${esc(t("y_readiness"))}"><bdi id="y-num">0</bdi><small>%</small></p>
      <h1 class="h1">${esc(hi ? t("y_title_hi",{role:tx(o.title)}) : t("y_title_lo"))}</h1>
      <p class="sub">${esc(hi ? t("y_sub_hi") : t("y_sub_lo"))}</p></div>
    <div class="stats">
      <div><b class="num" data-n="${confirmedCount()}">0</b><span>${esc(t("y_skills"))}</span></div>
      <div><b class="num" data-n="${proofCount()}">0</b><span>${esc(t("y_proofs"))}</span></div>
      <div><b class="num" ${iv == null ? "" : `data-n="${iv}"`}>${iv == null ? "—" : "0"}</b><span>${esc(t("y_interview"))}</span></div></div>
    <article class="opp final is-target" style="--i:0">
      <div class="opp-top"><span class="org" aria-hidden="true">${o.ini}</span><div class="opp-h"><p>${esc(o.org)} · ${esc(tx(o.city))}</p><h3>${esc(tx(o.title))}</h3></div></div>
      <div class="opp-foot" style="margin-top:0"><span class="pay"><bdi dir="ltr">${esc(o.pay)}</bdi></span><span class="otype">${esc(t("otypes")[o.type])}</span>
        <button class="btn lg amber magnetic" data-act="apply" ${S.applied ? "disabled" : ""}>${S.applied ? ic("check") + esc(t("y_applied_btn")) : esc(t("y_apply")) + ic("arrow")}</button></div></article>
    <div class="impact"><div class="tenone" aria-hidden="true">${Array.from({length:10}, (_,i) => `<i style="--i:${i}"></i>`).join("")}<i class="arr"></i><i class="one"></i></div><p>${esc(t("y_impact"))}</p></div>
    <div class="actions"><button class="btn ghost" data-act="goto" data-v="plan">${ic("back")}${esc(t("y_plan"))}</button>
      <button class="btn ghost" data-act="goto" data-v="passport">${esc(t("y_passport"))}</button></div></div>`;
};

/* =====================================================================
   8. After-mount behaviour
   ===================================================================== */
const AFTER = {};
AFTER.welcome = () => {
  const dialEl = $(".dial"), needle = $("#needle"); if(!dialEl || !needle) return;
  const onMove = e => { if(!document.body.contains(needle)) return window.removeEventListener("pointermove", onMove);
    const r = dialEl.getBoundingClientRect(), dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    needle.style.setProperty("--a", (Math.atan2(dx, -dy) * 180 / Math.PI).toFixed(1) + "deg"); };
  if(matchMedia("(hover:hover)").matches && !RM()) window.addEventListener("pointermove", onMove, { passive:true });
};
function updateMeter(){
  const el = $("#meter"); if(!el) return;
  const text = S.story.text, w = text.trim().split(/\s+/).filter(Boolean).length;
  const hints = Object.values(HINT).filter(re => re.test(text)).length;
  const score = Math.min(100, Math.round(w/60*45 + hints*7 + (/\d/.test(text) ? 8 : 0)));
  const band = score < 34 ? "thin" : score < 68 ? "ok" : "rich", d = t("det")[band];
  el.dataset.band = band; $("i", el).style.width = Math.max(4, score) + "%";
  $("#meter-l").innerHTML = `<b>${esc(d[0])}</b> ${esc(d[1])}`;
}
AFTER.story = () => { updateMeter(); if(ui.autoplay){ ui.autoplay = false; setTimeout(() => typeInto($("#f-story"), EXAMPLE[L()], () => setTimeout(() => ACT["story-go"](), 450)), 500); } };
AFTER.analysis = () => {
  const run = ++ui.runId, alive = () => run === ui.runId && S.screen === "analysis";
  const found = analyze(), ids = Object.keys(found).sort((a,b) => RARE.has(a) - RARE.has(b));
  const fast = RM(), stages = $$("#stages li"), marks = $$(".scan-text mark"), box = $("#found");
  const stageMs = fast ? 120 : 950;
  marks.forEach((m,i) => setTimeout(() => alive() && m.classList.add("lit"), fast ? 0 : 300 + i*210));
  ids.forEach((id,i) => setTimeout(() => { if(!alive()) return; const s = document.createElement("span"); s.className = "pill"; s.innerHTML = `<i></i>${esc(skName(id))}`; box.append(s); }, fast ? 0 : stageMs + i*170));
  stages.forEach((li,i) => setTimeout(() => { if(!alive()) return; stages.forEach((x,k) => x.className = k < i ? "ok" : k === i ? "on" : ""); }, i*stageMs));
  setTimeout(() => { if(!alive()) return; stages.forEach(x => x.className = "ok"); merge(found); save(); setTimeout(() => alive() && go("passport"), fast ? 50 : 650); }, stages.length*stageMs);
};
AFTER.passport = () => { countUp($("#pc-n"), 0, confirmedCount(), 900); bindTilt(); };
AFTER.match = () => { drawRings($("#main")); bindTilt(); };
AFTER.gap = () => drawRings($("#main"));
AFTER.interview = () => revealQuestion();
AFTER.ready = () => {
  const o = opp(S.target), m = matchOpp(o);
  countUp($("#y-num"), 0, m.score, 1600);
  $$(".stats [data-n]").forEach(b => countUp(b, 0, +b.dataset.n, 1200));
  if(!S.done.apply && S.applied) S.done.apply = true;
};
function revealQuestion(){
  const b = $$("#chat .dots").pop(); if(!b) return;
  const q = S.iv.cur;
  setTimeout(() => { const host = b.parentElement; if(!document.body.contains(host)) return; b.remove(); const p = $(".qt", host); p.hidden = false; p.style.animation = "fadeIn .4s ease"; ui.seenQ = q; const a = $("#f-ans"); a && a.focus({preventScroll:true}); }, RM() ? 0 : 1100);
}
function bindTilt(){
  if(RM() || !matchMedia("(hover:hover)").matches) return;
  $$(".tilt").forEach(el => {
    el.addEventListener("pointermove", e => { const r = el.getBoundingClientRect(), x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5;
      el.style.setProperty("--ry", (x*6).toFixed(2)+"deg"); el.style.setProperty("--rx", (-y*6).toFixed(2)+"deg"); });
    el.addEventListener("pointerleave", () => { el.style.setProperty("--ry","0deg"); el.style.setProperty("--rx","0deg"); });
  });
}
function refreshPassportCounts(){
  const all = Object.keys(S.skills).length, c = confirmedCount();
  const el = $("#pp-count"); if(el) el.innerHTML = t("pp_count",{a:c,b:all});
  const n = $("#pc-n"); if(n) countUp(n, +n.textContent || 0, c, 500);
  const nx = $("#pp-next"); if(nx) nx.disabled = !c;
}

/* =====================================================================
   9. Actions
   ===================================================================== */
const ACT = {
  home: () => go("welcome"),
  goto: el => go(el.dataset.v),
  station: el => go(STATION_SCREEN[+el.dataset.v]),
  lang: el => { S.lang = el.dataset.v; save(); paint(0, true); },
  reset: () => { const lang = S.lang; S = blank(); S.lang = lang; ui.seenQ = -1; ui.runId++; save(); go("welcome"); toast(t("toast_reset")); },
  start: () => go(S.profile.name.trim() ? "story" : "profile"),
  demo: () => {
    const lang = S.lang; S = blank(); S.lang = lang; ui.seenQ = -1;
    S.profile = { name:"Yassir", stage:"final", field: DEMO_FIELD[L()], langs:["ar","dar","fr","en"] };
    S.story = { type:"family", text:"" }; S.max = 0; ui.autoplay = true; save(); go("story");
  },
  stage: el => { S.profile.stage = el.dataset.v; save(); $$('[data-act="stage"]').forEach(b => b.setAttribute("aria-pressed", b === el)); },
  spoken: el => { const v = el.dataset.v, a = S.profile.langs; S.profile.langs = a.includes(v) ? a.filter(x => x !== v) : [...a, v]; save(); el.setAttribute("aria-pressed", S.profile.langs.includes(v)); },
  "profile-next": () => {
    if(!S.profile.name.trim()){ $("#name-err").hidden = false; $("#f-name").setAttribute("aria-invalid","true"); $("#f-name").focus(); return; }
    go("story");
  },
  stype: el => { S.story.type = el.dataset.v; save(); $$('[data-act="stype"]').forEach(b => b.setAttribute("aria-pressed", b === el)); },
  example: () => { S.story.type = "family"; $$('[data-act="stype"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === "family")); typeInto($("#f-story"), EXAMPLE[L()]); },
  "story-go": () => {
    const w = S.story.text.trim().split(/\s+/).filter(Boolean).length;
    if(w < 12){ const e = $("#story-err"); if(e){ e.hidden = false; $("#f-story").focus(); } return; }
    go("analysis");
  },
  sk: el => {
    const id = el.dataset.id, st = el.dataset.v, li = el.closest(".sk"); S.skills[id].status = st; save();
    const tmp = document.createElement("ul"); tmp.innerHTML = skCard(S.skills[id], 0); const nl = tmp.firstElementChild;
    nl.style.animation = "none"; if(st === "confirmed") nl.classList.add("stamp");
    li.replaceWith(nl); ($("button", nl) || nl).focus({preventScroll:true});
    if(st === "confirmed") burst($(".sk-check", nl));
    refreshPassportCounts();
  },
  "confirm-all": () => {
    Object.values(S.skills).forEach(s => { if(s.status === "found") s.status = "confirmed"; }); save();
    $$("#skills .sk").forEach((li,i) => { const tmp = document.createElement("ul"); tmp.innerHTML = skCard(S.skills[li.dataset.id], i); const nl = tmp.firstElementChild; nl.style.animation = "none"; li.replaceWith(nl); setTimeout(() => nl.classList.add("stamp"), i*40); });
    refreshPassportCounts(); $("#pp-next").focus();
  },
  aim: el => {
    const id = el.dataset.v;
    if(S.target !== id){ const m = matchOpp(opp(id)); S.target = id; S.planSkills = m.miss.map(x => x.id); S.startScore = m.score; S.done = {}; S.iv = { cur:0, answers:[], scores:[] }; S.applied = false; ui.seenQ = -1;
      S.max = Math.min(S.max, 3); }
    go("gap");
  },
  step: el => {
    const key = el.dataset.v, st = buildSteps().find(s => s.key === key); if(!st) return;
    const o = opp(S.target), before = matchOpp(o).score, was = !!S.done[key];
    if(was){ delete S.done[key]; if(st.kind === "prove" || st.kind === "project") undoProof(key); }
    else { S.done[key] = true;
      if(st.kind === "prove") addProof(st.skill, stepText(st), key);
      if(st.kind === "project") o.req.filter(r => r[1] && owned(r[0])).forEach(r => addProof(r[0], stepText(st), key)); }
    save();
    const after = matchOpp(o).score, li = el.closest(".step");
    const tmp = document.createElement("ol"); tmp.innerHTML = stepHTML(st); const nl = tmp.firstElementChild; li.replaceWith(nl); $(".tick", nl).focus({preventScroll:true});
    const { steps, done } = planProgress();
    $("#r-steps").innerHTML = t("r_steps",{a:done,b:steps.length});
    $("#r-bar").style.width = after + "%"; countUp($("#r-num"), before, after, 1000);
    if(!was && (st.kind === "prove" || st.kind === "project")){ burst($(".tick", nl)); if(st.kind === "prove") toast(t("r_toast",{x:skName(st.skill),a:before,b:after})); }
  },
  suggest: () => typeInto($("#f-ans"), suggestion(S.iv.cur)),
  answer: () => {
    const a = $("#f-ans"), v = a.value.trim();
    if(v.split(/\s+/).filter(Boolean).length < 3){ $("#ans-err").hidden = false; a.focus(); return; }
    S.iv.answers.push(v); S.iv.scores.push(scoreAnswer(v, opp(S.target))); ui.seenQ = S.iv.cur; save();
    $("#chat").innerHTML = chatHTML(true); $("#composer").innerHTML = composerHTML();
    const fb = $$("#chat .fb").pop(); fb && fb.scrollIntoView({ behavior: RM() ? "auto" : "smooth", block:"center" });
    const b = $("#composer button"); b && b.focus({preventScroll:true});
  },
  "next-q": () => { S.iv.cur = Math.min(2, S.iv.cur + 1); save(); $("#chat").innerHTML = chatHTML(false); $("#composer").innerHTML = composerHTML(); revealQuestion();
    $$("#chat .bub.rec").pop().scrollIntoView({ behavior: RM() ? "auto" : "smooth", block:"center" }); },
  "finish-iv": () => { S.done.interview = true; save(); go("ready"); },
  apply: el => { S.applied = true; S.done.apply = true; save(); burst(el); el.disabled = true; el.innerHTML = ic("check") + esc(t("y_applied_btn")); toast(t("y_applied",{org:opp(S.target).org})); chrome(); }
};

/* =====================================================================
   10. Wiring
   ===================================================================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener("input", e => {
  const b = e.target.dataset && e.target.dataset.bind; if(!b) return;
  if(b === "story"){ S.story.text = e.target.value; updateMeter(); const er = $("#story-err"); if(er) er.hidden = true; }
  else { S.profile[b] = e.target.value; if(b === "name"){ $("#name-err").hidden = true; e.target.removeAttribute("aria-invalid"); } }
  clearTimeout(ui.saveT); ui.saveT = setTimeout(save, 250);
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "f-name"){ e.preventDefault(); ACT["profile-next"](); }
  if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ if(e.target.id === "f-story") ACT["story-go"](); if(e.target.id === "f-ans") ACT.answer(); }
});
/* Magnetic CTAs — the primary action leans toward the pointer. */
document.addEventListener("pointermove", e => {
  if(RM() || !matchMedia("(hover:hover)").matches) return;
  const m = e.target.closest && e.target.closest(".magnetic");
  $$(".magnetic").forEach(b => { if(b !== m) b.style.translate = ""; });
  if(m){ const r = m.getBoundingClientRect(); m.style.translate = `${((e.clientX - r.left - r.width/2) * .18).toFixed(1)}px ${((e.clientY - r.top - r.height/2) * .28).toFixed(1)}px`; }
}, { passive:true });

/* Boot */
if(S.screen === "analysis") S.screen = Object.keys(S.skills).length ? "passport" : "story";
S.screen = S.screen === "welcome" ? "welcome" : resolve(S.screen);
paint(0, true);
})();
</script>
</body>
</html>
