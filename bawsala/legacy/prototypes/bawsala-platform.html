}
@media (max-width:560px){
  .pub-nav .top-r>.btn{display:none}
  .pub-nav-in{gap:10px}
  .ft{flex-direction:column;gap:2px;font-size:12px;min-height:58px}
  .film-stage{min-height:300px;padding:18px}
  .fc-opp{grid-template-columns:auto minmax(0,1fr)}
  .fc-opp .fc-fit{grid-column:1/-1;font-size:26px}
  .fc-ready{flex-direction:column;align-items:flex-start}
  .fc-ladder .seg{font-size:12px;padding:0 8px}
  .cm-acts .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){ .rv{opacity:1;transform:none} }
body.calm .rv{opacity:1;transform:none}
.next-meta .pill{white-space:normal;line-height:1.4;padding-block:5px;max-width:100%}
.next-meta .pill svg{flex:none}

/* =====================================================================
   BAWSALA · product layer (website, student, institution, operations)
   Same identity: cream ground, deep green structure, sage growth, soft gold
   for "found by BAWSALA". No gradients, no glow, no glass.
   ===================================================================== */
.m-only{display:none!important}
.d-only{display:inline-flex}
kbd{font:500 11px/1 var(--f-mono);padding:3px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);color:var(--muted);white-space:nowrap}
.fine{font-size:13px}
#app main h1:focus,#app .csi h1:focus,#app .stage h1:focus{outline:none}
.av-c{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--g);color:var(--on-g);font:600 13px/1 var(--f-lat);letter-spacing:.02em;flex:none}
.av-c.lg{width:56px;height:56px;font-size:19px}
.who{display:inline-flex;align-items:center;gap:10px;min-width:0}
.who>span:last-child{display:grid;min-width:0;line-height:1.35}
.who small{font-size:12px;font-weight:400}
.logo.sm{width:34px;height:34px;border-radius:var(--r9);font-size:12px;background:var(--g700);color:var(--g)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin-block:4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.f-err{color:var(--err);font-size:13px;min-height:0;font-weight:500}
.f-err:empty{display:none}
.f-note{font-size:13px;margin-top:8px}
.inp[aria-invalid=true]{border-color:var(--err);box-shadow:0 0 0 3px var(--err-l)}
select.inp{appearance:none;background-image:none;padding-inline-end:14px;cursor:pointer}
.done-state{display:grid;justify-items:center;text-align:center;gap:12px;padding:12px 4px}
.ds-i{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--g700);color:var(--g)}
.ds-i svg{width:26px;height:26px}
.empty-c{display:grid;justify-items:center;gap:10px;text-align:center;padding-block:28px}
.empty-pg{display:grid;justify-items:center;text-align:center;gap:14px;padding-block:clamp(48px,10vw,120px)}
.empty-pg h1{font-size:clamp(26px,3.4vw,38px)}
.empty-pg .nf svg{width:96px;height:96px;animation:nod 3s var(--ease) infinite}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
.back-l{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;font-weight:500;padding:4px 0;margin-bottom:-8px;width:max-content}
.back-l svg{width:16px;height:16px}
.back-l:hover{color:var(--g)}
.status{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink2)}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.s-active,.status.s-ok,.status.s-pub{background:var(--g700);color:var(--g)}
.status.s-pending,.status.s-invited{background:var(--gold-xl);color:var(--gold-dd)}
.status.s-setup{background:var(--sage-l);color:#3F5F51}
.status.s-paused,.status.s-off{background:var(--sunk);color:var(--muted)}
.status.s-declined{background:var(--err-l);color:var(--err)}
.pill.gold{background:var(--gold-xl);color:var(--gold-dd)}
.pill.warn{background:var(--gold-xl);color:var(--gold-dd)}
.warn-t{color:var(--gold-dd);font-weight:600}
.danger-t{color:var(--err)!important}

/* ---------- portal switcher ---------- */
.portal{background:var(--deep);color:rgba(248,246,239,.72);font-size:12.5px;position:relative;z-index:40}
.portal-in{display:flex;align-items:center;gap:16px;min-height:42px;max-width:1440px;margin-inline:auto;padding-inline:clamp(12px,3vw,24px)}
.portal-l{display:inline-flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(212,175,124,.18)}
.portal-seg{display:flex;gap:2px;margin-inline:auto;padding:3px;border-radius:11px;background:rgba(255,255,255,.06)}
.portal-seg button{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 12px;border-radius:8px;color:rgba(248,246,239,.72);font-weight:600;font-size:12.5px;transition:background .15s,color .15s}
.portal-seg button:hover{color:#fff;background:rgba(255,255,255,.06)}
.portal-seg button[aria-current=true]{background:var(--paper);color:var(--g)}
.portal-seg svg{width:15px;height:15px}
.portal-k{display:inline-flex;align-items:center;gap:8px;min-height:30px;padding:0 6px 0 10px;border-radius:8px;color:rgba(248,246,239,.72)}
.portal-k:hover{background:rgba(255,255,255,.08);color:#fff}
.portal-k svg{width:15px;height:15px}
.portal-k kbd{background:transparent;border-color:rgba(255,255,255,.18);color:rgba(248,246,239,.7)}
.portal :focus-visible{outline-color:var(--gold)}
.maint{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;background:var(--gold-xl);color:var(--gold-dd);font-size:14px;font-weight:500;border-bottom:1px solid var(--gold-l);text-align:center}
.maint svg{width:17px;height:17px;flex:none}

/* ---------- popovers & palette ---------- */
.mpop{position:fixed;z-index:120;min-width:240px;max-width:min(320px,calc(100vw - 16px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r13);box-shadow:0 18px 48px -18px rgba(15,61,54,.35);padding:6px;animation:popin .16s var(--ease) both;display:grid}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.pop-h{padding:10px 10px 8px}
.pop-who{display:flex;align-items:center;gap:10px}
.pop-who b{display:block;font-size:14px}
.pop-who small{font-size:12px;color:var(--muted)}
.pop-sep{height:1px;background:var(--line);margin:4px 6px}
.pop-i{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:var(--r9);font-size:14px;color:var(--ink);text-align:start;width:100%}
.pop-i svg{width:17px;height:17px;color:var(--ink2);flex:none}
.pop-i:hover,.pop-i:focus-visible{background:var(--sunk);outline:none}
.scrim:has(.pal-modal){align-items:start;padding-top:min(14vh,120px)}
.modal.pal-modal{width:min(640px,100%);padding:0;gap:0;overflow:hidden;max-height:min(70vh,560px);grid-template-rows:auto minmax(0,1fr) auto}
.pal{display:contents}
.pal-in{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pal-in svg{width:20px;height:20px;color:var(--muted);flex:none}
.pal-q{flex:1;min-width:0;border:0;background:none;font-size:17px;outline:none;padding:4px 0}
.pal-l{overflow:auto;padding:6px;min-height:120px}
.pal-g{font-size:11.5px;font-weight:600;color:var(--muted);padding:12px 12px 4px;letter-spacing:.02em}
.pal-i{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border-radius:var(--r9);text-align:start;font-size:14.5px}
.pal-i svg{width:17px;height:17px;color:var(--ink2);flex:none}
.pal-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-i small{color:var(--muted);font-size:12px;white-space:nowrap}
.pal-i.on{background:var(--g700);color:var(--g)}
.pal-i.on svg{color:var(--g)}
.pal-empty{padding:28px;text-align:center;color:var(--muted)}
.pal-f{display:flex;gap:18px;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--paper)}
.pal-f kbd{margin-inline-end:2px}
.modal.side{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);max-height:none;height:100%;border-radius:0;padding:0;gap:0;grid-template-rows:auto minmax(0,1fr);animation:slide-in .28s var(--ease) both;align-content:stretch}
html[dir=rtl] .modal.side{animation-name:slide-in-r}
.dr-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.dr-h h2{font-size:20px}
.dr-h .ibtn{position:static}
.dr-b{overflow:auto;padding:22px;display:grid;gap:22px;align-content:start}
.dr-s{display:grid;gap:10px}
.dr-goal{display:flex;align-items:center;gap:14px}
.dr-goal b{display:block}
.dr-acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- app & console shells ---------- */
.app-col{min-width:0;display:flex;flex-direction:column}
.atop{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:12px;min-height:62px;padding-inline:clamp(16px,3vw,32px);background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.atop .top-r{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.search-pill{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 8px 0 12px;width:min(380px,100%);border-radius:var(--r13);background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:14px;transition:border-color .15s}
html[dir=rtl] .search-pill{padding:0 12px 0 8px}
.search-pill:hover{border-color:var(--line2);color:var(--ink2)}
.search-pill svg{width:17px;height:17px;flex:none}
.search-pill span{flex:1;text-align:start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bell{position:relative}
.bdg{position:absolute;top:2px;inset-inline-end:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--err);color:#fff;font:600 10.5px/17px var(--f-lat);font-style:normal;text-align:center;border:2px solid var(--paper);box-sizing:content-box}
.av-btn{display:inline-flex;align-items:center;gap:8px;padding:3px;border-radius:999px;font-size:14px;font-weight:600;transition:background .15s}
.av-btn .d-only{padding-inline-end:10px}
.av-btn:hover{background:var(--sunk)}
.brand-btn{display:inline-flex;border-radius:var(--r9)}
.nav-i .n.hot{background:var(--err);color:#fff;border-radius:9px;padding:0 6px;min-width:18px;text-align:center;font-weight:600}
.rail .brand-btn{padding:4px 10px 20px}
.rail .brand-btn .brand{padding:0}
.shell .main{flex:1}
.con .rail{gap:2px}
.org{display:flex;align-items:center;gap:10px;padding:2px 6px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
.org b{display:block;font-size:14px;line-height:1.3}
.org small{display:block;font-size:12px;color:var(--muted)}
.org-m{display:inline-grid;place-items:center;min-width:38px;height:38px;padding:0 6px;border-radius:var(--r9);background:var(--band);color:#fff;font:700 12px/1 var(--f-mono);letter-spacing:.04em;flex:none}
.nav-g{font-size:11.5px;font-weight:600;color:var(--muted);padding:16px 12px 6px;letter-spacing:.02em}
.who-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r13);background:var(--paper);border:1px solid var(--line);min-width:0}
.who-card>span{display:grid;min-width:0}
.who-card b{font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-card small{font-size:12px;color:var(--muted)}
.con .rail-foot .nav-i{min-height:38px;font-size:14px}
.org-mini .org-m{min-width:34px;height:34px;font-size:11px}
/* operations: the dark control room */
.con.ops .rail{background:var(--deep);border-color:rgba(255,255,255,.06);color:rgba(248,246,239,.86)}
.con.ops .org{border-color:rgba(255,255,255,.08)}
.con.ops .org small,.con.ops .nav-g{color:rgba(248,246,239,.5)}
.con.ops .org-m{background:var(--gold);color:var(--g50)}
.con.ops .nav-i{color:rgba(248,246,239,.74)}
.con.ops .nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.con.ops .nav-i[aria-current=page]{background:rgba(212,175,124,.16);color:#F4E6CC}
.con.ops .nav-i .n{color:rgba(248,246,239,.6)}
.con.ops .who-card{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.08)}
.con.ops .who-card small{color:rgba(248,246,239,.55)}
.con.ops .av-c{background:var(--gold);color:var(--g50)}
.con.ops .atop .av-c{background:var(--deep);color:var(--gold)}
.env{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;background:var(--g700);color:var(--g);font-size:12px;font-weight:600;white-space:nowrap}
.live-d{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,111,91,.45)}70%{box-shadow:0 0 0 7px rgba(47,111,91,0)}100%{box-shadow:0 0 0 0 rgba(47,111,91,0)}}
.ph-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- console building blocks ---------- */
.kpi{position:relative;gap:4px;padding:18px 18px 16px;align-content:start;overflow:hidden}
.kpi .kpi-l{font-size:13px;color:var(--ink2);font-weight:500}
.kpi b{font-size:30px;letter-spacing:-.02em}
.kpi b span,.kpi b small{font:inherit;color:inherit}
.kpi b .of{font-size:16px;color:var(--muted);font-weight:500}
.kpi b .status{font-size:12px;letter-spacing:0;vertical-align:middle}
.kpi .delta{position:absolute;top:16px;inset-inline-end:16px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--g700);color:var(--ok)}
.kpi .delta.dn{background:var(--err-l);color:var(--err)}
.kpi .spark{margin-top:6px;width:100%;max-width:140px;height:30px}
.spark path{fill:none;stroke:var(--sage);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--g)}
.chart.area .gl{stroke:var(--line);stroke-dasharray:3 4}
.chart.area .ax{fill:var(--muted);font-size:12px}
.chart.area .ar{fill:var(--g700)}
.chart.area .ln{fill:none;stroke:var(--g);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:none;stroke-dashoffset:0;animation:none}
.chart.area .pt circle{fill:var(--surface);stroke:var(--g);stroke-width:2}
.chart.area .pt circle.last{fill:var(--g)}
.chart.area .val{fill:var(--ink);font-weight:700;font-size:13px}
.panel.flush{padding:0;overflow:hidden}
.panel.flush .tbl th:first-child,.panel.flush .tbl td:first-child{padding-inline-start:20px}
.panel.flush .tbl th:last-child,.panel.flush .tbl td:last-child{padding-inline-end:20px}
.pad{padding:18px 20px}
.sec-h.pad{padding:18px 20px 6px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl thead th{background:var(--paper);white-space:nowrap}
.tbl th[scope=row] small,.tbl td small{display:block}
.tbl.hover tbody tr{cursor:pointer;transition:background .12s}
.tbl.hover tbody tr:hover,.tbl tbody tr:focus-visible{background:var(--paper)}
.tbl tbody tr:focus-visible{outline:2px solid var(--g);outline-offset:-2px}
.tbl tr.off th,.tbl tr.off td{color:var(--muted)}
.tbl tr.off .who .logo{opacity:.5}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}
.tbl-wrap.scrolls{background:linear-gradient(to right,var(--surface),var(--surface))}
.rcell{display:inline-grid;grid-template-columns:72px auto;gap:10px;align-items:center}
.rcell .tr{height:6px;border-radius:4px;background:var(--sunk);overflow:hidden}
.rcell .tr i{display:block;height:100%;width:0;background:var(--g);border-radius:4px;transition:width .8s var(--ease)}
.rcell b{font-size:13px;font-weight:600}
.filters{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.filters .chips-wrap{justify-content:flex-start}
.srch{position:relative;display:flex;align-items:center;width:min(300px,100%)}
.srch svg{position:absolute;inset-inline-start:12px;width:17px;height:17px;color:var(--muted);pointer-events:none}
.srch .inp{padding-block:9px;padding-inline:38px 12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs [role=tab]{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .15s}
.tabs [role=tab] svg{width:17px;height:17px}
.tabs [role=tab]:hover{color:var(--ink)}
.tabs [role=tab][aria-selected=true]{color:var(--g);border-bottom-color:var(--g)}
.tabs .n{font-size:12px;color:var(--muted);font-weight:500}
.attn-list{display:grid}
.attn-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.attn-row:last-child{border-bottom:0}
.attn-row b{display:block;font-size:15px}
.attn-row small{display:block;font-size:13px;margin-top:2px}
.attn-i.warn{background:var(--gold-xl);color:var(--gold-dd)}
.fb-q{display:block;margin-top:4px;color:var(--ink2);font-size:14px;quotes:"“" "”"}
.kv.big{gap:16px}
.kv.big dd{font-size:18px;font-weight:600}
.kv.big dd small{font-size:12px;font-weight:400}
.live-p .sec-h .env{background:var(--g700)}
.ins{grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
.ins .act{display:flex;align-items:center;gap:6px;margin-top:8px}
.ins .act svg{width:15px;height:15px;flex:none}
.ins-list,.q-list{display:grid;gap:12px}
.q-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-top .state{min-height:26px;font-size:12px}
.ver-rules{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.ver-rules>svg{width:20px;height:20px;color:var(--g);flex:none;margin-top:2px}
.ver-rules ul{margin:6px 0 0;padding-inline-start:18px;color:var(--ink2);display:grid;gap:2px}
.heat{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px;font-size:13px}
.heat thead th{font-weight:600;color:var(--ink2);font-size:12px;padding:4px;vertical-align:bottom;text-align:center}
.heat tbody th{text-align:start;font-weight:500;font-size:13.5px;padding-inline-end:10px;white-space:nowrap}
.heat td{padding:0}
.hc{display:grid;place-items:center;width:100%;height:44px;border-radius:8px;background:rgba(15,61,54,var(--v));color:var(--ink);font-weight:600;transition:transform .15s,box-shadow .15s}
.hc[style*="--v:0."]{color:var(--ink)}
.hc:hover{transform:scale(1.05)}
.hc.sel{box-shadow:0 0 0 2px var(--gold-d)}
.heat-key{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.heat-key i{width:18px;height:12px;border-radius:3px;background:rgba(15,61,54,var(--v))}
.heat-key .dim{margin-inline-start:6px}
.dvs{display:grid;gap:12px}
.dvs-r{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:14px}
.dvs-b{display:grid;gap:4px}
.dvs-b .tr{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.dvs-b .tr i{display:block;height:100%;width:0;border-radius:4px;transition:width .9s var(--ease)}
.dvs-b .d i{background:var(--gold)}
.dvs-b .s i{background:var(--g)}
.dvs-r b{text-align:end;font-size:13px;color:var(--ink2)}
.dvs-r b.gap{color:var(--gold-dd)}
.lg2{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.lg2 i{width:10px;height:10px;border-radius:3px}
.lg2 i.d{background:var(--gold)}
.lg2 i.s{background:var(--g);margin-inline-start:8px}
.hb-r .tr.warn i{background:var(--gold)}
.bench{display:grid;gap:12px}
.bench h3{display:flex;align-items:center;gap:8px}
.bench h3 svg{width:18px;height:18px;color:var(--g)}
.bench-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:14px;padding-top:6px}
.br-c{display:grid;gap:8px;align-content:start;padding:14px;border-radius:var(--r13);background:var(--paper);border:1px solid var(--line)}
.br-sum{display:grid;justify-items:center;align-content:center;text-align:center;padding:14px 18px;border-radius:var(--r13);background:var(--band);color:#fff;min-width:130px}
.br-sum b{font-size:32px;line-height:1}
.br-sum small{color:rgba(255,255,255,.7);font-size:11.5px;max-width:16ch}
.onb{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.onb li{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.onb i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);flex:none}
.onb svg{width:14px;height:14px}
.onb li.done{color:var(--ink)}
.onb li.done i{background:var(--g);border-color:var(--g);color:var(--on-g)}
.onb li.now{color:var(--ink);font-weight:600}
.onb li.now i{border-color:var(--gold);color:var(--gold-d)}
.row-a{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.sw-l{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.actor{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.actor.a-who_ai{background:var(--g700);color:var(--g)}
.actor.a-who_ops{background:var(--deep);color:#F4E6CC}
.actor.a-who_inst{background:var(--sage-l);color:#3F5F51}
.actor.a-who_site{background:var(--gold-xl);color:var(--gold-dd)}
.set-h{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:6px}
.set-h svg{width:19px;height:19px;color:var(--g)}
.set-row.col{grid-template-columns:minmax(0,1fr);gap:10px}
.set-row.col .chips-wrap{justify-content:flex-start}
.rep{grid-template-columns:auto minmax(0,1fr) auto}
.rep small{display:block;margin-top:4px;font-size:12px}

/* ---------- console sign-in ---------- */
.csi{min-height:calc(100vh - 42px);background:var(--paper)}
.csi.dark{background:var(--deep)}
.csi-in{max-width:480px;margin-inline:auto;padding:clamp(24px,6vh,64px) 16px 48px;display:grid;gap:22px}
.csi-top{display:flex;align-items:center;gap:10px}
.csi-top .top-r{margin-inline-start:auto}
.csi-tag{padding:4px 10px;border-radius:999px;background:var(--g700);color:var(--g);font-size:12px;font-weight:600}
.csi.dark .csi-top .brand{color:#F8F6EF}
.csi.dark .csi-top .bw-bowl{stroke:var(--gold)}
.csi.dark .csi-top .bw-dot{fill:var(--gold)}
.csi.dark .csi-tag{background:rgba(212,175,124,.16);color:var(--gold)}
.csi.dark .seg{background:rgba(255,255,255,.08)}
.csi.dark .seg button{color:rgba(248,246,239,.72)}
.csi.dark .seg button[aria-pressed=true]{background:var(--paper);color:var(--g)}
.csi-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(22px,4vw,34px);display:grid;gap:16px;box-shadow:var(--shadow2);animation:up .5s var(--ease) both}
.csi-card h1{font-size:clamp(24px,3vw,30px)}
.csi-card .env{justify-self:start}
.csi-form{display:grid;gap:10px}
.keywait{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border-radius:var(--r13);background:var(--g700);color:var(--g);font-size:14px;font-weight:500}
.keywait svg{width:20px;height:20px;animation:nod 1.4s var(--ease) infinite}
.csi-demo{display:flex;gap:12px;padding:14px;border-radius:var(--r13);background:var(--gold-xl);border:1px solid var(--gold-l);font-size:14px}
.csi-demo>svg{width:19px;height:19px;color:var(--gold-d);flex:none;margin-top:2px}
.csi-demo .linkbtn{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:600}
.csi-demo .linkbtn svg{width:15px;height:15px}
.csi-foot{font-size:12.5px}
.csi-alt{text-align:center;font-size:14px;color:var(--ink2)}
.csi.dark .csi-alt{color:rgba(248,246,239,.7)}

/* ---------- website: frame ---------- */
.pub .pub-nav{top:0}
.hero2{position:relative;overflow:hidden}
.hero-mark{position:absolute;inset-inline-end:-140px;bottom:-220px;pointer-events:none;opacity:.045;z-index:0}
.hero-mark svg{width:620px;height:620px}
.hero2-in{position:relative;z-index:1}
.sec-head{display:grid;gap:10px;max-width:720px;margin-bottom:clamp(28px,4vw,48px)}
.sec-head h2{font-size:clamp(28px,3.4vw,44px);line-height:1.15;letter-spacing:-.02em}
html[lang=ar] .sec-head h2{line-height:1.45;letter-spacing:0}
.sec-head .lp2-sub{max-width:60ch}
.lp2-sec h3{font-size:19px}
.sec-sunk{background:var(--sunk);border-top-color:transparent}
.sec-ink{background:var(--band);color:#F8F6EF;border-top-color:transparent}
.sec-ink .lp2-kicker{color:var(--gold)}
.sec-ink .lp2-sub{color:rgba(248,246,239,.72)}
.split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,88px);align-items:center}
.split2.rev>:first-child{order:2}
.split2 .sec-head{margin-bottom:24px}
/* insight */
.xl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,24px)}
.xl{display:grid;gap:16px;align-content:start;padding:clamp(20px,2.6vw,28px);border-radius:20px;background:var(--surface);border:1px solid var(--line);opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease),box-shadow .25s;transition-delay:calc(var(--i)*110ms)}
.xl.in{opacity:1;transform:none}
.xl:hover{box-shadow:var(--shadow2)}
.xl-who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.xl-q{margin:0;font-size:clamp(17px,1.6vw,19px);line-height:1.6;font-weight:500;color:var(--ink);min-height:4.8em}
html[lang=ar] .xl-q{line-height:1.85}
.xl-arrow{display:flex;align-items:center;gap:10px;color:var(--gold)}
.xl-arrow i{flex:1;height:1px;background:var(--line2);transform:scaleX(0);transition:transform .7s var(--ease);transition-delay:calc(var(--i)*110ms + 300ms)}
.xl-arrow i:first-child{transform-origin:right}
html[dir=rtl] .xl-arrow i:first-child{transform-origin:left}
.xl.in .xl-arrow i{transform:none}
.xl-arrow svg{width:18px;height:18px;flex:none}
.xl-chips{display:flex;flex-wrap:wrap;gap:8px}
.xl-chips .state{opacity:0;transform:translateY(8px);transition:opacity .4s var(--ease),transform .4s var(--ease);transition-delay:calc(var(--i)*110ms + 700ms + var(--j)*140ms)}
.xl.in .xl-chips .state{opacity:1;transform:none}
.xl-note{margin-top:clamp(24px,3vw,36px);font-size:clamp(18px,1.8vw,22px);font-weight:600;text-align:center;color:var(--g)}
/* chain */
.chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;position:relative}
.chain::before{content:"";position:absolute;top:22px;inset-inline:6%;height:2px;background:rgba(248,246,239,.14)}
.chain::after{content:"";position:absolute;top:22px;inset-inline-start:6%;width:88%;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform 2.2s var(--ease) .2s}
html[dir=rtl] .chain::after{transform-origin:right}
.chain.in::after{transform:scaleX(1)}
.chain li{position:relative;display:grid;gap:8px;justify-items:center;text-align:center;opacity:.35;transition:opacity .5s;transition-delay:calc(var(--i)*250ms + 300ms)}
.chain.in li{opacity:1}
.ch-n{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--g);border:2px solid rgba(248,246,239,.24);font-weight:700;font-size:15px;position:relative;z-index:1;transition:background .4s,border-color .4s,color .4s;transition-delay:inherit;color:#F8F6EF}
.chain.in .ch-n{background:var(--paper);border-color:var(--paper);color:var(--g)}
.chain li:last-child .ch-n{background:var(--gold);border-color:var(--gold);color:var(--g50)}
.chain b{font-size:15px}
.chain small{font-size:13px;color:rgba(248,246,239,.66);line-height:1.45}
/* passport showcase */
.st-legend{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:12px}
.st-legend li{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:center;font-size:15px;color:var(--ink2)}
.st-legend .state{justify-self:start}
.pp-show{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,2.6vw,28px);box-shadow:var(--shadow2);display:grid;gap:4px;position:relative}
.pp-show::before{content:"";position:absolute;inset:10px -10px -10px 10px;border-radius:22px;border:1px solid var(--line);z-index:-1;background:var(--paper)}
html[dir=rtl] .pp-show::before{inset:10px 10px -10px -10px}
.pps-h{display:flex;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:6px;border-bottom:1px dashed var(--line2)}
.pps-h b{display:block;font-size:18px}
.pps-h small{color:var(--muted);font-size:12.5px}
.pps-h .stamp{margin-inline-start:auto}
.pps-m svg{width:40px;height:40px}
.pps-r{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.pps-r:last-child{border-bottom:0}
.pps-t{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pps-r p{font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stamp{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--g);color:var(--on-g);font-size:12px;font-weight:600;white-space:nowrap}
.stamp svg{width:14px;height:14px}
/* journey */
.jy{display:grid;grid-template-columns:240px minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:start}
.jy-g{position:sticky;top:96px;display:grid;justify-items:center;gap:6px;padding:24px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.jy-g .g-val{transition:stroke-dasharray .6s var(--ease)}
.jy-l{list-style:none;margin:0;padding:0;display:grid;position:relative}
.jy-l::before{content:"";position:absolute;inset-block:14px;inset-inline-start:7px;width:2px;background:var(--line2)}
.jy-s{position:relative;display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 16px;padding:14px 0 14px 36px;opacity:.35;transition:opacity .4s}
html[dir=rtl] .jy-s{padding:14px 36px 14px 0}
.jy-s::before{content:"";position:absolute;inset-inline-start:0;top:20px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--line2);transition:background .3s,border-color .3s}
.jy-s.on{opacity:1}
.jy-s.on::before{background:var(--g);border-color:var(--g)}
.jy-s:last-child.on::before{background:var(--gold);border-color:var(--gold)}
.jy-d{grid-row:span 2;font-size:13px;font-weight:600;color:var(--gold-d);padding-top:2px}
.jy-s b{font-size:17px}
.jy-s small{font-size:14px;color:var(--ink2)}
.jy-note{margin-top:24px;font-size:13px;display:flex;align-items:center;gap:6px}
/* AI */
.ai-demo{display:grid;gap:14px;padding:clamp(18px,2.6vw,26px);border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow2)}
.aid-q{justify-self:end;max-width:86%;padding:12px 16px;border-radius:16px 16px 4px 16px;background:var(--sunk);font-size:15px}
html[dir=rtl] .aid-q{justify-self:start;border-radius:16px 16px 16px 4px}
.aid-q span{display:block;font-size:12px;margin-bottom:2px}
.aid-a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px}
.aid-m svg{width:32px;height:32px}
.aid-l{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.aid-row{display:grid;gap:8px;justify-items:start}
.aid-row q{font-size:14px;background:var(--gold-xl);box-shadow:inset 0 -2px 0 var(--gold);padding:1px 4px;border-radius:4px}
.aid-why{font-size:14px;color:var(--ink2);margin-top:10px}
.aid-btns{display:flex;gap:8px;margin-top:12px}
.aid-btns .btn{pointer-events:none}
.ai-pts{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:18px}
.ai-pts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px}
.ai-pts b{display:block;font-size:17px;margin-bottom:2px}
.ai-pts .mute{font-size:15px}
.langs-row{display:flex;gap:8px;flex-wrap:wrap}
/* audiences, faq, final */
.aud3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,22px)}
.aud3 .aud-c h3{font-size:clamp(19px,1.8vw,22px)}
.faq-wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,5vw,72px);align-items:start}
.faq-wrap .sec-head{position:sticky;top:96px}
.faq{display:grid;border-top:1px solid var(--line2)}
.fq{border-bottom:1px solid var(--line2)}
.fq summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 2px;cursor:pointer;list-style:none;font-size:17px;font-weight:600}
.fq summary::-webkit-details-marker{display:none}
.fq summary svg{width:20px;height:20px;flex:none;color:var(--g);transition:transform .25s var(--ease)}
.fq[open] summary svg{transform:rotate(45deg)}
.fq p{padding:0 2px 20px;color:var(--ink2);max-width:62ch;animation:up .3s var(--ease)}
.two .faq{border-top:1px solid var(--line2)}
.lp2-final{position:relative;overflow:hidden}
.lp2-final p{color:rgba(248,246,239,.72);margin-top:10px;font-size:17px}
.fin-mark{position:absolute;inset-inline-end:-60px;bottom:-120px;opacity:.07;pointer-events:none}
.fin-mark svg{width:340px;height:340px}
.fin-mark .bw-bowl{stroke:#fff}.fin-mark .bw-dot{fill:var(--gold)}
.lp2-final-in{position:relative;z-index:1}
.pub-foot{background:var(--paper);border-top:1px solid var(--line);padding-block:clamp(40px,6vw,64px) 28px}
.ft-grid{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:28px}
.ft-brand p{font-size:14px;color:var(--ink2);margin-block:14px 18px;max-width:42ch}
.ft-col{display:grid;gap:2px;align-content:start}
.ft-h{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.ft-col .lnk{text-align:start;padding:6px 0;font-size:14.5px}
.ft-col .lnk:hover{background:none;color:var(--g)}
.ft-bot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
/* how */
.hw{list-style:none;margin:0;padding:0;display:grid;gap:clamp(48px,7vw,96px)}
.hw-s{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(28px,5vw,72px);align-items:center}
.hw-s:nth-child(even) .hw-t{order:2}
.hw-t{display:grid;gap:12px;justify-items:start}
.hw-t .ch-n{background:var(--g);border:0;color:var(--on-g)}
.hw-t h2{font-size:clamp(24px,2.6vw,32px)}
.hw-pts{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.hw-pts li{display:flex;gap:8px;align-items:center;font-size:15px}
.hw-pts svg{width:17px;height:17px;color:var(--g);flex:none}
.hw-vis{display:grid;gap:16px;padding:clamp(18px,2.6vw,28px);border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow2)}
.hw-vis .fc-ladder .seg{flex-grow:var(--f)}
.mt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mt-c{display:grid;gap:12px;align-content:start;padding:24px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.mt-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-lat);color:var(--muted)}
.mt-x{display:inline-flex;gap:6px;align-items:baseline;padding:8px 12px;border-radius:var(--r9);background:var(--g700);color:var(--g);font-weight:600}
.mt-x b{color:var(--ink);font-weight:600;font-family:var(--font)}
.mt-big{font-size:20px;font-weight:600}
/* institutions */
.feat4{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,2.4vw,28px)}
.feat4 li{display:grid;gap:10px;align-content:start;padding-top:20px;border-top:2px solid var(--g)}
.see2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.see{padding:clamp(20px,3vw,30px);border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.see h3{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.see h3 svg{width:20px;height:20px;color:var(--g)}
.see ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.see li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.see li svg{width:18px;height:18px;flex:none;margin-top:3px;color:var(--g)}
.see.no li svg{color:var(--err)}
.see.no{background:transparent;border-style:dashed;border-color:var(--line2)}
.pilot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(28px,5vw,72px);align-items:start}
.pilot h2{font-size:clamp(28px,3.2vw,40px)}
.pilot-steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:14px}
.pilot-steps li{display:flex;align-items:center;gap:12px;font-size:15px}
.pilot-steps .ch-n{width:32px;height:32px;font-size:13px;background:var(--g700);color:var(--g);border:0}
.pilot-f form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
/* sign-in */
.signin{padding-block:clamp(32px,6vw,72px)}
.si-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:clamp(24px,5vw,64px);align-items:stretch;max-width:1040px}
.si-card{display:grid;gap:16px;align-content:start;padding:clamp(22px,4vw,36px);border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow2);animation:up .5s var(--ease) both}
.si-card .si-h{justify-items:start;text-align:start}
.si-card form{display:grid;gap:10px}
.si-new{font-size:14px;color:var(--ink2);text-align:center}
.si-side{display:grid;gap:14px;align-content:end}
.si-quote{display:grid;gap:16px;padding:clamp(24px,4vw,36px);border-radius:22px;background:var(--band);color:#F8F6EF;min-height:260px;align-content:space-between}
.si-quote svg{width:46px;height:46px}
.si-quote .bw-bowl{stroke:#F8F6EF}.si-quote .bw-dot{fill:var(--gold)}
.si-quote p{font-size:clamp(19px,1.8vw,23px);line-height:1.5;font-weight:500}
