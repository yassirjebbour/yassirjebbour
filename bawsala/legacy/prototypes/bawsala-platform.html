<body>
<title>BAWSALA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Tifinagh&display=swap">
<style>
/* BAWSALA visual identity v1 · 2026
   Layout: warm paper ground (72%), permanent green for structure, action and proof (20%),
   warm gold only for "found by Bawsala, not yet confirmed" (8%). No gradients, no glow, no glass. */
:root{
  /* Palette: Vert profond #0F3D36 (trust, structure, proof) · Vert sauge #6B8F7D (growth, in progress)
     · Or doux #D4AF7C (ambition, found by Bawsala) · Crème #F8F6EF (clarity, the ground). */
  --paper:#F8F6EF; --surface:#FFFFFF; --sunk:#F0EDE3; --sunk2:#E4DFD1;
  --ink:#16201D; --ink2:#46504B; --muted:#6B736E;
  --line:#E6E1D3; --line2:#D6D0BF;
  --g50:#0A2B26; --g:#0F3D36; --g200:#24564D; --g300:#6B8F7D; --g400:#8FAE9F; --g500:#B9CDC2; --g600:#DCE7E1; --g700:#EDF3EF;
  --sage:#6B8F7D; --sage-l:#E3EBE6;
  --gold:#D4AF7C; --gold-d:#9A7744; --gold-dd:#76582C; --gold-l:#EAD7B5; --gold-xl:#F8F0E2;
  --ok:#2F6F5B; --warn:#9A7744; --err:#A4473A; --err-l:#F6E6E3;
  --r9:9px; --r13:13px; --r17:17px;
  --shadow:0 1px 2px rgba(22,32,29,.06),0 1px 1px rgba(22,32,29,.03);
  --shadow2:0 18px 40px -22px rgba(15,61,54,.32);
  --f-lat:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --font:var(--f-lat); --lh:1.6;
  --ease:cubic-bezier(.2,.8,.2,1);
  --rail:240px; --tab:64px;
  /* theme roles (light) */
  --on-g:#fff; --brand:#0F3D36; --band:#0F3D36; --deep:#0A2B26;
  --glass:rgba(248,246,239,.82); --glass-s:rgba(255,255,255,.86);
  --scrim:rgba(18,24,22,.36); --hi:none;
  --shadow3:0 1px 1px rgba(22,32,29,.04),0 4px 10px -2px rgba(22,32,29,.06),0 24px 48px -24px rgba(15,61,54,.22);
  --ease-out:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
html[lang=ar]{--font:var(--f-ar); --lh:1.85}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/var(--lh) var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3,html[lang=ar] h4{letter-spacing:0;line-height:1.45;font-weight:700}
p{margin:0}
a{color:var(--g)}
:focus-visible{outline:2px solid var(--g);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.teal{color:var(--g)}
.amber{color:var(--g)}
.mute{color:var(--ink2)}
.dim{color:var(--muted)}
.flip{transform:scaleX(var(--dirx,1))}
html[dir=rtl]{--dirx:-1}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.lead{font-size:18px;color:var(--ink2)}
.h3{display:block;font-size:17px;font-weight:600;line-height:1.35}
html[lang=ar] .h3{font-weight:700;line-height:1.6}
#app{min-height:100%}

/* ---------- brand ---------- */
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.12em;color:var(--ink);white-space:nowrap}
.brand svg{width:28px;height:28px;flex:none}
.bw-bowl{stroke:var(--g);stroke-linecap:round}
.bw-dot{fill:var(--g)}
.bw-ar{letter-spacing:0;font-weight:500;color:var(--muted);padding-inline-start:10px;border-inline-start:1px solid var(--line2);font-size:15px}

/* ---------- buttons, fields, chips ---------- */
.btn{--bg:var(--g);--fg:var(--on-g);--bd:var(--g);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:var(--r13);background:var(--bg);color:var(--fg);border:1px solid var(--bd);font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .1s}
.btn:hover{--bg:var(--g50);--bd:var(--g50)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{--bg:var(--surface);--fg:var(--ink);--bd:var(--line2)}
.btn.ghost:hover{--bg:var(--sunk);--bd:var(--line2)}
.btn.amber{--bg:var(--g);--fg:var(--on-g);--bd:var(--g)}
.btn.danger{--bg:var(--err);--fg:#fff;--bd:var(--err)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:var(--r9)}
.btn.lg{min-height:52px;padding:0 24px;font-size:16px}
.btn.block{width:100%}
.btn:disabled{--bg:var(--sunk);--fg:var(--muted);--bd:var(--line);cursor:not-allowed;transform:none}
.ibtn{width:42px;height:42px;border-radius:var(--r13);display:inline-grid;place-items:center;color:var(--ink2);transition:background .15s}
.ibtn:hover{background:var(--sunk)}
.ibtn svg{width:20px;height:20px}
.linkbtn{color:var(--g);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;min-height:24px;text-align:start}
.linkbtn.dim{color:var(--muted);font-weight:500}
.linkbtn.amber{color:var(--g)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:14px;color:var(--ink2);transition:background .15s,border-color .15s}
button.chip:hover{border-color:var(--g400);color:var(--ink)}
.chip.on{background:var(--g);border-color:var(--g);color:var(--on-g)}
.chip.have{background:var(--g700);border-color:var(--g600);color:var(--g)}
.chip svg{width:15px;height:15px}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.teal{background:var(--g700);color:var(--g)}
.pill.amber{background:var(--g700);color:var(--g)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.live .dot{background:var(--ok)}
.field{display:grid;gap:8px}
.field label,.flabel{font-size:14px;font-weight:600;color:var(--ink)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r13);padding:12px 14px;font-size:16px;color:var(--ink);transition:border-color .15s,box-shadow .15s;resize:vertical;line-height:var(--lh)}
.inp::placeholder{color:var(--muted)}
.inp:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px var(--g600)}
.inp:disabled{background:var(--sunk);color:var(--ink2)}
.seg{display:inline-flex;padding:3px;border-radius:var(--r13);background:var(--sunk);gap:2px}
.seg button{min-height:32px;padding:0 12px;border-radius:var(--r9);font-size:13px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r17);padding:clamp(16px,2.4vw,24px)}
.panel.flat{background:var(--sunk);border-color:transparent}
.panel h3,.sub-h{font-size:17px}
.sub-h{margin-block:4px 12px}
.how{font-size:14px;color:var(--ink2)}
.how summary{cursor:pointer;color:var(--g);font-size:13px;font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center;min-height:28px}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--g500);font-size:11px}
.how p{margin-top:6px;max-width:64ch}

/* ---------- skill states: shape + icon + words, never colour alone ---------- */
.state{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding-inline:10px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid transparent;max-width:100%}
.state svg{width:14px;height:14px;flex:none}
.state.s-sugg{background:var(--gold-xl);border-color:var(--gold-l);color:var(--gold-dd)}
.state.s-sugg svg{color:var(--gold)}
.state.s-conf{background:var(--surface);border-color:var(--sage);color:var(--ink)}
.state.s-conf svg{color:var(--sage)}
.state.s-proven{background:var(--g700);border-color:var(--g600);color:var(--g)}
.state.s-ver{background:var(--g);border-color:var(--g);color:var(--on-g)}
.state.s-miss{background:var(--sunk);border-color:var(--line);color:var(--ink2)}
.state.s-miss svg{color:var(--muted)}
.state.s-rej{background:transparent;border-color:var(--line);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.state.s-rej .linkbtn{text-decoration:underline;margin-inline-start:6px}

/* ---------- the mark ---------- */
.masc{display:block;width:100%;height:100%;overflow:visible}
.masc .m-bowl{stroke:var(--g);stroke-width:2.6;stroke-linecap:round}
.masc .m-dot{fill:var(--g)}
.masc[data-mood=thinking] .m-dot{animation:bob 1.1s ease-in-out infinite}
.gauge{display:block;overflow:visible}
.gauge .g-trk,.gauge .g-val{fill:none;stroke-width:9;stroke-linecap:round}
.gauge .g-trk{stroke:var(--sunk2)}
.gauge .g-val{stroke:var(--g);stroke-dasharray:0 100;transition:stroke-dasharray 1.2s var(--ease)}
html[dir=rtl] .gauge .g-val,html[dir=rtl] .gauge .g-trk{transform:scaleX(-1);transform-origin:50px 50px}
.gauge .g-dot{fill:var(--sunk2);transition:fill .4s}
.gauge .g-dot.on{fill:var(--g)}
.gauge text{fill:var(--ink);font-weight:700;font-size:22px;font-family:var(--f-lat)}

/* ---------- copilot entry ---------- */
.fab{position:fixed;inset-inline-end:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:10px;min-height:48px;padding-inline:12px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow2);font-weight:600;font-size:14px;color:var(--ink)}
.fab:hover{border-color:var(--g400)}
.fab .masc{width:24px;height:24px}
.say{position:absolute;bottom:calc(100% + 10px);inset-inline-end:0;background:var(--ink);color:var(--paper);font-weight:500;font-size:14px;line-height:1.5;padding:8px 12px;border-radius:var(--r9);width:max-content;max-width:min(280px,70vw);pointer-events:none;animation:rise .25s var(--ease) both}

/* ---------- home page ---------- */
.lp2{min-height:100vh;background:var(--paper)}
.lp2-in{max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}
.lp2-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.lp2-nav-in{display:flex;align-items:center;gap:24px;min-height:68px}
.lp2-links{display:flex;gap:4px}
.lnk{color:var(--ink2);font-size:15px;font-weight:500;padding:8px 12px;border-radius:var(--r9)}
.lnk:hover{background:var(--sunk);color:var(--ink)}
.lp2-nav .top-r{margin-inline-start:auto}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lp2-kicker{font-size:14px;font-weight:600;color:var(--gold-d)}
.lp2-hero{padding-block:clamp(48px,7vw,96px) clamp(56px,8vw,104px)}
.lp2-hero-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(32px,6vw,80px);align-items:center}
.lp2-copy{display:grid;gap:20px;justify-items:start;min-width:0}
.lp2-h{font-size:clamp(36px,4.8vw,58px);line-height:1.1;letter-spacing:-.025em;font-weight:700;max-width:16ch}
html[lang=ar] .lp2-h{line-height:1.4;letter-spacing:0;max-width:17ch}
html[lang=fr] .lp2-h{max-width:18ch;font-size:clamp(34px,4.4vw,52px)}
.lp2-sub{font-size:clamp(17px,1.5vw,19px);color:var(--ink2);max-width:48ch}
.lp2-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.lp2-facts{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--ink2)}
.lp2-facts li{display:inline-flex;gap:8px;align-items:center}
.lp2-facts svg{width:16px;height:16px;color:var(--g)}
.win{background:var(--surface);border:1px solid var(--line);border-radius:var(--r17);box-shadow:var(--shadow2);overflow:hidden;min-width:0}
.win-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;background:var(--surface)}
.win-dots{display:none}
.win-t{font-weight:600;color:var(--ink2);margin-inline-end:auto}
.win-body{padding:clamp(16px,2.4vw,24px);display:grid;gap:14px}
.win-q{font-size:clamp(19px,2vw,22px);font-weight:700;line-height:1.35}
.win textarea{min-height:120px;resize:none}
.win-live{display:grid;gap:8px;padding:12px 14px;border-radius:var(--r13);background:var(--paper);border:1px dashed var(--line2);min-height:74px;align-content:start}
.win-live .chips-wrap{justify-content:flex-start;gap:6px}
.win-live .dim{font-size:14px}
.win-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.win-foot .btn{margin-inline-start:auto}
.win-foot .linkbtn{font-size:14px}
.win-foot #cnt{font-size:13px}
.lp2-sec{padding-block:clamp(64px,8vw,104px);border-top:1px solid var(--line)}
.lp2-sec-h{display:grid;gap:8px;margin-bottom:clamp(28px,4vw,44px);max-width:640px}
.lp2-sec h2,.lp2-final h2{font-size:clamp(28px,3.2vw,40px);line-height:1.2;letter-spacing:-.015em}
html[lang=ar] .lp2-sec h2,html[lang=ar] .lp2-final h2{line-height:1.45;letter-spacing:0}
.lp2-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,2.4vw,28px)}
.lp2-steps li{display:grid;gap:6px;align-content:start;min-width:0}
.step-vis{height:164px;border-radius:var(--r17);background:var(--surface);border:1px solid var(--line);padding:16px;display:grid;align-content:center;gap:8px;margin-bottom:12px;overflow:hidden}
.step-n{font-size:13px;color:var(--gold-d);font-weight:700}
.lp2-steps h3{font-size:19px}
.lp2-steps .mute{font-size:15px}
.mini-quote{font-size:14px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mini-quote mark{background:var(--gold-xl);color:var(--gold-dd);box-shadow:inset 0 -2px 0 var(--gold-l);border-radius:3px;padding:0 2px}
.mini-stack{display:grid;gap:6px;justify-items:start}
.mini-fit{display:grid;gap:4px;justify-items:start}
.mini-fit b{font-size:30px;line-height:1;color:var(--g)}
.mini-fit span{font-size:14px;font-weight:600;line-height:1.4}
.mini-fit small{font-size:12px;margin-bottom:4px}
.mini-path{display:flex;gap:6px;flex-wrap:wrap}
.mini-path i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;background:var(--surface)}
.mini-path i svg{width:13px;height:13px}
.mini-path i.done{background:var(--g);border-color:var(--g);color:var(--on-g)}
.mini-path i.now{border-color:var(--g);border-width:2px}
.mini-path i.prove{border-style:dashed;border-color:var(--g400);color:var(--g)}
.lp2-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(32px,6vw,80px);align-items:center}
.lp2-trust{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.lp2-trust li{display:grid;gap:14px;align-content:start;padding-top:20px;border-top:2px solid var(--g)}
.tr-i{width:38px;height:38px;border-radius:var(--r9);display:grid;place-items:center;background:var(--g700);color:var(--g)}
.tr-i svg{width:20px;height:20px}
.lp2-trust p{font-size:18px;font-weight:500}
.lp2-final{padding-block:clamp(56px,7vw,88px);background:var(--band);color:#fff}
.lp2-final-in{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.lp2-final h2{max-width:20ch;color:#fff}
.lp2-final .btn{--bg:#fff;--fg:var(--brand);--bd:#fff}
.lp2-final .btn:hover{--bg:var(--g700);--bd:var(--g700)}
.lp2-foot{padding-block:36px;background:var(--paper)}
.lp2-foot-in{display:grid;grid-template-columns:minmax(0,1.2fr) auto;gap:20px 40px;align-items:start}
.lp2-foot-in p{font-size:14px;margin-top:10px;max-width:40ch}
.lp2-foot-links{display:flex;gap:4px;flex-wrap:wrap}
.lp2-note{grid-column:1/-1;font-size:12px!important;padding-top:18px;border-top:1px solid var(--line);max-width:none!important}

/* ---------- discovery (stage) ---------- */
.stage{min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr;padding-inline:clamp(16px,4vw,32px);padding-block:16px 32px;background:var(--paper)}
.stage-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.pass-mini{display:inline-flex;align-items:center;gap:8px;padding-block:6px;padding-inline:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line2);font-weight:600;font-size:14px;transition:transform .25s var(--ease)}
.pass-mini .pi{width:26px;height:26px;border-radius:50%;background:var(--g700);display:grid;place-items:center;color:var(--g)}
.pass-mini .pi svg{width:15px;height:15px}
.got{animation:got .45s var(--ease)}
.reading{display:grid;justify-items:center;align-content:center;gap:24px;text-align:center;max-width:720px;margin-inline:auto;width:100%}
.reading-m{width:80px!important;height:80px!important}
.status-line{font-weight:700;font-size:20px}
.scan{font-size:clamp(17px,2vw,20px);color:var(--muted);text-align:start;max-height:40vh;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r17);padding:20px 22px}
.scan .w{transition:color .25s,background .25s;border-radius:3px}
.scan .w.lit{color:var(--ink)}
.scan .w.hit{background:var(--gold-xl);color:var(--gold-dd);box-shadow:inset 0 -2px 0 var(--gold-l)}
.found-live{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:34px}
.found-live .state{animation:rise .3s var(--ease) both}
.theater{display:grid;justify-items:center;align-content:center;gap:18px;text-align:center;max-width:860px;margin-inline:auto;width:100%;padding-block:12px;position:relative}
.spot{display:none}
.th-prog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink2)}
.th-bar{display:flex;gap:4px}
.th-bar i{width:18px;height:4px;border-radius:2px;background:var(--sunk2);transition:background .2s,width .25s}
.th-bar i.done{background:var(--g)}
.th-bar i.no{background:var(--line2)}
.th-bar i.cur{width:30px;background:var(--gold)}
.th-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.th-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:600;font-size:13px;background:var(--sunk);color:var(--ink2)}
.th-badge svg{width:14px;height:14px}
.th-conf{font-size:13px;color:var(--muted)}
.th-conf.medium{color:var(--gold-dd);font-weight:600}
.th-name{font-size:clamp(44px,8vw,88px);font-weight:700;letter-spacing:-.03em;line-height:1.05;animation:rise .45s var(--ease) both;transition:opacity .25s,transform .25s}
html[lang=ar] .th-name{letter-spacing:0;line-height:1.35}
.th-name.leave{opacity:0;transform:translateY(8px)}
.th-quote{margin:0;max-width:620px;font-size:clamp(17px,2vw,20px);color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r17);padding:34px 22px 18px;position:relative;text-align:start}
.th-quote mark{background:var(--gold-xl);color:var(--gold-dd);box-shadow:inset 0 -2px 0 var(--gold-l);border-radius:3px;padding:0 3px}
.th-src{position:absolute;top:10px;inset-inline-start:22px;font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.th-src svg{width:14px;height:14px}
.th-why{font-size:15px;color:var(--ink2);max-width:520px}
.th-ask{font-weight:700;font-size:17px;margin-top:4px}
.th-acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.th-acts .btn{min-width:160px;white-space:nowrap}
.th-all{font-size:13px}
.th-masc{display:none}
.flyer{position:fixed;z-index:200;pointer-events:none;font-weight:600;color:var(--on-g);background:var(--g);padding:8px 14px;border-radius:999px;font-size:15px;white-space:nowrap;box-shadow:var(--shadow2)}
.done-wrap{display:grid;justify-items:center;gap:16px;text-align:center;max-width:680px;margin-inline:auto;align-content:center}
.big-num{font-size:clamp(72px,12vw,128px);font-weight:700;line-height:1;color:var(--g);letter-spacing:-.03em}

/* setup */
.setup{display:grid;gap:22px;max-width:720px;width:100%;margin-inline:auto;align-content:center;padding-block:20px}
.setup h1{font-size:clamp(28px,4vw,40px)}
.goal-grid{display:grid;gap:10px}
.goal-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;text-align:start;padding:16px 18px;border-radius:var(--r17);border:1px solid var(--line);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.goal-card:hover{border-color:var(--g400);box-shadow:var(--shadow2)}
.goal-card .meta{font-size:13px;color:var(--muted)}
.goal-card .go{display:grid;justify-items:center;gap:2px;text-align:center}
.goal-card .fit-big{font-size:26px}
.logo{width:48px;height:48px;border-radius:var(--r13);background:var(--sunk);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:4px;padding:20px 14px;border-inline-end:1px solid var(--line);background:var(--surface);z-index:20;overflow:auto}
.rail .brand{padding:4px 10px 20px}
.rail-nav{display:grid;gap:2px}
.rail-sep{height:1px;background:var(--line);margin:10px 10px}
.nav-i{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--r9);color:var(--ink2);font-weight:500;font-size:15px;text-align:start;width:100%;transition:background .15s,color .15s}
.nav-i svg{width:20px;height:20px;flex:none}
.nav-i:hover{background:var(--sunk);color:var(--ink)}
.nav-i[aria-current=page]{background:var(--g700);color:var(--g);font-weight:600}
.nav-i .n{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:500}
.rail-foot{margin-top:auto;display:grid;gap:10px}
.rail-ready{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r13);border:1px solid var(--line);background:var(--paper);width:100%;text-align:start}
.rail-ready .t{font-size:13px;color:var(--muted);line-height:1.35}
.rail-ready .t b{display:block;color:var(--ink);font-size:15px}
.main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:32px 120px}
.main-in{max-width:1080px;margin-inline:auto;display:grid;gap:24px}
.main-in>*{min-width:0}
.tabbar{display:none}
.mtop{display:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:clamp(26px,3.4vw,36px)}
.ph p{color:var(--ink2);margin-top:4px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mtop .brand{font-size:13px}
  .mtop .brand svg{width:24px;height:24px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line)}
  .tabbar button{display:grid;justify-items:center;gap:2px;padding:9px 2px 8px;font-size:11px;color:var(--muted);position:relative;min-width:0}
  .tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar svg{width:22px;height:22px}
  .tabbar button[aria-current=page]{color:var(--g);font-weight:600}
  .tabbar button[aria-current=page]::before{content:"";position:absolute;top:0;width:28px;height:2px;border-radius:2px;background:var(--g)}
  .main{padding-block:20px 150px}
  .fab{bottom:calc(var(--tab) + 14px + env(safe-area-inset-bottom,0px));inset-inline-end:14px;padding:0;width:48px;justify-content:center}
  .fab span{display:none}
}

/* ---------- home ---------- */
.hm-hi{font-size:16px;color:var(--ink2)}
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;padding:clamp(22px,3.2vw,32px);border-radius:var(--r17);background:var(--band);color:#fff}
.next .k{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--g600);font-weight:600;font-size:14px}
.next .k svg{width:18px;height:18px}
.next-t{font-size:clamp(26px,3.6vw,40px);margin-top:8px;color:#fff}
.next-why{color:var(--g600);margin-top:8px;max-width:62ch}
.next-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.next .state.s-miss{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
.next .state.s-miss svg,.next .state svg{color:inherit}
.next .state.s-conf{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.next .pill.teal{background:rgba(255,255,255,.14);color:#fff}
.next .btn{--bg:#fff;--fg:var(--brand);--bd:#fff}
.next .btn:hover{--bg:var(--g700);--bd:var(--g700)}
.opp-next{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.opp-next .k{color:var(--g)}
.opp-next .next-t{color:var(--ink)}
.opp-next .next-why{color:var(--ink2)}
.opp-next .btn{--bg:var(--g);--fg:var(--on-g);--bd:var(--g)}
.dest{display:grid;grid-template-columns:auto minmax(0,1.2fr) minmax(0,1fr);gap:clamp(16px,3vw,36px);align-items:start;padding:clamp(18px,2.6vw,26px);border-radius:var(--r17);background:var(--surface);border:1px solid var(--line)}
.dest-ring{display:grid;justify-items:center;gap:2px}
.dest-t{font-size:clamp(20px,2.2vw,24px)}
.dest-t .linkbtn{font-size:inherit;font-weight:700;color:var(--ink);text-decoration-color:var(--line2)}
.dest-org{font-size:14px}
.dest-gaps{display:grid;gap:2px;align-content:start}
.gap-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.gap-row:last-child{border-bottom:0}
.gap-row small{color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.two.eq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.week-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.week-head h3{font-size:17px}
.wdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted)}
.wd i{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;background:var(--surface)}
.wd i svg{width:16px;height:16px}
.wd.done i{background:var(--g);border-color:var(--g);color:var(--on-g)}
.wd.today i{border-color:var(--g);border-width:2.5px}
.wd.prove i{border-style:dashed;border-color:var(--g400);color:var(--g)}
.wd.done.prove i{border-style:solid;color:var(--on-g)}
.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.tip-m{width:30px;height:30px;margin-top:4px}
.tip p{font-size:15px}
.tip .btn{margin-top:12px}

/* ---------- passport ---------- */
.pp{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:clamp(24px,4vw,48px);align-items:start}
.idwrap{display:grid;gap:12px;position:sticky;top:20px;perspective:1600px}
.idcard{position:relative;aspect-ratio:1.42/1;width:100%;transform-style:preserve-3d;transition:transform .7s var(--ease);cursor:grab;touch-action:pan-y;user-select:none}
.idcard.drag{transition:none;cursor:grabbing}
.idcard.flipped{transform:rotateY(180deg)}
.idf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r17);padding:clamp(16px,2.4vw,20px);display:grid;grid-template-rows:auto 1fr auto auto;gap:8px;overflow:hidden;box-shadow:var(--shadow2)}
.idf.front{background:var(--band);color:#fff}
.idf.back{transform:rotateY(180deg);background:var(--surface);border:1px solid var(--line);grid-template-rows:none;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:16px}
.id-top{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.id-top .ttl{color:var(--gold-l);font-weight:600}
.id-top .dim{color:var(--g500)}
.id-mid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.id-mid .emb{width:clamp(44px,6vw,56px);aspect-ratio:1}
.idf.front .masc .m-bowl{stroke:#fff}
.idf.front .masc .m-dot{fill:#fff}
.id-mid h2{font-size:clamp(20px,2.4vw,26px);overflow-wrap:anywhere;color:#fff}
.id-mid p{font-size:13px;color:var(--g500)!important}
.id-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px}
.id-stats div{display:grid}
.id-stats b{font-size:20px;line-height:1.3;display:flex;align-items:center}
.id-stats b svg{width:20px;height:20px}
.id-stats span{font-size:11px;color:var(--g500)}
.id-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px;color:var(--g500)}
.stamp{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1.5px solid #fff;color:#fff;border-radius:var(--r9);font-weight:700;font-size:11px}
.stamp svg{width:13px;height:13px}
.qr{width:96px;aspect-ratio:1;display:grid;grid-template-columns:repeat(13,1fr);gap:1px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:var(--r9)}
.qr i{background:var(--ink);border-radius:1px}
.qr i.o{background:transparent}
.ver-steps{display:grid;gap:10px}
.vs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.vs i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);color:var(--muted);background:var(--surface)}
.vs i svg{width:14px;height:14px}
.vs.on i{background:var(--g);border-color:var(--g);color:var(--on-g)}
.vs.wait i{border-color:var(--gold);color:var(--gold-d)}
.vs b{display:block;font-size:14px}
.vs span{font-size:12px;color:var(--muted)}
.id-ctl{display:flex;gap:8px;flex-wrap:wrap}
.pp-main{display:grid;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px}
.sec-h h2{font-size:20px}
.caps{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r17);padding-inline:clamp(14px,2vw,20px)}
.cap{display:grid;gap:8px;padding-block:16px;border-bottom:1px solid var(--line)}
.cap:last-child{border-bottom:0}
.cap-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cap-h h3{font-size:17px;display:flex;align-items:center;gap:6px}
.cap-h h3 svg{color:var(--gold)}
.cap-ev{margin:0;padding-inline-start:12px;border-inline-start:2px solid var(--g500);color:var(--ink2);font-size:15px}
.cap-f{display:flex;gap:4px 16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.cap-f .linkbtn{margin-inline-start:auto;font-size:12px}
.exps{display:grid;gap:10px}
.exp{padding:14px 16px;border-radius:var(--r13);background:var(--surface);border:1px solid var(--line);display:grid;gap:8px}
.exp p{font-size:14px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.exp .chips-wrap{justify-content:flex-start}
.exp .chip{min-height:26px;font-size:12px;padding:0 10px}
.exp small{font-size:12px}
.side{display:grid;gap:14px;align-content:start}

/* ---------- opportunities ---------- */
.om{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.map-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r17);padding:12px;min-width:0}
.map{width:100%;height:auto;display:block;aspect-ratio:1;max-height:620px}
.map .orb{fill:none;stroke:var(--line2);stroke-dasharray:3 6}
.map .orb-l{fill:var(--muted);font-size:13px;font-family:var(--f-lat)}
.map .dot{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .2s var(--ease)}
.map .dot:hover,.map .dot.sel{transform:scale(1.12)}
.map .dot .halo{fill:var(--g700)}
.map .dot .core{stroke-width:2}
.map .dot.strong .core{fill:var(--g);stroke:var(--g)}
.map .dot.worth .core{fill:var(--sage);stroke:var(--sage)}
.map .dot.stretch .core{fill:var(--surface);stroke:var(--line2);stroke-dasharray:4 3}
.map .dot.stretch .halo{display:none}
.map .dot.sel .core{stroke:var(--ink);stroke-width:3}
.map .dlab{font-size:14px;fill:var(--ink);font-weight:600;font-family:var(--font);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.map .dlab.dim{fill:var(--ink2);font-weight:500;font-size:13px}
.map .me .masc .m-bowl{stroke:var(--g)}
.map .link{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 5;opacity:.5}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--ink2);padding:8px}
.map-legend span{display:inline-flex;gap:8px;align-items:center}
.lgd{width:14px;height:14px;border-radius:50%;display:inline-block}
.lgd.strong{background:var(--g)}
.lgd.worth{background:var(--sage)}
.lgd.stretch{border:2px dashed var(--line2);background:var(--surface)}
.od{display:grid;gap:18px;position:sticky;top:20px}
.od-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.od-h h2{font-size:22px}
.od-h .meta{font-size:13px;color:var(--muted);margin-top:2px}
.fitbox{display:grid;gap:4px;padding:14px 16px;border-radius:var(--r13);background:var(--g700);border:1px solid var(--g600)}
.fit-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fit-big{font-size:38px;font-weight:700;line-height:1;color:var(--g)}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-t svg{width:15px;height:15px}
.ai-out{font-size:15px;color:var(--ink2);white-space:pre-wrap}
.ai-out:empty{display:none}
.od-next{display:grid;gap:10px;justify-items:start;padding-top:16px;border-top:1px solid var(--line)}
.od-apply{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.olist{display:grid;gap:8px}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-radius:var(--r13);border:1px solid var(--line);background:var(--surface);text-align:start}
.orow:hover{border-color:var(--g400)}
.orow.sel{border-color:var(--g);box-shadow:0 0 0 3px var(--g700)}
.orow .meta{font-size:13px;color:var(--muted)}
.fit{font-weight:700;font-size:18px}

/* ---------- path ---------- */
.plan-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.plan-badge{display:flex;gap:8px;align-items:center}
.plan-stats{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.stat{display:grid;gap:2px}
.stat b{font-size:26px;line-height:1.1;font-weight:700}
.stat span{font-size:12px;color:var(--muted)}
.today-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:clamp(20px,3vw,28px);border-radius:var(--r17);background:var(--band);color:#fff}
.today-card .d{font-size:14px;color:var(--g600);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.today-card .d svg{width:18px;height:18px;flex:none}
.today-card h2{font-size:clamp(22px,3vw,30px);margin-top:6px;color:#fff}
.today-card p{color:var(--g600);margin-top:4px}
.today-card .btn{--bg:#fff;--fg:var(--brand);--bd:#fff}
.today-card .btn:hover{--bg:var(--g700);--bd:var(--g700)}
.weeks{display:grid;gap:14px}
.wk{display:grid;grid-template-columns:minmax(130px,200px) minmax(0,1fr);gap:14px;align-items:center}
.wk .lab{font-size:13px;color:var(--ink);font-weight:600;line-height:1.45}
.wk .lab small{display:block;font-weight:400;color:var(--muted)}
.wk.won .lab{color:var(--g)}
.wk-dots{display:grid;grid-template-columns:repeat(7,minmax(0,48px));gap:8px}
.day{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink2);background:var(--surface);transition:border-color .15s,background .15s}
.day:hover{border-color:var(--g400)}
.day svg{width:17px;height:17px}
.day.done{background:var(--g);border-color:var(--g);color:var(--on-g)}
.day.today{border-color:var(--g);border-width:2.5px;color:var(--g)}
.day.prove{border-style:dashed;border-color:var(--g400);color:var(--g)}
.day.prove.done{border-style:solid;color:var(--on-g)}
.day.goal{border-color:var(--ink);color:var(--ink)}
.day.goal.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.legend-line{font-size:13px;margin-top:14px}
.tasks{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:var(--r13);border:1px solid var(--line);background:var(--surface);text-align:start}
.trow:hover{border-color:var(--g400)}
.trow>svg{width:18px;height:18px;color:var(--muted)}
.trow .dn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px solid var(--line2);color:var(--ink2)}
.trow .dn svg{width:15px;height:15px}
.trow.done .dn{background:var(--g);border-color:var(--g);color:var(--on-g)}
.trow.done b{color:var(--ink2)}
.trow b{font-weight:500;font-size:15px}
.trow small{color:var(--muted);font-size:12px;display:block}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tips li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.tips svg{width:18px;height:18px;color:var(--g);margin-top:4px}

/* ---------- modal & drawer ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s both;display:grid;place-items:center;padding:16px}
.modal{width:min(600px,100%);max-height:min(90vh,860px);overflow:auto;background:var(--surface);border-radius:var(--r17);padding:clamp(20px,4vw,30px);box-shadow:0 24px 64px -24px rgba(26,28,25,.4);animation:rise .25s var(--ease) both;display:grid;gap:16px;position:relative}
.modal.wide{width:min(820px,100%)}
.modal .x{position:absolute;top:12px;inset-inline-end:12px}
.modal h2{font-size:clamp(21px,2.6vw,26px);padding-inline-end:40px}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px;border-radius:var(--r13);border:1px solid var(--line);cursor:pointer}
.steps label:hover{border-color:var(--g400)}
.steps input{appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;margin:3px 0 0;cursor:pointer;background:var(--surface)}
.steps input:checked{background:var(--g);border-color:var(--g)}
.steps input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;rotate:45deg;translate:0 -1px}
.steps input:checked+span{color:var(--muted);text-decoration:line-through}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);z-index:90;background:var(--surface);border-inline-start:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;animation:slide-in .3s var(--ease) both;box-shadow:0 0 48px rgba(26,28,25,.16)}
html[dir=rtl] .drawer{animation-name:slide-in-r}
.dr-h{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dr-h b{display:block}
.dr-h small{color:var(--muted);font-size:12px}
.dr-h .ibtn{margin-inline-start:auto}
.chat{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.msg{max-width:88%;padding:10px 14px;border-radius:var(--r13);font-size:15px;white-space:pre-wrap;overflow-wrap:break-word}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--g);color:var(--on-g)}
.msg.sys{align-self:center;font-size:12px;color:var(--muted);background:none;padding:2px 8px}
.msg .act{margin-top:6px;font-size:12px;color:var(--g);display:flex;gap:6px;align-items:center}
.msg .act svg{width:13px;height:13px}
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dots 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.dr-f{padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:10px}
.sugs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sugs .chip{flex:none;min-height:32px;font-size:13px}
.compose{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.compose textarea{min-height:46px;max-height:140px;resize:none}
.compose .btn{width:46px;padding:0}

/* ---------- interview ---------- */
.iv{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.iv-chat{display:grid;gap:14px}
.iv-q{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.iv-q>div:first-child{width:28px!important;height:28px!important;margin-top:20px}
.iv-q .bub{background:var(--paper);border:1px solid var(--line);border-radius:var(--r13);padding:12px 16px;font-size:17px;font-weight:600}
.iv-a{justify-self:end;max-width:88%;background:var(--g700);border:1px solid var(--g600);border-radius:var(--r13);padding:12px 16px;font-size:15px;white-space:pre-wrap}
.fb{border:1px solid var(--line);border-radius:var(--r13);padding:16px;display:grid;gap:12px;background:var(--surface)}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bar{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.bar .tr{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar .tr i{display:block;height:100%;width:0;border-radius:4px;background:var(--g);transition:width .9s var(--ease)}
.bar b{color:var(--ink);font-size:16px}
.fb-l{display:grid;gap:2px;font-size:14px;color:var(--ink2)}
.fb-l strong{color:var(--ink);font-size:13px}
details.better summary{cursor:pointer;color:var(--g);font-size:14px;font-weight:600}
details.better p{margin-top:6px;font-size:14px;color:var(--ink2);white-space:pre-wrap}
.iv-compose{display:grid;gap:10px}
.iv-compose .row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.star{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.star div{padding:10px;border-radius:var(--r9);background:var(--paper);font-size:13px;color:var(--ink2)}
.star b{display:block;color:var(--g);font-size:16px}

/* ---------- progress & data ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px 18px;border-radius:var(--r17);border:1px solid var(--line);background:var(--surface);display:grid;gap:2px}
.kpi b{font-size:30px;font-weight:700;line-height:1.2}
.kpi span{font-size:13px;color:var(--ink2)}
.kpi small{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid line{stroke:var(--line)}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--f-lat)}
.chart .area{fill:url(#ga)}
.chart .ln{fill:none;stroke:var(--g);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s var(--ease) .1s forwards}
.chart .end{fill:var(--g)}
.chart .bar-r{fill:var(--g500)}
.chart .bar-r.hl{fill:var(--g)}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.tl li:last-child{border-bottom:0}
.tl svg{width:17px;height:17px;color:var(--g)}
.tl small{font-size:12px}

/* ---------- settings ---------- */
.set-list{display:grid}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-weight:600}
.set-row span{font-size:13px;color:var(--ink2)}
.set-row>svg{width:20px;height:20px;color:var(--g)}
.sw{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line2);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.sw:checked{background:var(--g)}
.sw:checked::after{transform:translateX(calc(18px * var(--dirx,1)))}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-radius:var(--r13);border:1px solid var(--line2);background:var(--paper);font-size:14px}

/* ---------- institution & operations ---------- */
.uni .rail{background:var(--surface)}
.role-line{font-size:13px;color:var(--ink2);padding:10px 14px;border-radius:var(--r13);background:var(--sunk)}
.role-line svg{color:var(--g)}
.attn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.attn{display:grid;gap:12px;align-content:start;padding:clamp(16px,2.4vw,22px);border-radius:var(--r17);background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--g)}
.attn-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.attn-h h3{font-size:17px}
.attn-i{width:36px;height:36px;border-radius:var(--r9);display:grid;place-items:center;background:var(--g700);color:var(--g)}
.attn-i svg{width:19px;height:19px}
.attn-d{display:grid;gap:8px;margin:0}
.attn-d div{display:grid}
.attn-d dt{font-size:12px;color:var(--muted);font-weight:600}
.attn-d dd{margin:0;font-size:14px}
.changes{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.changes li{display:flex;gap:10px;align-items:flex-start;font-size:15px;flex-wrap:wrap}
.changes svg{width:18px;height:18px;color:var(--g);margin-top:4px;flex:none}
.changes li span{flex:1;min-width:0}
.funnel{display:grid;gap:10px}
.fn{display:grid;grid-template-columns:150px minmax(0,1fr) 60px;gap:12px;align-items:center;font-size:14px}
.fn .tr{height:24px;border-radius:6px;background:var(--sunk);overflow:hidden}
.fn .tr i{display:block;height:100%;border-radius:6px;background:var(--g);width:0;transition:width 1s var(--ease)}
.fn b{text-align:end}
.funnel.sm{gap:8px}
.funnel.sm .fn{grid-template-columns:120px minmax(0,1fr) 44px;font-size:13px}
.funnel.sm .fn .tr{height:12px}
.hb{display:grid;gap:10px}
.hb-r{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.hb-r .tr{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hb-r .tr i{display:block;height:100%;width:0;border-radius:5px;background:var(--line2);transition:width .9s var(--ease)}
.hb.str .tr i{background:var(--g)}
.hb-r b{text-align:end;font-weight:600}
.q-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:18px;border-radius:var(--r17);border:1px solid var(--line);background:var(--surface);transition:transform .3s var(--ease),opacity .3s}
.q-card.new{border-color:var(--g400);box-shadow:0 0 0 3px var(--g700)}
.q-card.out{transform:translateY(-6px);opacity:0}
.q-card .av{width:42px;height:42px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700}
.q-card blockquote{margin:8px 0;padding-inline-start:12px;border-inline-start:2px solid var(--g500);color:var(--ink2);font-size:14px}
.q-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ins{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:18px;border-radius:var(--r17);border:1px solid var(--line);background:var(--surface)}
.ins>i{width:38px;height:38px;border-radius:var(--r9);display:grid;place-items:center;background:var(--g700);color:var(--g)}
.ins>i svg{width:19px;height:19px}
.ins b{display:block;font-size:16px}
.ins p{color:var(--ink2);font-size:14px;margin-top:4px}
.ins .act{color:var(--g);font-weight:600}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th{text-align:start;font-weight:600;color:var(--muted);font-size:12px;padding:10px;border-bottom:1px solid var(--line2)}
.tbl th[scope=row]{font-weight:500;color:var(--ink);font-size:14px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line)}
.kv{display:grid;gap:12px;margin:0}
.kv div{display:grid;gap:2px}
.kv dt{font-size:12px;color:var(--muted);font-weight:600}
.kv dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.skel{display:block;height:34px;border-radius:999px;background:var(--sunk);animation:pulse 1.4s ease-in-out infinite}
.skel.l{height:12px;border-radius:6px}

/* ---------- feedback ---------- */
.toasts{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));inset-inline:0;display:grid;justify-items:center;gap:8px;z-index:120;pointer-events:none;padding-inline:16px}
.toast{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:var(--r13);background:var(--ink);color:var(--paper);font-weight:500;font-size:14px;box-shadow:var(--shadow2);animation:toast 3.2s var(--ease) both;max-width:100%}
.toast svg{width:17px;height:17px;color:var(--g500);flex:none}
.toast.amb svg{color:var(--gold-l)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:150;width:100%;height:100%}
.celebrate{text-align:center;justify-items:center}
.celebrate>div:first-child{width:56px!important;height:56px!important}
.cert-prev{width:100%;max-height:42vh;object-fit:contain;border-radius:var(--r13);border:1px solid var(--line);display:block;background:var(--paper)}
.shake{animation:shake .4s ease}
.bounce{animation:pop .35s var(--ease)}
.pop{animation:pop .35s var(--ease)}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes got{50%{transform:scale(1.08)}}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes pulse{50%{opacity:.5}}
@keyframes dots{0%,80%,100%{opacity:.35}40%{opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes slide-in{from{transform:translateX(100%)}}
@keyframes slide-in-r{from{transform:translateX(-100%)}}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}8%,88%{opacity:1;transform:none}100%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}

@media (max-width:1080px){
  .pp{grid-template-columns:minmax(0,1fr)}
  .idwrap{position:static;max-width:440px}
  .iv{grid-template-columns:minmax(0,1fr)}
  .lp2-links{display:none}
  .lp2-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){
  .om{grid-template-columns:minmax(0,1fr)}
  .od{position:static}
}
@media (max-width:860px){
  .dest{grid-template-columns:auto minmax(0,1fr)}
  .dest-gaps{grid-column:1/-1}
  .lp2-hero-in,.lp2-split{grid-template-columns:minmax(0,1fr)}
  .lp2-trust{grid-template-columns:minmax(0,1fr)}
  .lp2-foot-in{grid-template-columns:minmax(0,1fr)}
  .attn-grid{grid-template-columns:minmax(0,1fr)}
  .uni .mtop .brand .bw-name,.uni .mtop .brand .bw-ar{display:none}
}
@media (max-width:720px){
  .next,.today-card{grid-template-columns:minmax(0,1fr);align-items:start}
  .next .btn,.today-card .btn{width:100%}
  .two,.two.eq{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plan-h{grid-template-columns:minmax(0,1fr)}
  .wk{grid-template-columns:minmax(0,1fr);gap:8px}
  .wk-dots{grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .fn{grid-template-columns:100px minmax(0,1fr) 48px;font-size:13px}
  .goal-card{grid-template-columns:auto minmax(0,1fr)}
  .goal-card .go{grid-column:1/-1;justify-items:start;display:flex;gap:8px;align-items:baseline}
  .dest{grid-template-columns:minmax(0,1fr);justify-items:start}
  .dest-ring{justify-items:start}
  .idf.back{grid-template-columns:minmax(0,1fr);justify-items:start;overflow:auto}
  .idf.back .qr{display:none}
  .fit-big{font-size:32px}
  .bars{gap:8px}
}
@media (max-width:560px){
  .btn{white-space:normal;text-align:center;line-height:1.3;padding-block:8px}
  .th-acts .btn{flex:1;min-width:0}
  .lp2-nav .top-r>.btn{display:none}
  .lp2-nav-in{gap:10px}
  .lp2-steps{grid-template-columns:minmax(0,1fr)}
  .lp2-ctas .btn,.win-foot .btn{flex:1 1 100%}
  .brand .bw-ar{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
}
body.calm *,body.calm *::before,body.calm *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
.uni .mtop .brand>span{display:none}
.uni .mtop .seg button{padding:0 9px}
.brand small{display:block;font-size:11px;letter-spacing:0;color:var(--muted);font-weight:500}

/* =====================================================================
   PUBLIC SITE — few words, one film, two audiences
   ===================================================================== */
.caret{display:inline-block;width:2px;height:1.05em;background:var(--g);vertical-align:-.15em;margin-inline-start:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fill{from{width:0}to{width:100%}}

.pub-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.pub-nav-in{display:flex;align-items:center;gap:20px;min-height:68px}
.brand-btn{display:inline-flex;border-radius:var(--r9)}
.pub-links{display:flex;gap:2px}
.pub-links .lnk{position:relative;white-space:nowrap}
.pub-links .lnk[aria-current=page]{color:var(--g);font-weight:600}
.pub-links .lnk[aria-current=page]::after{content:"";position:absolute;inset-inline:12px;bottom:-15px;height:2px;background:var(--g);border-radius:2px}
.pub-nav .top-r{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.pub-menu{display:none}
.pub-drop{display:grid;gap:2px;padding-block:8px 14px;border-top:1px solid var(--line);animation:up .25s var(--ease)}
.pub-drop .lnk{text-align:start;padding:12px}

.hero2{padding-block:clamp(40px,6vw,88px) clamp(48px,7vw,96px)}
.hero2.narrow{padding-block:clamp(40px,6vw,72px) clamp(8px,2vw,16px)}
.hero2-in{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(32px,5vw,72px);align-items:center}
.hero2 .lp2-copy>*{animation:up .6s var(--ease) both}
.hero2 .lp2-copy>:nth-child(2){animation-delay:.06s}
.hero2 .lp2-copy>:nth-child(3){animation-delay:.12s}
.hero2 .lp2-copy>:nth-child(4){animation-delay:.18s}
.hero2 .lp2-copy>:nth-child(5){animation-delay:.24s}
.hero2-in>.film,.hero2-in>.win{animation:up .7s .15s var(--ease) both}

/* the film */
.film{background:var(--surface);border:1px solid var(--line);border-radius:var(--r17);box-shadow:var(--shadow2);overflow:hidden;min-width:0;display:grid}
.film-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.ft{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 6px;font-size:14px;font-weight:600;color:var(--muted);transition:color .2s,background .2s}
.ft:hover{color:var(--ink);background:var(--paper)}
.ft[aria-selected=true]{color:var(--g)}
.ft-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid currentColor;font-size:12px;flex:none;transition:background .2s,color .2s}
.ft.done .ft-n{background:var(--g);border-color:var(--g);color:var(--on-g)}
.ft[aria-selected=true] .ft-n{background:var(--g);border-color:var(--g);color:var(--on-g)}
.ft-bar{position:absolute;inset-inline:0;bottom:-1px;height:2px;background:transparent}
.ft-bar b{display:block;height:100%;width:0;background:var(--g)}
.ft[aria-selected=true] .ft-bar b{animation:fill var(--d,5600ms) linear forwards}
.ft.done .ft-bar b{width:100%;background:var(--g500)}
.film.paused .ft-bar b{animation-play-state:paused}
.film.static .ft-bar{display:none}
.film-stage{display:grid;padding:clamp(20px,3vw,32px);min-height:330px;background:var(--surface)}
.fs{grid-area:1/1;display:grid;gap:18px;align-content:center;min-width:0;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .45s var(--ease),transform .45s var(--ease),visibility 0s .45s}
.fs.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.fc-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.fc-label svg{width:16px;height:16px;color:var(--g)}
.fc-text{font-size:clamp(18px,1.9vw,22px);line-height:1.55;font-weight:500;color:var(--ink);min-height:3.1em}
html[lang=ar] .fc-text{line-height:1.8}
.fc-text.sm{font-size:16px;color:var(--ink2);min-height:0;padding:14px 16px;border-radius:var(--r13);background:var(--paper);border:1px solid var(--line)}
.fm{background:transparent;color:inherit;border-radius:4px;padding:1px 2px;box-shadow:inset 0 -2px 0 transparent;transition:background .35s,box-shadow .35s,color .35s}
.fm.on{background:var(--gold-xl);box-shadow:inset 0 -2px 0 var(--gold);color:var(--ink)}
.fc-meter{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.fc-meter i{display:block;height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.fc-meter b{display:block;height:100%;width:0;background:var(--sage);border-radius:6px;transition:width 3.6s linear}
.fc-chips{display:flex;flex-wrap:wrap;gap:8px}
.fc-chip{opacity:0;transform:translateY(8px) scale(.96);transition:opacity .35s var(--ease),transform .35s var(--ease),background .3s,border-color .3s,color .3s}
.fc-chip.in{opacity:1;transform:none}
.fc-pass{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r13);border:1px solid var(--g600);background:var(--g700);color:var(--g);font-weight:600;font-size:15px}
.fc-pass .pi{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r9);background:var(--g);color:var(--on-g)}
.fc-pass .pi svg{width:18px;height:18px}
.fc-pass b{margin-inline-start:auto;font-size:22px;font-family:var(--f-lat)}
.fc-opp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-radius:var(--r13);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.fc-opp.in{opacity:1;transform:none}
.fc-opp .logo{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r9);background:var(--g);color:var(--on-g);font-weight:700;font-size:14px;letter-spacing:.04em;font-family:var(--f-lat)}
.fc-opp b{display:block;font-size:16px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-opp small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-opp .fc-fit{font-size:30px;color:var(--g);font-family:var(--f-lat);letter-spacing:-.02em}
.fc-ladder{display:flex;gap:4px;height:44px}
.fc-ladder .seg{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:var(--r9);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;flex:.0001 1 0;min-width:0;transition:flex-grow 1.1s var(--ease)}
.fc-ladder.go .seg{flex-grow:var(--f)}
.fc-ladder .have{background:var(--g);color:var(--on-g)}
.fc-ladder .gap{background:var(--sunk);color:var(--ink2);border:1px dashed var(--line2)}
.fc-ladder .seg b{font-size:16px;font-family:var(--f-lat)}
.fc-gap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s var(--ease)}
.fc-gap.in{opacity:1;transform:none}
.fc-path{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;max-width:420px}
.fd{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);color:transparent;transition:background .3s,border-color .3s,color .3s,transform .3s var(--ease)}
.fd svg{width:52%;height:52%}
.fd.prove{border-radius:var(--r9);border-style:dashed;border-color:var(--g400);color:var(--g400)}
.fd.on{background:var(--g);border-color:var(--g);border-style:solid;color:var(--on-g);transform:scale(1.04)}
.fc-ready{display:flex;align-items:center;gap:18px}
.fc-ready p{font-size:15px;color:var(--ink2);max-width:30ch}
.fc-ready .gauge{flex:none}
.film-foot{display:flex;align-items:center;gap:12px;padding:12px 12px 12px clamp(16px,2.4vw,24px);border-top:1px solid var(--line);background:var(--paper)}
html[dir=rtl] .film-foot{padding:12px clamp(16px,2.4vw,24px) 12px 12px}
.film-cap{flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--ink)}
.film-foot .ibtn{width:38px;height:38px;border:1px solid var(--line2);background:var(--surface);flex:none}

/* audiences, features, trust */
.aud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.4vw,24px)}
.aud-c{display:grid;gap:12px;align-content:start;justify-items:start;padding:clamp(24px,3vw,36px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r17);transition:border-color .2s,transform .25s var(--ease),box-shadow .25s}
.aud-c:hover{border-color:var(--g500);transform:translateY(-2px);box-shadow:var(--shadow2)}
.aud-c h2{font-size:clamp(22px,2.2vw,28px)!important;max-width:22ch}
.aud-c .mute{max-width:46ch}
.aud-c .btn{margin-top:8px}
.aud-i,.tr-i{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:var(--r13);background:var(--g700);color:var(--g)}
.aud-i svg,.tr-i svg{width:22px;height:22px}
.feat3{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.feat3 li{display:grid;gap:10px;align-content:start;padding-top:20px;border-top:2px solid var(--g)}
.feat3 h3{font-size:19px}
.trust6{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(24px,4vw,56px)}
.trust6 li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding-block:22px;border-top:1px solid var(--line)}
.trust6 h3{font-size:18px;margin-bottom:4px}
.t6n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--g);color:var(--on-g);font-weight:700;font-size:14px;font-family:var(--f-lat)}
.truth{margin-top:clamp(28px,4vw,44px);padding:clamp(20px,3vw,28px);border-radius:var(--r17);background:var(--sunk);display:grid;gap:12px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.rv.in{opacity:1;transform:none}

/* sign-in hub */
.signin{padding-block:clamp(40px,7vw,88px)}
.si-in{max-width:600px;display:grid;gap:24px}
.si-h{display:grid;gap:10px;justify-items:center;text-align:center}
.si-mark{width:60px;height:60px;position:relative;animation:up .5s var(--ease) both}
.si-mark svg{width:100%;height:100%}
.si-h h1{font-size:clamp(28px,3.4vw,38px)}
.si-list{display:grid;gap:10px}
.si-c{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:16px 18px;border-radius:var(--r13);background:var(--surface);border:1px solid var(--line);text-align:start;transition:border-color .2s,transform .2s var(--ease),box-shadow .2s;animation:up .5s var(--ease) both}
.si-c:nth-child(2){animation-delay:.05s}.si-c:nth-child(3){animation-delay:.1s}.si-c:nth-child(4){animation-delay:.15s}.si-c:nth-child(5){animation-delay:.2s}
.si-c:hover{border-color:var(--g);transform:translateY(-1px);box-shadow:var(--shadow2)}
.si-c>svg{width:18px;height:18px;color:var(--muted);transition:transform .2s var(--ease),color .2s}
.si-c:hover>svg{color:var(--g);transform:translateX(calc(3px * var(--dirx,1)))}
html[dir=rtl] .si-c>svg{transform:scaleX(-1)}
html[dir=rtl] .si-c:hover>svg{transform:scaleX(-1) translateX(3px)}
.si-i{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:var(--r13);background:var(--g700);color:var(--g)}
.si-i svg{width:22px;height:22px}
.si-t{display:grid;gap:2px;min-width:0}
.si-t b{font-size:16px}
.si-t small{font-size:14px;color:var(--ink2);line-height:1.45}
.si-note{text-align:center;font-size:13px}

/* composer */
.writer .cm{width:100%;max-width:1080px;margin-inline:auto;padding-block:clamp(16px,4vw,48px);display:grid;gap:clamp(20px,3vw,32px);align-content:start}
.cm-h{display:grid;gap:8px;animation:up .5s var(--ease) both}
.cm-h h1{font-size:clamp(28px,3.6vw,42px);letter-spacing:-.02em}
.cm-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(16px,2.4vw,28px);align-items:start;animation:up .55s .08s var(--ease) both}
.cm-main{display:grid;gap:16px;min-width:0}
.cm-side{display:grid;gap:14px;min-width:0}
.cm-ta{min-height:200px;font-size:17px;padding:16px 18px;resize:vertical}
.cm-meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px;font-weight:600}
.cm-meter i{display:block;height:6px;border-radius:6px;background:var(--sunk2);overflow:hidden}
.cm-meter b{display:block;height:100%;border-radius:6px;transition:width .5s var(--ease),background .3s}
.cm-meter.b-thin b{background:var(--gold)}.cm-meter.b-thin span{color:var(--gold-dd)}
.cm-meter.b-ok b{background:var(--sage)}.cm-meter.b-ok span{color:var(--ink2)}
.cm-meter.b-rich b{background:var(--g)}.cm-meter.b-rich span{color:var(--g)}
.cm-acts{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cm-acts .btn{margin-inline-start:auto}
.cm-acts #cnt{font-size:13px}
.cm-checks{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.cm-checks li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2);transition:color .2s}
.cm-checks svg{width:22px;height:22px;padding:4px;border-radius:50%;border:1px solid var(--line2);color:transparent;flex:none;transition:background .25s,border-color .25s,color .25s}
.cm-checks li.ok{color:var(--ink)}
.cm-checks li.ok svg{background:var(--g);border-color:var(--g);color:var(--on-g)}

/* institution reports, console identity */
.rep-list{display:grid;gap:12px}
.rep{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;border-radius:var(--r17);background:var(--surface);border:1px solid var(--line)}
.rep h3{font-size:16px;margin-bottom:2px}
.rep .mute{font-size:14px}
.who-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r13);background:var(--sunk);min-width:0}
.who-card b{display:block;font-size:13px;line-height:1.3}
.who-card small{display:block;font-size:12px;color:var(--muted)}
.who-av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r9);background:var(--g);color:var(--on-g);flex:none}
.who-av svg{width:18px;height:18px}

@media (max-width:1080px){
  .pub-links{display:none}
  .pub-menu{display:inline-grid}
}
@media (max-width:900px){
  .hero2-in{grid-template-columns:minmax(0,1fr)}
  .cm-grid{grid-template-columns:minmax(0,1fr)}
  .feat3{grid-template-columns:minmax(0,1fr)}
  .trust6{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .aud{grid-template-columns:minmax(0,1fr)}
  .pub-nav .pub-in{display:none}
  .rep{grid-template-columns:auto minmax(0,1fr)}
