/* =====================================================================
   BAWSALA · motion & home v3
   Motion tokens: quick 150ms · base 240ms · slow 420ms · scene 700ms.
   Ease: standard (.2,.8,.2,1) for arrivals; linear only for progress.
   One idea moves at a time; nothing loops unless it explains something.
   ===================================================================== */
:root{--t-q:.15s;--t-b:.24s;--t-s:.42s;--t-x:.7s;--spring:cubic-bezier(.34,1.4,.5,1)}

/* ---------- page transitions: the shell stays, the page arrives ---------- */
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}
@keyframes vt-out{to{opacity:0}}
::view-transition-old(root){animation:vt-out .14s ease both}
::view-transition-new(root){animation:vt-in .34s cubic-bezier(.2,.8,.2,1) both}
.shell .rail{view-transition-name:rail}
.demo-strip{view-transition-name:strip}
::view-transition-group(rail),::view-transition-group(strip){animation-duration:0s}
::view-transition-old(rail),::view-transition-old(strip){animation:none;opacity:0}
::view-transition-new(rail),::view-transition-new(strip){animation:none}

/* ---------- demo strip (replaces the product tabs) ---------- */
.demo-strip{background:var(--deep);color:rgba(248,246,239,.78);font-size:13px;position:relative;z-index:40}
.ds-in{display:flex;align-items:center;gap:14px;min-height:38px;max-width:1440px;margin-inline:auto;padding-inline:clamp(12px,3vw,24px)}
.ds-tag{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:#F4E6CC;white-space:nowrap}
.ds-now{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ds-now b{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:600}
.ds-now svg{width:15px;height:15px}
.ds-btn{display:inline-flex;align-items:center;gap:7px;min-height:28px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:12.5px;margin-inline-start:auto;white-space:nowrap;transition:background var(--t-q)}
.ds-btn:hover,.ds-btn[aria-expanded=true]{background:var(--gold);color:var(--g50)}
.ds-btn svg{width:15px;height:15px}
.ds-k{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:0 8px;border-radius:8px;color:rgba(248,246,239,.72)}
.ds-k:hover{background:rgba(255,255,255,.08);color:#fff}
.ds-k svg{width:15px;height:15px}
.ds-k kbd{background:transparent;border-color:rgba(255,255,255,.2);color:rgba(248,246,239,.7)}
.demo-strip :focus-visible{outline-color:var(--gold)}
.mpop.wide{min-width:0;width:min(400px,calc(100vw - 16px));max-width:calc(100vw - 16px);padding:8px}
.pp-panel{display:grid;gap:4px}
.pp-t{font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 10px 6px}
.pp-i{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:var(--r13);text-align:start;width:100%;transition:background var(--t-q)}
.pp-i:hover,.pp-i:focus-visible{background:var(--sunk);outline:none}
.pp-i.cur{background:var(--g700)}
.pp-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:var(--r13);background:var(--g);color:var(--on-g)}
.pp-ic svg{width:19px;height:19px}
.pp-tx b{display:block;font-size:14.5px}
.pp-tx small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.4}
.pp-i>svg{width:16px;height:16px;color:var(--muted)}

/* ---------- brand moments ---------- */
@keyframes dotdrop{0%{transform:translateY(-16px);opacity:0}55%{transform:translateY(2px);opacity:1}75%{transform:translateY(-3px)}100%{transform:none}}
.pub-nav .bw-dot,.csi-top .bw-dot{transform-box:fill-box;transform-origin:center;animation:dotdrop .8s .15s cubic-bezier(.3,.7,.3,1) both}
@keyframes bowldraw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.pub-nav .bw-bowl{stroke-dasharray:60;animation:bowldraw .7s cubic-bezier(.2,.8,.2,1) both}
.hw-w{display:inline-block;animation:wdin .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*40ms + 100ms)}
@keyframes wdin{from{opacity:0;transform:translateY(.45em)}}

/* ---------- micro-interactions ---------- */
.btn>svg:last-child:not(:first-child){transition:transform var(--t-b) var(--ease)}
.btn:hover>svg.flip:last-child:not(:first-child){transform:translateX(calc(3px * var(--dirx,1))) scaleX(var(--dirx,1))}
.btn:active{transform:scale(.98)}
.tabs [role=tab]{position:relative;border-bottom-color:transparent!important}
.tabs [role=tab]::after{content:"";position:absolute;inset-inline:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--g);transform:scaleX(0);transition:transform var(--t-b) var(--ease)}
.tabs [role=tab][aria-selected=true]::after{transform:scaleX(1);animation:tabin .35s var(--ease)}
@keyframes tabin{from{transform:scaleX(0)}}
.kpi{transition:transform var(--t-b) var(--ease),box-shadow var(--t-b)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.chart.area .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:lndraw 1.4s .15s cubic-bezier(.4,0,.2,1) forwards}
@keyframes lndraw{to{stroke-dashoffset:0}}
.chart.area .ar{opacity:0;animation:fade .8s .7s ease forwards}
.chart.area .pt{opacity:0;animation:fade .4s ease forwards;animation-delay:1.1s}
@keyframes fade{to{opacity:1}}
.main-in.enter>*{animation:secin .5s var(--ease) both}
.main-in.enter>*:nth-child(2){animation-delay:.04s}.main-in.enter>*:nth-child(3){animation-delay:.08s}.main-in.enter>*:nth-child(4){animation-delay:.12s}.main-in.enter>*:nth-child(5){animation-delay:.16s}.main-in.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes secin{from{opacity:0;transform:translateY(8px)}}
.nav-i svg{transition:transform var(--t-b) var(--ease)}
.nav-i:hover svg{transform:scale(1.08)}

/* ---------- home v3: hero ---------- */
.hero3{position:relative;overflow:hidden;padding-block:clamp(36px,5vw,72px) clamp(48px,6vw,88px)}
.hero3-in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:clamp(28px,4vw,64px);align-items:center}
.h3-copy{gap:22px}
.k-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--gold-xl);border:1px solid var(--gold-l);color:var(--gold-dd);animation:up .5s var(--ease) both}
.h3-h{font-size:clamp(38px,5vw,64px);line-height:1.06;max-width:13ch}
html[lang=ar] .h3-h{line-height:1.3}
.hero3 .lp2-sub{animation:up .6s .35s var(--ease) both;max-width:44ch}
.hero3 .lp2-ctas{animation:up .6s .45s var(--ease) both}
.hero3 .lp2-facts{animation:up .6s .55s var(--ease) both}
.hero3 .lp2-facts svg{color:var(--gold-d)}
.hero3 .hero-mark{bottom:-260px}

/* the living diagram */
.lv{position:relative;display:grid;gap:14px;animation:up .8s .2s var(--ease) both}
.lv-stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto;gap:48px 44px;padding:6px;transition:opacity .45s}
.lv.out .lv-stage{opacity:0}
.lv-wires{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:0}
.lv-wires path{fill:none;stroke:var(--line2);stroke-width:2;stroke-dasharray:5 7;stroke-linecap:round;transition:stroke .4s}
.lv.s2 .w1,.lv.s3 .w2{stroke:var(--sage);animation:flow .9s linear infinite}
.lv.fin .w1,.lv.fin .w2{stroke:var(--g)}
@keyframes flow{to{stroke-dashoffset:-24}}
.lv-card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(22,32,29,.05);opacity:.55;transform:scale(.97);transition:opacity .5s,transform .5s var(--ease),box-shadow .5s,border-color .5s;min-width:0}
.lv.s1 .lv-a,.lv.s2 .lv-b,.lv.s3 .lv-c{opacity:1;transform:none;box-shadow:var(--shadow2)}
.lv[data-step="0"] .lv-a,.lv[data-step="1"] .lv-b,.lv[data-step="2"] .lv-c{border-color:var(--g400)}
.lv-a{grid-column:1;grid-row:1}
.lv-b{grid-column:2;grid-row:1 / span 2;align-self:center}
.lv-c{grid-column:1;grid-row:2}
.lv-badge{position:absolute;top:-11px;inset-inline-end:14px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk2);color:var(--ink2);font-size:12px;font-weight:700;border:2px solid var(--paper);transition:background .4s,color .4s}
.lv.s1 .lv-a .lv-badge,.lv.s2 .lv-b .lv-badge,.lv.s3 .lv-c .lv-badge{background:var(--g);color:var(--on-g)}
.lv-k{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
.lv-ki{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--g700);color:var(--g)}
.lv-ki svg{width:14px;height:14px}
.lv-text{font-size:16px;line-height:1.65;color:var(--ink);min-height:5em}
html[lang=ar] .lv-text{line-height:1.85}
.lv-ph{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding-bottom:12px;margin-bottom:12px;border-bottom:1px dashed var(--line2)}
.lv-m svg{width:30px;height:30px;display:block}
.lv-ph b{display:block;font-size:15px}
.lv-ph small{font-size:12px;color:var(--muted)}
.lv-cnt{display:grid;justify-items:center;line-height:1}
.lv-cnt b{font-size:28px;color:var(--g)}
.lv-cnt small{font-size:11px;color:var(--muted);margin-top:4px}
.lv-slots{display:grid;gap:8px}
.lv-slot{position:relative;display:flex;align-items:center;min-height:36px;border-radius:999px;border:1.5px dashed var(--line2);background:var(--paper);transition:border-color .3s,background .3s}
.lv-slot>.state{opacity:0;transform:scale(.8);transition:opacity .25s,transform .35s var(--spring)}
.lv-slot.on{border-color:transparent;background:transparent}
.lv-slot.on>.state{opacity:1;transform:none}
.lv-fly{position:absolute;z-index:6;pointer-events:none;box-shadow:0 10px 24px -10px rgba(15,61,54,.45)}
.lv-job{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.lv-job .logo{width:38px;height:38px;border-radius:10px;background:var(--g);color:var(--on-g);font-size:12px}
.lv-job b{display:block;font-size:14.5px;line-height:1.35}
.lv-job small{font-size:12px;color:var(--muted)}
.lv-match{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center;margin-block:12px 10px}
.lv-ring .gauge{display:block}
.lv-match b{display:block;font-size:24px;line-height:1;color:var(--g)}
.lv-match small{font-size:11.5px;color:var(--muted)}
.lv-gap{justify-self:end;opacity:0;transform:translateY(6px);transition:opacity .4s .6s,transform .4s .6s var(--ease)}
.lv.s3 .lv-gap{opacity:1;transform:none}
.lv-gap .state{min-height:26px;font-size:12px}
.lv-path{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.lv-path i{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line2);color:transparent;transition:background .25s,border-color .25s,color .25s,transform .3s var(--spring)}
.lv-path i svg{width:55%;height:55%}
.lv-path i.pv{border-radius:7px;border-style:dashed}
.lv-path i.on{background:var(--g);border-color:var(--g);border-style:solid;color:var(--on-g);transform:scale(1.06)}
.lv-stamp{position:absolute;top:-14px;inset-inline-start:14px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--gold);color:var(--g50);font-weight:700;font-size:12.5px;box-shadow:0 8px 20px -10px rgba(118,88,44,.6);opacity:0;transform:scale(1.6) rotate(-8deg)}
.lv-stamp svg{width:14px;height:14px}
.lv.fin .lv-stamp{animation:stamp .45s var(--spring) forwards}
@keyframes stamp{to{opacity:1;transform:rotate(-4deg)}}
.lv-text .fm{background:transparent;transition:background .3s,box-shadow .3s}
.lv-text .fm.on{background:var(--gold-xl);box-shadow:inset 0 -2px 0 var(--gold)}
.lv-foot{display:flex;align-items:center;gap:12px}
.lv-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1}
.lv-steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;align-items:center;font-size:13px;color:var(--muted)}
.lv-steps li span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:700}
.lv-steps li b{font-weight:600}
.lv-steps li i{grid-column:1 / -1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.lv-steps li em{display:block;height:100%;width:0;background:var(--g)}
.lv-steps li.on{color:var(--g)}
.lv-steps li.on span,.lv-steps li.done span{background:var(--g);border-color:var(--g);color:var(--on-g)}
.lv-steps li.done em{width:100%}
.lv-steps li.on em{animation:fill 3.4s linear forwards}
.lv.paused .lv-steps li em,.lv.static .lv-steps li em{animation:none;width:100%}
.lv-btn{width:36px;height:36px;border:1px solid var(--line2);background:var(--surface);flex:none}
.lv-cap{font-size:14.5px;color:var(--ink2);text-align:center;min-height:1.6em}

/* ---------- home v3: steps, features, institutions ---------- */
.steps3{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,40px);position:relative}
.steps3 li{position:relative;display:grid;gap:10px;align-content:start;padding:26px;border-radius:20px;background:var(--surface);border:1px solid var(--line);transition:transform var(--t-b) var(--ease),box-shadow var(--t-b)}
.steps3 li:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
.s3-n{position:absolute;top:14px;inset-inline-end:20px;font-size:56px;font-weight:700;line-height:1;color:var(--g700);font-family:var(--f-lat)}
.s3-i{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--g);color:var(--on-g);position:relative}
.s3-i svg{width:22px;height:22px}
.steps3 h3{font-size:20px;position:relative}
.steps3 .mute{position:relative}
.steps-cta{display:flex;justify-content:center;margin-top:28px}
.feat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,22px)}
.feat{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:center;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);transition:box-shadow var(--t-b),transform var(--t-b) var(--ease)}
.feat:hover{box-shadow:var(--shadow2);transform:translateY(-2px)}
.feat-t{display:grid;gap:8px}
.feat-t h3{display:flex;align-items:center;gap:10px;font-size:19px}
.feat-t h3 svg{width:20px;height:20px;color:var(--g)}
.feat-t .mute{font-size:15px}
.fv{position:relative;height:190px;border-radius:16px;background:var(--paper);border:1px solid var(--line);overflow:hidden;padding:14px;display:grid;align-content:center;gap:8px}
.fv *{animation-play-state:paused!important}
.feat.in .fv *{animation-play-state:running!important}
/* passport loop */
.fvp-h{display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:1px dashed var(--line2)}
.fvp-h svg{width:22px;height:22px}
.fvp-h b{font-size:13.5px}
.fvp-r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);animation:rowloop 6s var(--ease) infinite;animation-delay:calc(var(--i)*.35s)}
.fvp-r .state{min-height:24px;font-size:11px;padding-inline:8px 10px}
@keyframes rowloop{0%,4%{opacity:0;transform:translateY(8px)}12%,86%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(-4px)}}
/* map loop */
.fv-map{display:block}
.fv-map .r1,.fv-map .r2,.fv-map .r3{position:absolute;left:50%;top:50%;border-radius:50%;border:1px dashed var(--line2);transform:translate(-50%,-50%)}
.fv-map .r1{width:70px;height:70px}.fv-map .r2{width:140px;height:140px}.fv-map .r3{width:220px;height:220px}
.fv-map .me{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.fv-map .me svg{width:30px;height:30px;display:block}
.fv-map .pt{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--g500);transform:translate(-50%,-50%);animation:ptin 5s var(--ease) infinite;animation-delay:calc(var(--i)*.25s)}
.fv-map .pt.hi{width:18px;height:18px;background:var(--g);box-shadow:0 0 0 0 rgba(15,61,54,.35);animation:ptin 5s var(--ease) infinite,ping 1.8s 1.4s ease-out infinite}
.fv-map .pt em{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:2px 7px;border-radius:999px;background:var(--g);color:var(--on-g);font-size:11px;font-style:normal;font-weight:700;white-space:nowrap}
@keyframes ptin{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}10%,88%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(15,61,54,.35)}100%{box-shadow:0 0 0 14px rgba(15,61,54,0)}}
/* path loop */
.fvd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.fvd i{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line2);color:transparent;animation:dotloop 6s infinite;animation-delay:calc(var(--i)*.3s)}
.fvd i.pv{border-radius:8px;border-style:dashed}
.fvd i svg{width:55%;height:55%}
@keyframes dotloop{0%,8%{background:transparent;border-color:var(--line2);color:transparent}14%,88%{background:var(--g);border-color:var(--g);color:var(--on-g)}100%{background:transparent;border-color:var(--line2);color:transparent}}
.fvr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-top:10px}
.fvr .tr{height:8px;border-radius:5px;background:var(--sunk2);overflow:hidden}
.fvr .tr i{display:block;height:100%;width:0;background:var(--g);border-radius:5px;animation:barloop 6s var(--ease) infinite}
.fvr b{font-size:18px;color:var(--g)}
.fvr small{font-size:12px;color:var(--muted)}
@keyframes barloop{0%,10%{width:6%}75%,90%{width:71%}100%{width:6%}}
/* interview loop */
.fv-iv .q{justify-self:start;max-width:92%;padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500}
html[dir=rtl] .fv-iv .q{border-radius:14px 14px 4px 14px}
.bars3{display:grid;gap:7px;margin-top:4px}
.bars3>div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:center;font-size:12px;color:var(--ink2)}
.bars3 .tr{height:7px;border-radius:4px;background:var(--sunk2);overflow:hidden}
.bars3 .tr i{display:block;height:100%;width:0;border-radius:4px;background:var(--g);animation:bar3 5s var(--ease) infinite;animation-delay:calc(var(--i)*.2s)}
@keyframes bar3{0%,10%{width:0}40%,88%{width:var(--v)}100%{width:0}}
/* institutions band */
.sec-ink .ib-h{font-size:clamp(28px,3.2vw,42px);color:#fff;line-height:1.2}
html[lang=ar] .sec-ink .ib-h{line-height:1.45}
.btn.on-ink{--bg:var(--paper);--fg:var(--g);--bd:var(--paper)}
.btn.on-ink:hover{--bg:var(--gold);--bd:var(--gold);--fg:var(--g50)}
.btn.ghost-ink{--bg:transparent;--fg:#F8F6EF;--bd:rgba(248,246,239,.35)}
.btn.ghost-ink:hover{--bg:rgba(255,255,255,.08);--bd:rgba(248,246,239,.6)}
.sec-ink .win{box-shadow:0 30px 60px -30px rgba(0,0,0,.5);border-color:transparent}
.sec-ink .uni-prev{transform:rotate(-1.2deg)}
html[dir=rtl] .sec-ink .uni-prev{transform:rotate(1.2deg)}
.sec-ink .uni-prev.rv{opacity:0;transform:translateY(24px) rotate(-1.2deg)}
.sec-ink .uni-prev.rv.in{opacity:1;transform:rotate(-1.2deg)}
.lp2-trust li{transition:transform var(--t-b) var(--ease)}
.lp2-trust li:hover{transform:translateY(-2px)}

/* ---------- guided tour ---------- */
#tour{position:fixed;inset:0;z-index:150}
.tour-spot{position:fixed;border-radius:16px;box-shadow:0 0 0 2px var(--gold),0 0 0 9999px rgba(10,43,38,.58);transition:left .38s var(--ease),top .38s var(--ease),width .38s var(--ease),height .38s var(--ease);pointer-events:none}
.tour-card{position:fixed;width:min(340px,calc(100vw - 24px));background:var(--surface);border-radius:18px;padding:20px;box-shadow:0 24px 60px -20px rgba(10,43,38,.55);display:grid;gap:8px;animation:popin .3s var(--ease) both;transition:left .38s var(--ease),top .38s var(--ease)}
.tour-n{font-size:12px;font-weight:600;color:var(--gold-d)}
.tour-card h3{font-size:18px}
.tour-card p{color:var(--ink2);font-size:14.5px}
.tour-dots{display:flex;gap:6px;margin-top:4px}
.tour-dots i{width:6px;height:6px;border-radius:3px;background:var(--line2);transition:width .3s,background .3s}
.tour-dots i.on{width:18px;background:var(--g)}
.tour-acts{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:6px}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .feat{grid-template-columns:minmax(0,1fr)}
  .fv{height:170px}
}
@media (max-width:980px){
  .hero3-in{grid-template-columns:minmax(0,1fr)}
  .h3-h{max-width:16ch}
  .steps3{grid-template-columns:minmax(0,1fr)}
  .steps3 li{grid-template-columns:auto minmax(0,1fr);column-gap:16px}
  .steps3 li .s3-i{grid-row:span 2}
}
@media (max-width:720px){
  .feat-grid{grid-template-columns:minmax(0,1fr)}
  .ds-tag{display:none}
  .lv-stage{grid-template-columns:minmax(0,1fr);grid-template-rows:none;gap:30px}
  .lv-a,.lv-b,.lv-c{grid-column:1;grid-row:auto}
  .lv-card{opacity:1;transform:none}
  .lv-text{min-height:4.2em;font-size:15px}
  .lv-steps li b{font-size:12px}
}
@media (max-width:420px){
  .ds-now{font-size:12px}
  .ds-k{display:none}
  .lv-match{grid-template-columns:auto minmax(0,1fr)}
  .lv-gap{grid-column:1 / -1;justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  .hw-w,.lv,.k-pill,.hero3 .lp2-sub,.hero3 .lp2-ctas,.hero3 .lp2-facts{animation:none!important;opacity:1!important;transform:none!important}
  .lv-card{opacity:1;transform:none}
  .fv *{animation:none!important}
  .fvp-r{opacity:1}
  .fvd i{background:var(--g);border-color:var(--g);color:var(--on-g)}
  .fvr .tr i{width:71%}
  .bars3 .tr i{width:var(--v)}
  .fv-map .pt{opacity:1}
  .chart.area .ln{stroke-dashoffset:0}
  .chart.area .ar,.chart.area .pt{opacity:1}
  .main-in>*{animation:none}
}
body.calm .hw-w,body.calm .lv,body.calm .main-in>*{animation:none!important}
body.calm .fv *{animation:none!important}
.lv-path{max-width:320px}
.lv-c .lv-path{margin-inline:auto 0}
.sec-ink .win{color:var(--ink)}
.hero3 .lp2-in{max-width:1280px}
.hero3-in{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
@media (max-width:980px){ .hero3-in{grid-template-columns:minmax(0,1fr)} }
.cm-starters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.cm-starters .chip{font-size:13px;min-height:32px}
.cm-starters .chip svg{width:13px;height:13px;color:var(--g)}
.cm-ta{transition:border-color var(--t-b),box-shadow var(--t-b)}

/* =====================================================================
   BAWSALA · pitch layer — problem, engine, impact, roadmap, vision,
   access, programs, inclusion, Tamazight.
   Editorial rules: numbered sections, hairlines, sources cited.
   ===================================================================== */
html[lang=zgh]{--font:"Noto Sans Tifinagh","IBM Plex Sans",system-ui,sans-serif;--lh:1.7}
html[lang=zgh] h1,html[lang=zgh] h2,html[lang=zgh] h3{letter-spacing:0;line-height:1.35}
.zgh-note{display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 16px;background:var(--sage-l);color:#2E4A3F;font:500 13px/1.5 var(--f-lat);text-align:center;border-bottom:1px solid var(--g600)}
.zgh-note svg{width:16px;height:16px;flex:none}
.listen{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);font-size:13.5px;font-weight:600;transition:border-color var(--t-q),background var(--t-q)}
.listen svg{width:16px;height:16px;color:var(--g)}
.listen:hover{border-color:var(--g)}
.listen.on{background:var(--g);border-color:var(--g);color:var(--on-g)}.listen.on svg{color:var(--on-g);animation:pulse2 1s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.15)}}
.lv-gap{display:flex;flex-wrap:wrap;gap:6px}
.lv-pl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--muted);font-weight:600}
.lv-pl i{flex:1;height:1px;border-top:1px dashed var(--line2)}
.lv-pl span:last-child{color:var(--g)}
.lv-match{grid-template-columns:auto auto minmax(0,1fr)}

/* problem */
.prob{align-items:center}
.pb-q{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line2)}
.pb-q li{display:flex;align-items:center;gap:16px;padding:18px 2px;border-bottom:1px solid var(--line2);font-size:clamp(17px,1.6vw,20px);font-weight:600}
.pb-n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--g);color:var(--g);font-size:13px;flex:none}
.pstat{margin:0;display:grid;gap:14px;padding:clamp(28px,4vw,44px);border-radius:24px;background:var(--band);color:#F8F6EF;position:relative;overflow:hidden}
.pstat::after{content:"";position:absolute;inset-inline-end:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(212,175,124,.12)}
.pstat .stat-n{font-size:clamp(72px,9vw,120px);line-height:.9;letter-spacing:-.04em;color:var(--gold);font-weight:700}
.pstat figcaption{display:grid;gap:10px}
.pstat figcaption span{font-size:clamp(18px,1.8vw,22px);font-weight:600;max-width:22ch}
.pstat cite{font-style:normal;font-size:12.5px;color:rgba(248,246,239,.6);padding-top:12px;border-top:1px solid rgba(248,246,239,.15)}
.stat-q{font-size:15px;color:rgba(248,246,239,.82);position:relative;z-index:1}

/* engine */
.engine{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;position:relative;counter-reset:en}
.engine::before{content:"";position:absolute;top:22px;inset-inline:22px;height:2px;background:var(--line2)}
.engine::after{content:"";position:absolute;top:22px;inset-inline-start:22px;width:calc(100% - 44px);height:2px;background:var(--g);transform:scaleX(0);transform-origin:left;transition:transform 2.4s cubic-bezier(.4,0,.2,1) .2s}
html[dir=rtl] .engine::after{transform-origin:right}
.engine.in::after{transform:scaleX(1)}
.engine>li{position:relative;display:grid;gap:10px;align-content:start;opacity:.4;transform:translateY(10px);transition:opacity .5s,transform .5s var(--ease);transition-delay:calc(var(--i)*.42s + .2s)}
.engine.in>li{opacity:1;transform:none}
.en-n{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--paper);border:2px solid var(--g);color:var(--g);font:700 14px/1 var(--f-mono);position:relative;z-index:1;transition:background .4s,color .4s;transition-delay:inherit}
.sec-sunk .en-n{background:var(--sunk)}
.engine.in .en-n{background:var(--g);color:var(--on-g)}
.engine>li:last-child .en-n{border-color:var(--gold-d)}
.engine.in>li:last-child .en-n{background:var(--gold);color:var(--g50);border-color:var(--gold)}
.engine h3{font-size:19px;margin-top:4px}
.engine .mute{font-size:14.5px;min-height:3em}
.en-ex{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-height:120px;display:grid;align-content:center}
.eg-chips{display:flex;flex-wrap:wrap;gap:6px}
.eg-chips .state{min-height:28px;font-size:12px}
.eg-list{display:grid;gap:6px}
.eg-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--paper);font-size:13px}
.eg-row.hi{background:var(--g700);color:var(--g);font-weight:600}
.eg-row b{font-size:11.5px;white-space:nowrap}
.eg-days{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.eg-days li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:12.5px;align-items:baseline}
.eg-days b{font-size:11.5px;color:var(--gold-d);white-space:nowrap}
.eg-ready{display:grid;justify-items:center;gap:6px;text-align:center;font-size:12.5px;color:var(--ink2)}
.engine.compact .en-ex{display:none}
.engine.compact .mute{min-height:0}

/* impact */
.imp{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,5vw,72px);align-items:center}
.imp-vis{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:clamp(24px,4vw,40px);border-radius:24px;background:rgba(255,255,255,.05);border:1px solid rgba(248,246,239,.12)}
.imp-vis i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(248,246,239,.1);color:rgba(248,246,239,.55);opacity:.35;transition:opacity .3s,background .3s;transition-delay:calc(var(--i)*.12s + .2s)}
.imp-vis i svg,.imp-vis b svg{width:22px;height:22px}
.imp.in .imp-vis i,.rv-done .imp-vis i{opacity:1;background:rgba(248,246,239,.16);color:#F8F6EF}
.imp-plus{font-size:30px;font-weight:300;color:var(--gold);margin-inline:6px}
.imp-one{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--g50);transform:scale(.6);opacity:0;transition:transform .5s var(--spring) 1.6s,opacity .3s 1.6s}
.imp.in .imp-one{transform:none;opacity:1}
.imp-t{display:grid;gap:16px}
.imp-t h2{font-size:clamp(26px,3vw,38px);line-height:1.25;color:#fff}
html[lang=ar] .imp-t h2{line-height:1.5}
.imp-pts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.imp-pts li{display:flex;align-items:center;gap:10px;color:rgba(248,246,239,.85);font-size:15px}
.imp-pts svg{width:18px;height:18px;color:var(--gold);flex:none}
.imp-mini{display:flex;align-items:center;gap:clamp(3px,1vw,6px);margin:18px 0 8px;max-width:440px}
.imp-mini i{display:grid;place-items:center;flex:0 1 30px;min-width:0;aspect-ratio:1;border-radius:50%;background:var(--sunk);color:var(--muted)}
.imp-mini i svg,.imp-mini b svg{width:min(16px,60%);height:auto}
.imp-mini span{color:var(--gold-d);font-weight:700;font-size:20px}
.imp-mini b{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:50%;background:var(--gold);color:var(--g50)}

/* roadmap */
.rmap{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.rmap>li{position:relative;display:grid;gap:8px;align-content:start;padding:22px;border-radius:20px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line2)}
.rmap>li.rm-ok{border-top-color:var(--g)}
.rmap>li.rm-pre{border-top-color:var(--sage)}
.rmap>li.rm-soon{border-top-color:var(--gold)}
.rm-w{font:600 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
html[lang=ar] .rm-w{font-family:var(--font);letter-spacing:0;font-size:13px}
.rmap h3{font-size:20px}
.rmap .mute{font-size:14.5px}
.rmap ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.rmap ul li{display:flex;gap:8px;font-size:13.5px;align-items:flex-start}
.rmap ul svg{width:15px;height:15px;color:var(--g);flex:none;margin-top:4px}
.rm-s{justify-self:start;margin-top:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink2)}
.rm-ok .rm-s{background:var(--g700);color:var(--g)}
.rm-pre .rm-s{background:var(--sage-l);color:#3F5F51}
.rm-soon .rm-s{background:var(--gold-xl);color:var(--gold-dd)}

/* vision */
.vis-hero .lp2-in{display:grid;gap:28px}
.why{margin:0;max-width:820px;padding:clamp(20px,3vw,32px);border-inline-start:4px solid var(--gold);background:var(--surface);border-radius:0 18px 18px 0;font-size:clamp(18px,1.9vw,23px);line-height:1.6;font-weight:500}
html[dir=rtl] .why{border-radius:18px 0 0 18px}
.diff{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line2)}
.diff li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:22px 0;border-bottom:1px solid var(--line2);align-items:baseline}
.diff li>.num{font:700 14px/1 var(--f-mono);color:var(--gold-d)}
.df-not{font-size:14.5px;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2);margin-bottom:4px}
.diff h3{font-size:clamp(19px,2vw,24px)}
.eco{position:relative;aspect-ratio:1;max-width:440px;width:100%;margin-inline:auto}
.eco-r{position:absolute;inset:0;width:100%;height:100%}
.eco-r circle{fill:none;stroke:var(--line2);stroke-width:.4;stroke-dasharray:1.5 1.5;animation:spin 60s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.eco-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:6px;width:120px;height:120px;place-content:center;border-radius:50%;background:var(--band);color:#fff;font:700 12px/1 var(--f-lat);letter-spacing:.12em;z-index:1;box-shadow:0 20px 40px -20px rgba(15,61,54,.5)}
.eco-c svg{width:40px;height:40px}.eco-c .bw-bowl{stroke:#fff}.eco-c .bw-dot{fill:var(--gold)}
.eco-n{position:absolute;display:grid;justify-items:center;gap:6px;width:110px;text-align:center;transform:translate(-50%,-26px);z-index:1;animation:ecoin .6s var(--ease) both;animation-delay:calc(var(--i)*.1s)}
@keyframes ecoin{from{opacity:0}}
.eco-n i{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--g);box-shadow:var(--shadow);transition:transform .3s var(--ease)}
.eco-n i svg{width:22px;height:22px}
.eco-n b{font-size:13px}
.eco-n:hover i{transform:scale(1.08)}
.split2.top{align-items:start}
.bm{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bm li{display:grid;gap:4px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.bm b{font-size:15px}.bm .mute{font-size:13.5px}
.nd{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.nd li{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink2)}
.nd svg{width:16px;height:16px;color:var(--err);flex:none}
.nd-rule{margin-top:20px;padding:14px 18px;border-radius:14px;background:var(--g);color:var(--on-g);font-weight:600;font-size:15px;line-height:1.55}
html[lang=ar] .nd-rule{font-family:var(--font)}

/* access */
.chk{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:14px;cursor:pointer;transition:border-color var(--t-q),background var(--t-q)}
.chk input{accent-color:var(--g);width:16px;height:16px}
.chk:has(input:checked){border-color:var(--g);background:var(--g700)}
fieldset.field{border:0;padding:0;margin:0}
.pilot-f .tabs{margin-bottom:16px}

/* programs */
.pg-rule{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--g700);color:var(--g);font:600 14px/1.5 var(--f-mono)}
html[lang=ar] .pg-rule{font-family:var(--font)}
.pg-rule svg{width:18px;height:18px;flex:none}
.pg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pg-grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pg-c{display:grid;gap:10px;align-content:start;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.pg-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pg-r{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;font-weight:500}
.pg-r svg{width:17px;height:17px;color:var(--g);flex:none;margin-top:3px}
.pg-why{font-size:13px;color:var(--muted)}
.pg-c .btn{justify-self:start}
.pg-c.soft h3{font-size:16px}
.pg-c.soft .mute{font-size:13.5px}
.tr.seat{display:block;height:6px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:8px}
.tr.seat i{display:block;height:100%;width:0;background:var(--gold);transition:width .9s var(--ease)}

/* inclusion */
.a11y-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.a11y-bar .chip svg{width:14px;height:14px}
.fs-seg button{min-width:38px}
body.lite .hero-mark,body.lite .fin-mark,body.lite .pstat::after{display:none}
body.lite .lv-wires path{animation:none!important}
body.lite .eco-r circle{animation:none}

/* responsive */
@media (max-width:1180px){
  .engine{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:28px}
  .engine::before,.engine::after{display:none}
  .rmap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pg-grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){
  .imp{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .engine{grid-template-columns:minmax(0,1fr)}
  .engine>li{grid-template-columns:46px minmax(0,1fr);column-gap:14px;opacity:1;transform:none}
  .engine>li>.en-n{grid-row:span 3}
  .engine .mute{min-height:0}
  .en-ex{min-height:0}
  .rmap,.bm,.pg-grid,.pg-grid.g4{grid-template-columns:minmax(0,1fr)}
  .imp-vis i{width:34px;height:34px}
  .imp-one{width:50px;height:50px}
  .eco-n{width:84px;transform:translate(-50%,-21px)}
  .eco-n i{width:42px;height:42px}
  .eco-c{width:96px;height:96px}
  .diff li{grid-template-columns:40px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .engine>li,.imp-one,.imp-vis i{opacity:1!important;transform:none!important}
  .engine::after{transform:scaleX(1)}
  .eco-r circle{animation:none}
}
body.calm .engine>li,body.calm .imp-one,body.calm .imp-vis i{opacity:1;transform:none}

/* ===== v6: theme system, language picker, elite interaction details ===== */

/* theme toggle (header) */
.th-tog{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;color:var(--ink2);border:1px solid transparent;transition:background .15s var(--ease-out),color .15s,border-color .15s;flex:none}
.th-tog:hover{background:var(--sunk);color:var(--ink)}
.th-tog:active{transform:scale(.96)}
.th-i{grid-area:1/1;display:grid;place-items:center;transition:transform .45s var(--ease-out),opacity .25s}
.th-i svg{width:19px;height:19px}
.th-moon{opacity:0;transform:rotate(-70deg) scale(.6)}
:root[data-theme=dark] .th-sun{opacity:0;transform:rotate(70deg) scale(.6)}
:root[data-theme=dark] .th-moon{opacity:1;transform:none}
.demo-strip .th-tog,.csi.dark .th-tog,.con.ops .rail .th-tog{color:rgba(248,246,239,.75)}
.demo-strip .th-tog:hover,.csi.dark .th-tog:hover{background:rgba(255,255,255,.08);color:#fff}

/* 3-way appearance segment */
.th-seg button{display:inline-flex;align-items:center;gap:6px}
.th-seg svg{width:15px;height:15px}
.pub-foot .th-seg span{display:none}
.pub-foot .th-seg button{min-width:38px;justify-content:center}

/* language picker */
.lang-pick{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 10px;border-radius:11px;color:var(--ink2);font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--surface);transition:background .15s,border-color .15s,color .15s}
.lang-pick:hover{border-color:var(--line2);color:var(--ink)}
.lang-pick svg{width:16px;height:16px}
.lang-pick span{min-width:1.4em;text-align:center}
.lang-pick[aria-expanded=true]{border-color:var(--g);color:var(--g)}
.csi.dark .lang-pick{background:transparent;border-color:rgba(255,255,255,.16);color:rgba(248,246,239,.8)}
.lp-menu{display:grid;gap:2px;padding:6px;min-width:200px}
.lp-i{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:9px;text-align:start;font-weight:500}
.lp-i:hover,.lp-i:focus-visible{background:var(--sunk)}
.lp-i small{color:var(--muted);font-size:11.5px;font-weight:500}
.lp-i svg{width:16px;height:16px;color:var(--g);margin-inline-start:auto}
.lp-i[aria-checked=true]{color:var(--g);font-weight:600}
.lp-i[lang=zgh]{font-family:"Noto Sans Tifinagh",var(--f-lat)}

/* popovers grow from the button that opened them */
.mpop{animation:popgrow .16s var(--ease-out) both}
@keyframes popgrow{from{opacity:0;transform:scale(.96) translateY(-4px)}}

/* theme switch: one clean circular reveal, nothing else animates */
.vt-theme *{view-transition-name:none!important}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.vt-theme::view-transition-old(root){z-index:1}
.vt-theme::view-transition-new(root){z-index:2}

/* pressable surfaces feel physical */
.btn:active,.chip:active,.lnk:active,.seg button:active,.ibtn:active{transform:scale(.97)}

/* ===== dark theme refinements (designed, not inverted) ===== */
:root[data-theme=dark] body{background:var(--paper)}
:root[data-theme=dark] .panel,
:root[data-theme=dark] .card,
:root[data-theme=dark] .mpop,
:root[data-theme=dark] .modal,
:root[data-theme=dark] .drawer,
:root[data-theme=dark] .tour-card{box-shadow:var(--hi),var(--shadow3)}
:root[data-theme=dark] .btn.ghost{--bg:var(--surface);--bd:var(--line2)}
:root[data-theme=dark] .btn.ghost:hover{--bg:var(--sunk)}
:root[data-theme=dark] .inp,
:root[data-theme=dark] textarea,
:root[data-theme=dark] select{background:var(--sunk);border-color:var(--line2)}
:root[data-theme=dark] .inp:focus,:root[data-theme=dark] textarea:focus{border-color:var(--g)}
:root[data-theme=dark] .sec-ink,
:root[data-theme=dark] .lp2-final{border-top:1px solid var(--line)}
:root[data-theme=dark] .sec-ink .win{background:var(--surface)}
:root[data-theme=dark] .qr,
:root[data-theme=dark] .qr.sm{background:#F8F6EF}
:root[data-theme=dark] .qr i{background:#0A2B26}
:root[data-theme=dark] .scrim{background:var(--scrim)}
:root[data-theme=dark] ::selection{background:rgba(139,205,183,.3)}
:root[data-theme=dark] img{opacity:.92}
:root[data-theme=dark] .toast{box-shadow:0 0 0 1px rgba(0,0,0,.2),0 16px 40px -16px rgba(0,0,0,.8)}
:root[data-theme=dark] .bw-bowl{stroke:var(--g)}
:root[data-theme=dark] .bw-dot{fill:var(--gold)}

/* ===== v7: final pass — how-page visuals, portfolio, interview report, pricing, employers, partners, elite details ===== */
.hw-t .eyebrow{margin-top:14px}
.hw-gaps{display:grid;gap:4px;width:100%}
.hw-gaps .gap-row small{color:var(--muted);font-size:12.5px}
.hw-days{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.hw-days li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline;font-size:14px}
.hw-days b{color:var(--gold-d);font-size:12.5px;white-space:nowrap}
.hw-proofs{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- try it now ---------- */
.try-sec{padding-top:clamp(40px,6vw,72px)}
.try{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,2.4vw,28px);align-items:stretch}
.try-in,.try-out{border-radius:var(--r17);border:1px solid var(--line);background:var(--surface);padding:clamp(18px,2.4vw,26px);box-shadow:var(--shadow3)}
.try-in{display:grid;gap:12px;align-content:start}
.try-in textarea{min-height:168px;font-size:16.5px;line-height:1.65;resize:vertical}
.try-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.try-tools .chip{font-size:13px}
.try-clear{margin-inline-start:auto;font-size:13px}
.try-local{font-size:12.5px}
.try-out{display:grid;align-content:start;min-height:280px;background:linear-gradient(180deg,var(--surface),var(--sunk));position:relative;overflow:hidden}
.try-empty{display:grid;gap:14px;align-content:center;justify-items:start;height:100%}
.try-ph{display:grid;gap:10px;width:100%}
.try-ph i{display:block;height:34px;border-radius:999px;border:1px dashed var(--line2)}
.try-res{display:grid;gap:14px}
.try-n{display:flex;align-items:baseline;gap:10px;margin:0}
.try-n b{font-size:clamp(34px,4vw,44px);line-height:1;color:var(--g);font-weight:700}
.try-n span{font-weight:600;color:var(--ink2)}
.try-chips{display:flex;flex-wrap:wrap;gap:8px}
.try-out.fresh .try-chips .state,.try-out.fresh .try-role{animation:tryin .42s var(--ease-out) both;animation-delay:calc(var(--j,0)*40ms)}
@keyframes tryin{from{opacity:0;transform:translateY(6px);filter:blur(4px)}}
.try-roles{display:grid;gap:8px}
.try-role{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:12px;row-gap:6px;align-items:center;padding:10px 12px;border-radius:13px;border:1px solid var(--line);background:var(--surface)}
.try-role .logo{grid-row:1/3;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);font:700 11.5px/1 var(--f-mono);color:var(--g)}
.tr-t{display:grid;min-width:0}.tr-t b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tr-t small{color:var(--muted);font-size:12px}
.tr-p{font-weight:700;color:var(--gold-d);font-size:15px}
.tr-bar{grid-column:2/4;height:4px;border-radius:9px;background:var(--sunk2);overflow:hidden}
.tr-bar i{display:block;height:100%;border-radius:inherit;background:var(--g);transform-origin:left;animation:barin .7s var(--ease-out) both}
[dir=rtl] .tr-bar i{transform-origin:right}
@keyframes barin{from{transform:scaleX(0)}}
.try-miss{display:flex;gap:10px;align-items:flex-start;margin:0;padding:12px 14px;border-radius:13px;background:var(--gold-xl);color:var(--ink);font-size:14.5px;line-height:1.55}

  fit_how_d:["Each required skill counts once; core skills count twice. A skill counts fully once you confirm or prove it. Skills you are still learning count a little. It is an estimate, not a hiring decision.","Chaque compétence requise compte une fois, les compétences clés deux fois. Une compétence compte pleinement une fois confirmée ou démontrée ; en cours d’apprentissage, elle compte un peu. C’est une estimation, pas une décision d’embauche.","تُحتسب كل مهارة مطلوبة مرة واحدة، والمهارة الأساسية مرتين. وتُحتسب المهارة كاملةً متى أكّدتها أو أثبتّها، وبقدر يسير ما دمت تتعلّمها. هذا تقدير، لا قرار توظيف."],
  ready_how:["Readiness rests on proof, not claims: 75% comes from the skills this role needs (a confirmed skill counts half, a proven or verified one counts fully), 15% from your best mock interview and 10% from your published portfolio project. Learning alone barely moves it. Proof does.", "La préparation repose sur des preuves, non sur des déclarations : 75 % proviennent des compétences du poste (une compétence confirmée compte pour moitié, une compétence démontrée ou vérifiée compte entièrement), 15 % de votre meilleur entretien blanc et 10 % de votre projet de portfolio publié. L’apprentissage seul la fait à peine progresser ; les preuves, si.", "الجاهزية إثبات لا ادّعاء: 75% منها من مهارات الوظيفة (المهارة المؤكَّدة تُحتسب نصفاً، والمُثبَتة أو الموثَّقة تُحتسب كاملة)، و15% من أفضل مقابلة تجريبية، و10% من مشروع ملف الأعمال المنشور. التعلّم وحده لا يكاد يحرّكها؛ الإثبات هو الذي يحرّكها."],

  ps_s3:["You attached proof: a file, a link, a result.","Vous avez joint une preuve : un fichier, un lien, un résultat.","أرفقت إثباتاً: ملفاً أو رابطاً أو نتيجة."],
  ps_s4:["Your institution verified the experience.","Votre établissement a vérifié l’expérience.","وثّقت مؤسستك التجربة."],

  jy_k:["An example journey","Un exemple de parcours","رحلة نموذجية"],
  jy_h:["Thirty days, one goal, real progress.","Trente jours, un objectif, des progrès réels.","ثلاثون يوماً، هدف واحد، تقدّم حقيقي."],
  jy_sub:["Salma, final-year Economics student in Tangier, aims to become a Junior Business Analyst.", "Salma, en dernière année d’économie à Tanger, vise un poste d’analyste métier junior.", "سلمى، طالبة في السنة الأخيرة من الاقتصاد بطنجة، تطمح إلى وظيفة محللة أعمال مبتدئة."],
  jy1:["Tells what she does", "Raconte ce qu’elle fait", "تحكي ما تقوم به"],
  jy1d:["The family shop and a class survey. Eight skills found.", "La boutique familiale et une enquête de cours. Huit compétences trouvées.", "متجر العائلة واستطلاع في مادة دراسية. ثماني مهارات مُكتشفة."],
  jy2:["Chooses a goal", "Choisit un objectif", "تختار هدفاً"],
  jy2d:["Junior Business Analyst. Two skills are missing: Power BI and SQL.", "Analyste métier junior. Il lui manque deux compétences : Power BI et SQL.", "محللة أعمال مبتدئة. تنقصها مهارتان: Power BI وSQL."],
  jy3:["Proves Power BI", "Démontre Power BI", "تُثبت Power BI"],
  jy3d:["Day 6: a two-chart dashboard, her first proof.", "Jour 6 : un tableau de bord de deux graphiques, sa première preuve.", "اليوم 6: لوحة قيادة من رسمين، أول إثبات لها."],
  jy4:["Proves SQL", "Démontre SQL", "تُثبت SQL"],
  jy4d:["Day 13: ten working queries on a sales database.", "Jour 13 : dix requêtes fonctionnelles sur une base de ventes.", "اليوم 13: عشرة استعلامات تعمل على قاعدة بيانات مبيعات."],
  jy5:["Practises the interview", "S’entraîne à l’entretien", "تتدرّب على المقابلة"],
  jy5d:["Five questions, scored answers, one clear tip each.","Cinq questions, des réponses notées, un conseil clair à chaque fois.","خمسة أسئلة، وإجابات مقيّمة، ونصيحة واضحة لكل منها."],
  jy6:["Publishes her project", "Publie son projet", "تنشر مشروعها"],
  jy6d:["Day 30: a three-chart Power BI dashboard on open HCP data, in her passport.", "Jour 30 : un tableau de bord Power BI de trois graphiques sur les données ouvertes du HCP, dans son passeport.", "اليوم 30: لوحة Power BI من ثلاثة رسوم على بيانات المندوبية السامية للتخطيط المفتوحة، في جوازها."],
  jy_note:["Illustrative journey. Salma is a demo profile you can open from “Sign in”.", "Parcours illustratif. Salma est un profil de démonstration accessible depuis « Se connecter ».", "رحلة توضيحية. سلمى حساب تجريبي يمكنك فتحه من صفحة تسجيل الدخول."],
  ai_k:["Honest AI","Une IA honnête","ذكاء اصطناعي صريح"],
  ai_h:["AI that shows its work.","Une IA qui montre son travail.","ذكاء اصطناعي يُظهر طريقة عمله."],
  ai_sub:["BAWSALA reads your story as a good career advisor would, then hands the decision back to you.","BAWSALA lit votre récit comme le ferait un bon conseiller, puis vous rend la décision.","تقرأ بوصلة قصتك كما يقرؤها مستشار توجيه جيد، ثم تعيد إليك القرار."],
  ai_p1:["It quotes you","Elle vous cite","تقتبس كلماتك"],
  ai_p1d:["Every suggested skill comes with the exact words it was found in.","Chaque compétence suggérée est accompagnée des mots exacts dont elle est tirée.","كل مهارة مقترحة تأتي مع الكلمات نفسها التي وُجدت فيها."],
  ai_p2:["You decide","Vous décidez","أنت تقرّر"],
  ai_p2d:["Yes or no, one skill at a time. Nothing enters your passport on its own.","Oui ou non, une compétence à la fois. Rien n’entre seul dans votre passeport.","نعم أو لا، مهارة بعد مهارة. لا يدخل شيء إلى جوازك تلقائياً."],
  ai_p3:["It admits limits","Elle reconnaît ses limites","تعترف بحدودها"],
  ai_p3d:["When a story is too thin, it says so and asks one more question.","Quand un récit est trop mince, elle le dit et pose une question de plus.","إذا كانت القصة مقتضبة جداً، تقول ذلك وتطرح سؤالاً إضافياً."],
  aid_you:["You","Vous","أنت"],
  aid_story:["Last month I convinced a supplier to lower his price by 8% for the shop.","Le mois dernier, j’ai convaincu un fournisseur de baisser son prix de 8 % pour la boutique.","في الشهر الماضي أقنعت مورّداً بتخفيض سعره بنسبة 8% لفائدة المتجر."],
  aid_found:["Found in your words","Trouvé dans vos mots","مستخرَجة من كلماتك"],
  aid_quote:["convinced a supplier to lower his price","convaincu un fournisseur de baisser son prix","أقنعت مورّداً بتخفيض سعره"],
  aid_why:["Negotiation is rare on student CVs and asked for in 4 roles here.","La négociation est rare sur les CV étudiants et demandée dans 4 postes ici.","التفاوض نادر في السِّيَر الذاتية للطلبة، ومطلوب في 4 وظائف هنا."],
  au_k:["Who it’s for","Pour qui","لمن صُمّمت بوصلة"],
  au_h:["One passport, three readers.","Un passeport, trois lecteurs.","جواز واحد، يقرؤه ثلاثة أطراف."],
  au_emp:["Employers","Employeurs","أصحاب العمل"],
  aud_e_t:["See what a candidate can actually do","Voyez ce qu’un candidat sait réellement faire","اعرفوا ما يستطيع المرشح فعله حقاً"],
  aud_e_d:["Skills with their source, proof you can open, and verification from the institution.","Des compétences avec leur source, des preuves consultables et la vérification de l’établissement.","مهارات بمصادرها، وإثباتات يمكن فتحها، وتوثيق من المؤسسة."],
  fq_k:["Questions","Questions","أسئلة"],
  fq_h:["What students ask first","Ce que les étudiants demandent d’abord","ما يسأل عنه الطلبة أولاً"],
  fq1:["Is it really free?","Est-ce vraiment gratuit ?","هل هي مجانية فعلاً؟"],
  fq1a:["The first three months are free for everyone. After that, a small subscription, free if your institution is a partner. For every 10 paying users, one student from a remote or underserved area gets supported access.","Les trois premiers mois sont gratuits pour tous. Ensuite, un petit abonnement, gratuit si votre établissement est partenaire. Pour 10 utilisateurs payants, un étudiant d’une zone éloignée ou défavorisée bénéficie d’un accès solidaire.","الأشهر الثلاثة الأولى مجانية للجميع، ثم اشتراك زهيد يصبح مجانياً إذا كانت جامعتك شريكة. ومقابل كل 10 مستخدمين يدفعون، يستفيد طالب من منطقة نائية أو أقل حظاً من الولوج المدعوم."],
  fq2:["I’ve never had a job. Can I still use it?","Je n’ai jamais travaillé. Puis-je quand même l’utiliser ?","لم أعمل من قبل. هل يمكنني استعمالها؟"],
  fq2a:["Yes. Family business, volunteering, a club, a class project, helping at home — all of it counts.","Oui. Commerce familial, bénévolat, club, projet de cours, aide à la maison — tout compte.","نعم. تجارة العائلة، والتطوع، والنادي، ومشروع دراسي، ومساعدة الأسرة: كل ذلك يُحتسب."],
  fq3:["Can I write in Darija?","Puis-je écrire en darija ?","هل يمكنني الكتابة بالدارجة؟"],
  fq3a:["Yes. Darija, Arabic, French, English, or a mix. Your passport appears in the language you choose.","Oui. Darija, arabe, français, anglais, ou un mélange. Votre passeport s’affiche dans la langue choisie.","نعم. الدارجة أو العربية أو الفرنسية أو الإنجليزية، أو مزيج منها. ويظهر جوازك باللغة التي تختارها."],
  fq4:["Who sees my passport?","Qui voit mon passeport ?","من يرى جوازي؟"],
  fq4a:["Only you, until you turn on a public link or share it with your institution. You can turn both off at any time.","Personne d’autre que vous, tant que vous n’activez pas un lien public ou le partage avec votre établissement. Vous pouvez désactiver les deux à tout moment.","أنت وحدك، إلى أن تفعّل رابطاً عاماً أو تشاركه مع مؤسستك. ويمكنك إيقاف الأمرين في أي وقت."],
  fq5:["Does a high score guarantee the role?","Un bon score garantit-il le poste ?","هل تعني النسبة العالية أنني سأحصل على الوظيفة؟"],
  fq5a:["No. It is an estimate of your readiness, with its calculation shown. The employer decides.","Non. C’est une estimation de votre préparation, avec son calcul affiché. L’employeur décide.","لا. إنها تقدير لجاهزيتك مع طريقة حسابها، والقرار لصاحب العمل."],
  fq6:["What if BAWSALA finds a skill I don’t have?","Et si BAWSALA trouve une compétence que je n’ai pas ?","ماذا لو وجدت بوصلة مهارة لا أملكها؟"],
  fq6a:["Say no. It is left out of your passport.","Répondez non. Elle est écartée de votre passeport.","قل لا، فتُستبعد، وتتعلّم بوصلة أن هذا النوع من الاقتراحات كان خاطئاً."],
  fq7:["How long does it take?","Combien de temps cela prend-il ?","كم يستغرق ذلك؟"],
  fq7a:["About ten minutes for your first passport. The 30-day path asks 20 to 45 minutes a day.","Environ dix minutes pour votre premier passeport. Le parcours de 30 jours demande 20 à 45 minutes par jour.","نحو عشر دقائق لجوازك الأول، ويتطلب مسار 30 يوماً من 20 إلى 45 دقيقة يومياً."],
  fin_d:["About ten minutes. First three months free. In your language.","Environ dix minutes. Trois premiers mois gratuits. Dans votre langue.","نحو عشر دقائق، مجاناً للطلبة، وباللغة التي تتحدثها."],
  hw_h1:["From one story to your first opportunity.","D’un récit à votre première opportunité.","من قصة واحدة إلى أول فرصة."],
  hw_sub:["Five steps. Each is shown exactly as it appears in the product.", "Cinq étapes, présentées telles qu’elles apparaissent dans le produit.", "خمس خطوات، تظهر كل منها كما تبدو في المنتج تماماً."],
  hw1t:["Tell what you have done", "Racontez ce que vous avez fait", "احكِ ما قمت به"],
  hw1d:["Write it as you would tell a friend, in any language. BAWSALA highlights the words behind each skill; you confirm or reject each one.", "Écrivez comme vous le raconteriez à un ami, dans la langue de votre choix. BAWSALA surligne les mots dont découle chaque compétence ; vous validez ou écartez chacune.", "اكتب كما تحكي لصديق، بأي لغة. تُبرز بوصلة الكلمات التي تدلّ على كل مهارة، وأنت تؤكّد كل واحدة أو تستبعدها."],
  hw1p1:["Any language, even Darija","Toutes les langues, même la darija","بأي لغة، حتى الدارجة"],
  hw1p2:["You decide on every skill", "Vous validez chaque compétence", "أنت من يقرّر بشأن كل مهارة"],
  hw2t:["See where you fit", "Voyez où vous correspondez", "اعرف أين تلائمك الفرص"],
  hw2d:["Roles are ranked by fit. Open one to see what you already have.", "Les postes sont classés par adéquation. Ouvrez-en un pour voir ce que vous avez déjà.", "تُرتَّب الوظائف حسب التوافق. افتح واحدة لترى ما تملكه مسبقاً."],
  hw2p1:["Core skills count double", "Les compétences clés comptent double", "المهارات الأساسية تُحتسب مرتين"],
  hw2p2:["Every score shows its calculation", "Chaque score montre son calcul", "كل نسبة تُظهر طريقة حسابها"],
  hw3t:["See exactly what is missing", "Voyez précisément ce qui manque", "اعرف بالضبط ما ينقصك"],
  hw3d:["For each role: the missing skills, a free resource to learn each one, and the hours it takes.", "Pour chaque poste : les compétences manquantes, une ressource gratuite pour chacune et le temps nécessaire.", "لكل وظيفة: المهارات الناقصة، ومورد مجاني لتعلّم كل منها، والوقت اللازم."],
  hw3p1:["Core gaps first", "Les écarts clés d’abord", "الفجوات الأساسية أولاً"],
  hw3p2:["Hours to close each gap", "Heures nécessaires pour chaque écart", "عدد الساعات اللازمة لسدّ كل فجوة"],
  hw4t:["Follow a 30-day path", "Suivez un parcours de 30 jours", "اتّبع مساراً من 30 يوماً"],
  hw4d:["One task of 15 to 30 minutes a day: learn, practise, prove. Day 30 is a portfolio project.", "Une tâche de 15 à 30 minutes par jour : apprendre, pratiquer, démontrer. Le jour 30, un projet de portfolio.", "مهمة واحدة من 15 إلى 30 دقيقة يومياً: تعلّم، ثم تدرّب، ثم أثبِت. وفي اليوم الثلاثين مشروع لملف أعمالك."],
  hw4p1:["Works on a phone", "Fonctionne sur téléphone", "يعمل على الهاتف"],
  hw4p2:["Free resources first", "Ressources gratuites d’abord", "الموارد المجانية أولاً"],
  mt_k:["Method","Méthode","المنهجية"],
  mt_h:["Every number shows its calculation.","Chaque chiffre indique son calcul.","كل رقم يعرض طريقة حسابه."],
  mt_sub:["No black box. These are the two formulas behind every score you see.","Pas de boîte noire. Voici les deux formules derrière chaque score affiché.","لا صندوق أسود. هاتان هما المعادلتان وراء كل نسبة تراها."],
  mt_fit:["Fit with a role","Adéquation avec un poste","التوافق مع وظيفة"],
  mt_other:["Other","Autres","الأخرى"],
  mt_fit_d:["Skills you have confirmed, weighted: the role’s core skills count twice.","Les compétences confirmées, pondérées : les compétences clés du poste comptent double.","المهارات التي أكّدتها، موزونة: تُحتسب المهارات الأساسية للوظيفة مرتين."],
  mt_ready:["Readiness","Préparation","الجاهزية"],
  mt_proof:["Proof","Preuves","الإثبات"],
  mt_iv:["Interview","Entretien","المقابلة"],
  mt_ready_d:["Proven skills count fully, confirmed skills half. Your best mock interview and your portfolio project complete the score.", "Les compétences démontrées comptent entièrement, les compétences confirmées à moitié. Votre meilleur entretien blanc et votre projet de portfolio complètent le score.", "تُحتسب المهارات المُثبَتة كاملة، والمؤكَّدة بنصف قيمتها، ويُكمل الدرجةَ أفضلُ مقابلة تجريبية ومشروعُ ملف الأعمال."],
  mt_limit:["Limits","Limites","الحدود"],
  mt_limit_h:["An estimate, never a verdict.","Une estimation, jamais un verdict.","تقدير، لا حكم."],
  mt_limit_d:["Scores help you choose what to do next. They are never sent to an employer as a decision.","Les scores vous aident à choisir la prochaine étape. Ils ne sont jamais transmis à un employeur comme une décision.","تساعدك النسب على اختيار ما تفعله بعد ذلك، ولا تُرسل أبداً إلى صاحب عمل على أنها قرار."],
  ip_k:["What you get","Ce que vous obtenez","ما تحصلون عليه"],
  ip_h2:["A console built around action.","Une console pensée pour agir.","لوحة مصمَّمة للتدخّل."],
  ip_f4t:["Reports in one click","Rapports en un clic","تقارير بنقرة واحدة"],
  ip_f4d:["Semester summary, skills by programme, verification log — ready for your board.","Synthèse du semestre, compétences par filière, journal des vérifications — prêts pour vos instances.","ملخص الأسدس، والمهارات حسب الشعبة، وسجل التوثيق، جاهزة لمجلس مؤسستكم."],
  ip_see_k:["Privacy","Confidentialité","الخصوصية"],
  ip_see_h:["What you see — and what you never see.","Ce que vous voyez — et ce que vous ne voyez jamais.","ما ترونه، وما لن تروه أبداً."],
  ip_see_y:["You see","Vous voyez","ترون"],
  ip_see_n:["You never see","Vous ne voyez jamais","لن تروا"],
  ip_y1:["Figures for groups of 10 students or more","Des chiffres pour des groupes de 10 étudiants ou plus","أرقاماً لمجموعات من 10 طلبة فأكثر"],
  ip_y2:["The skills each programme can prove","Les compétences que chaque filière peut prouver","المهارات التي تستطيع كل شعبة إثباتها"],
  ip_y3:["Passports students choose to share","Les passeports que les étudiants choisissent de partager","الجوازات التي يختار الطلبة مشاركتها"],
  ip_y4:["Verification requests addressed to you","Les demandes de vérification qui vous sont adressées","طلبات التوثيق الموجّهة إليكم"],
  ip_n1:["A student’s stories, unless they share","Les récits d’un étudiant, sauf s’il les partage","قصص الطالب، إلا إذا شاركها"],
  ip_n2:["Skills a student left out","Les compétences qu’un étudiant a écartées","المهارات التي استبعدها الطالب"],
  ip_n3:["Anything from another institution","Les données d’un autre établissement","أي شيء من مؤسسة أخرى"],
  ip_pilot_k:["Pilot","Pilote","التجربة النموذجية"],
  ip_pilot_t:["Request a pilot","Demander un pilote","اطلبوا تجربة نموذجية"],
  ip_pilot_d:["One semester, one or two programmes, a career team that wants to act on evidence.","Un semestre, une ou deux filières, une équipe carrière qui souhaite agir à partir de preuves.","أسدس واحد، وشعبة أو اثنتان، وفريق توجيه يريد العمل بناءً على الأدلة."],
  ip_ps1:["We reply within two working days","Nous répondons sous deux jours ouvrés","نردّ خلال يومي عمل"],
  ip_ps2:["A 30-minute call to choose programmes","Un appel de 30 minutes pour choisir les filières","مكالمة من 30 دقيقة لاختيار الشُّعب"],
  ip_ps3:["Your console can be ready within a week","Votre console peut être prête en une semaine","تكون لوحتكم جاهزة خلال أسبوع"],
  pf_name:["Your name","Votre nom","اسمك"],
  pf_role:["Your role","Votre fonction","صفتك"],

  pf_send:["Send request","Envoyer la demande","أرسل الطلب"],
  pf_note:["Used only to reply to this request.","Utilisé uniquement pour répondre à cette demande.","يُستعمل فقط للرد على هذا الطلب."],
  pf_ok_t:["Request received","Demande reçue","تمّ استلام الطلب"],
  pf_ok_d:["Thank you. The BAWSALA team will write to {email} about {inst} within two working days.","Merci. L’équipe BAWSALA écrira à {email} au sujet de {inst} sous deux jours ouvrés.","شكراً لكم. سيراسلكم فريق بوصلة على {email} بخصوص {inst} خلال يومي عمل."],
  fi1:["How much does it cost?","Combien cela coûte-t-il ?","ما التكلفة؟"],
  fi1a:["The pilot semester is free. After that, a yearly licence based on the number of active students.","Le semestre pilote est gratuit. Ensuite, une licence annuelle selon le nombre d’étudiants actifs.","أسدس التجربة النموذجية مجاني، ثم ترخيص سنوي حسب عدد الطلبة النشطين."],
  fi2:["Do we need to integrate with our systems?","Faut-il une intégration à nos systèmes ?","هل نحتاج إلى ربطها بأنظمتنا؟"],
  fi2a:["No. Students join with an invitation link. Single sign-on is optional.","Non. Les étudiants rejoignent BAWSALA via un lien d’invitation. L’authentification unique est facultative.","لا. ينضم الطلبة برابط دعوة، والدخول الموحّد اختياري."],
  fi3:["Who owns the data?","À qui appartiennent les données ?","لمن تعود ملكية البيانات؟"],
  fi3a:["Each student owns their passport. You own the aggregated figures for your institution.","Chaque étudiant est propriétaire de son passeport. Vous êtes propriétaire des chiffres agrégés de votre établissement.","يملك كل طالب جوازه، وتملكون الأرقام المجمَّعة الخاصة بمؤسستكم."],
  fi4:["What does verifying commit us to?","À quoi la vérification nous engage-t-elle ?","بماذا يُلزمنا التوثيق؟"],
  fi4a:["Only that the experience happened as described. Not a judgement of the student’s level.","Uniquement à attester que l’expérience a eu lieu comme décrite. Pas à juger le niveau de l’étudiant.","فقط بأن التجربة حدثت كما وُصفت، لا بالحكم على مستوى الطالب."],

  ts_h:["Who sees what, and why.","Qui voit quoi, et pourquoi.","من يرى ماذا، ولماذا."],

  hq1:["How do I add another experience?","Comment ajouter une autre expérience ?","كيف أضيف تجربة أخرى؟"],
  hq1a:["Passport → Add an experience. New skills are suggested the same way, and you decide again.","Passeport → Ajouter une expérience. Les nouvelles compétences sont suggérées de la même façon, et vous décidez à nouveau.","الجواز ← أضف تجربة. تُقترح المهارات الجديدة بالطريقة نفسها، وتقرّر من جديد."],
  hq2:["How do I prove a skill?","Comment prouver une compétence ?","كيف أُثبت مهارة؟"],
  hq2a:["Days marked with a file icon in your path ask for proof: a link, a photo, a short note with a result.","Dans votre parcours, les jours marqués d’une icône de fichier demandent une preuve : un lien, une photo, une courte note avec un résultat.","الأيام المميّزة بأيقونة ملف في مسارك تطلب إثباتاً: رابطاً أو صورة أو ملاحظة قصيرة تتضمّن نتيجة."],
  hq3:["Can I change my goal?","Puis-je changer d’objectif ?","هل يمكنني تغيير هدفي؟"],
  hq3a:["Yes, from Opportunities. Your skills and proof stay; only the path changes.","Oui, depuis Opportunités. Vos compétences et vos preuves restent ; seul le parcours change.","نعم، من صفحة الفرص. تبقى مهاراتك وإثباتاتك، ويتغيّر المسار فقط."],

  hq5a:["Leave it out. You can restore it later from your passport.","Écartez-la. Vous pourrez la restaurer plus tard depuis votre passeport.","استبعده، ويمكنك استرجاعه لاحقاً من جوازك."],

  fq8:["What happens after the three free months?","Que se passe-t-il après les trois mois gratuits ?","ماذا بعد الأشهر الثلاثة المجانية؟"],
  fq8a:["You keep your passport. Premium features continue with a small subscription, or free if your institution is a partner or you have supported access. Every 10 subscriptions fund one student from an underserved area.","Vous conservez votre passeport. Les fonctions premium continuent avec un petit abonnement, ou gratuitement si votre établissement est partenaire ou si vous bénéficiez d’un accès solidaire. Chaque tranche de 10 abonnements finance l’accès d’un étudiant d’une zone défavorisée.","يبقى جوازك معك. وتستمر الميزات المتقدمة باشتراك زهيد، أو مجاناً إذا كانت جامعتك شريكة، وكل 10 اشتراكات تموّل الولوج المدعوم لطالب من منطقة أقل حظاً."],
  fin4_t:["From potential to real opportunity.","Du potentiel à une vraie opportunité.","من الإمكانات إلى فرصة حقيقية."],
  vi_h1:["From potential to real opportunity.","Du potentiel à une vraie opportunité.","من الإمكانات إلى فرصة حقيقية."],
  vi_sub:["BAWSALA is an AI-powered career and growth platform. We start with students, and progressively connect institutions, training providers and employers through real skills.","BAWSALA est une plateforme de carrière et de développement fondée sur l’IA. Nous commençons par les étudiants, puis relions progressivement établissements, organismes de formation et employeurs par les compétences réelles.","بوصلة منصة للتوجيه المهني والتطوير الذاتي قائمة على الذكاء الاصطناعي. نبدأ بالطلبة، ثم نربط تدريجياً الجامعات ومراكز التكوين وأصحاب العمل عبر المهارات الفعلية."],
  vi_why:["We don’t want young people to be defined only by what they studied. We want to help them discover what they can actually do — and show them how to turn that potential into opportunity.", "Nous ne voulons pas que les jeunes soient définis uniquement par ce qu’ils ont étudié. Nous voulons les aider à découvrir ce qu’ils savent réellement faire — et leur montrer comment transformer ce potentiel en opportunité.", "لا نريد أن يُعرَّف الشباب بما درسوه فقط. نريد أن نساعدهم على اكتشاف ما يستطيعون فعله حقاً، وأن نريهم كيف يحوّلون هذه القدرات إلى فرص."],
  df_k:["What makes it different","Ce qui nous distingue","ما الذي يميّزها"],
  df_h:["AI is not the difference. How we connect the steps is.","La différence ne tient pas à l’IA, mais à la façon de relier les étapes.","الذكاء الاصطناعي ليس ما يصنع الفرق، بل طريقة ربط المراحل."],
  df1n:["Not only: “What did you study?”","Pas seulement : « Qu’avez-vous étudié ? »","ليس فقط: «ماذا درست؟»"],
  df1y:["But: what can you actually do?","Mais : que savez-vous vraiment faire ?","بل: ماذا تستطيع أن تفعل حقاً؟"],
  df2n:["Not only: “Here are some jobs.”","Pas seulement : « Voici des offres. »","ليس فقط: «هذه بعض الوظائف.»"],
  df2y:["But: these fit you, and here is why.","Mais : celles-ci vous correspondent, et voici pourquoi.","بل: هذه تناسبك، وهذا هو السبب."],
  df3n:["Not only: “Learn this skill.”","Pas seulement : « Apprenez cette compétence. »","ليس فقط: «تعلّم هذه المهارة.»"],
  df3y:["But: you are missing this, and here is how to close it.","Mais : il vous manque ceci, et voici comment le combler.","بل: هذا ما ينقصك، وهكذا تسدّه."],
  df4n:["Not leaving the student alone.","Ne pas laisser l’étudiant seul.","لا نترك الطالب وحده."],
  df4y:["From discovery to readiness to opportunity.","De la découverte à la préparation, jusqu’à l’opportunité.","من الاكتشاف إلى الجاهزية إلى الفرصة."],
  df5n:["Not just a chatbot.","Pas un simple agent conversationnel.","ليس مجرد روبوت محادثة."],
  df5y:["AI as the engine: diagnosis, matching, path, preparation.","L’IA comme moteur : diagnostic, correspondance, parcours, préparation.","الذكاء الاصطناعي بوصفه محرّكاً: تشخيص، وربط، ومسار، وتحضير."],
  ec_k:["The ecosystem","L’écosystème","المنظومة"],
  ec_h:["A bridge between education and the job market.","Un pont entre l’éducation et le marché du travail.","جسر بين التعليم وسوق الشغل."],
  ec_sub:["The student sees their gap. The institution sees its students’ gaps. Employers find ready, proven talent. Training is recommended because a gap was found, never as a catalogue.","L’étudiant voit son écart. L’établissement voit ceux de ses étudiants. Les employeurs trouvent des talents prêts et prouvés. La formation est recommandée parce qu’un écart a été identifié, jamais comme un catalogue.","يرى الطالب فجوته، وترى الجامعة فجوات طلبتها، ويجد أصحاب العمل كفاءات جاهزة ومُثبَتة. ويُقترح التكوين لأن فجوة اكتُشفت، لا ضمن فهرس دورات."],

  ac_h1:["Supported access for students who need it.","Un accès solidaire pour les étudiants qui en ont besoin.","الولوج المدعوم للطلبة الذين يحتاجونه."],
  ac_sub:["If you study far from big cities, or money is tight, request free access. Seats are funded by paying users (one seat per 10) and by sponsors.","Si vous étudiez loin des grandes villes, ou si vos moyens sont limités, demandez un accès solidaire. Les places sont financées par les utilisateurs payants (une place pour 10) et par des mécènes.","إذا كنت تدرس بعيداً عن المدن الكبرى، أو كانت إمكاناتك المادية محدودة، فاطلب الولوج المدعوم. تموّل المقاعدَ اشتراكاتُ المستخدمين (مقعد عن كل 10) والداعمون."],

const FX = { parts:[], raf:0, cv:null, ctx:null };
function confetti(x, y, n=60, power=1){
  if(RM()) return;
  FX.cv = FX.cv || $("#fx"); if(!FX.cv) return;
  FX.ctx = FX.ctx || FX.cv.getContext("2d");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if(FX.cv.width !== innerWidth*dpr){ FX.cv.width = innerWidth*dpr; FX.cv.height = innerHeight*dpr; FX.ctx.setTransform(dpr,0,0,dpr,0,0); }
  const cols = ["#0F3D36","#D4AF7C","#6B8F7D","#D6D0BF"];
  for(let i=0;i<n;i++){
    const a = -Math.PI/2 + (Math.random()-.5)*Math.PI*1.1, v = (6 + Math.random()*9)*power;
    FX.parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:.32+Math.random()*.15, s:4+Math.random()*6, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[i%cols.length], life:90+Math.random()*50, shape:Math.random()<.35?"c":"r"});
  }
  if(!FX.raf) FX.raf = requestAnimationFrame(tickFx);
}
function tickFx(){
  const c = FX.ctx; c.clearRect(0,0,innerWidth,innerHeight);
  FX.parts = FX.parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  for(const p of FX.parts){
    p.vx *= .985; p.vy = p.vy*.985 + p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    c.save(); c.globalAlpha = Math.min(1, p.life/30); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c;
    if(p.shape === "c"){ c.beginPath(); c.arc(0,0,p.s/2.4,0,Math.PI*2); c.fill(); } else c.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
    c.restore();
  }
  FX.raf = FX.parts.length ? requestAnimationFrame(tickFx) : 0;
  if(!FX.raf) c.clearRect(0,0,innerWidth,innerHeight);
}

  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4] = len; push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`); push(bytes); push("\nendstream\nendobj\n");
  const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  const xref = len;
  push(`xref\n0 6\n0000000000 65535 f \n${[1,2,3,4,5].map(n => String(offs[n]).padStart(10, "0") + " 00000 n \n").join("")}trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, {type:"application/pdf"});
}
async function downloadCertificate(){

  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);

  if(DL){ try{ await DL.save({filename:name, data:pdf}); toast(t("cert_saved")); }catch(e){ if(e && e.code !== "declined") toast(t("cert_no"), "x"); } return; }
  try{ const a = document.createElement("a"); a.href = URL.createObjectURL(pdf); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast(t("cert_saved")); }catch(e){ toast(t("cert_no"), "x"); }
}

function qrCells(){
  const cells = [], seed = [...passNo()].reduce((a,c) => (a*7 + c.charCodeAt(0)) | 0, 3);
  for(let k=0;k<169;k++){ const x = k%13, y = Math.floor(k/13), fx = x < 5 ? x : x > 7 ? x-8 : -1, fy = y < 5 ? y : y > 7 ? y-8 : -1, fin = fx >= 0 && fy >= 0 && !(x > 7 && y > 7);
    const on = fin ? (fx === 0 || fx === 4 || fy === 0 || fy === 4 || (fx === 2 && fy === 2)) : (((seed >> (k%23)) ^ ((k*2654435761) >>> 7)) & 1); cells.push(`<i class="${on ? "" : "o"}"></i>`); }
  return cells.join("");
}

function whyRules(o){

  const b = miss.length ? t("why_gap", {miss:list(miss.map(skName)), h:miss.reduce((s,id) => s + (RES[id] ? RES[id].h : 4), 0)}) : t("why_nogap");
  return (a + " " + b).trim();
}
function mapSVG(items){
  /* Distance from you = estimated fit (labelled rings); size repeats it; dots spread evenly so none hide another. */
  const cx = 300, cy = 300, rad = p => 104 + (1 - p/100)*186, sel = ui.sel, pos = {}, n = Math.max(1, items.length);
  const order = liveOpps().filter(o => items.some(x => x.o === o));
  items.forEach(({o,p}) => { const k = order.indexOf(o), a = (-90 + k*360/n + (k%2 ? 9 : 0)) * Math.PI/180, r = rad(p); pos[o.id] = {x:Math.max(34, Math.min(566, cx + Math.cos(a)*r)), y:Math.max(34, Math.min(566, cy + Math.sin(a)*r)), s:8 + p/100*12}; });
  const labelled = new Set(items.slice(0,3).map(x => x.o.id).concat(sel ? [sel] : []).concat(S.goal ? [S.goal] : []));
  const rings = [75,50,25].map(p => `<circle class="orb" cx="${cx}" cy="${cy}" r="${rad(p)}"/><text class="orb-l" x="${cx}" y="${cy - rad(p) - 6}" text-anchor="middle">${nfmt(p)}%</text>`).join("");
  const sp = sel && pos[sel] ? `<line class="link" x1="${cx}" y1="${cy}" x2="${pos[sel].x}" y2="${pos[sel].y}"/>` : "";
  const dots = items.map(({o,p}) => { const q = pos[o.id], b = fitBand(p), lab = tx(o.short), w = lab.length*7.6, right = q.x + q.s + 10 + w < 590;

      ${labelled.has(o.id) ? `<text class="dlab ${sel === o.id ? "" : "dim"}" x="${right ? q.x + q.s + 9 : q.x - q.s - 9}" y="${q.y + 5}" text-anchor="${right ? "start" : "end"}">${esc(lab)}</text>` : ""}`; }).join("");
  return `<svg class="map" viewBox="0 0 600 600" style="direction:ltr" role="group" aria-label="${te("om_title")}">${rings}${sp}${dots}
    <g class="me">${mascot("happy", `x="${cx-30}" y="${cy-30}" width="60" height="60" style="width:60px;height:60px;overflow:visible"`)}<text class="dlab" x="${cx}" y="${cy + 52}" text-anchor="middle">${te("om_you")}</text></g></svg>

}

  bl.push({label:t("pl_block_proj", {org:opp(S.plan.goal).org}), days:ts.slice(21, 30)});

}

/* the report: one score, three dimensions, what worked, what to fix, which question to practise again */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function ivReport(iv, o){

function chartSVG(){

  const line = data.map((d,i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(d.r).toFixed(1)}`).join("");
  const area = line + `L${x(data.length-1).toFixed(1)} ${pt+ih}L${pl} ${pt+ih}Z`;
  let len = 0; for(let i=1;i<data.length;i++) len += Math.hypot(x(i)-x(i-1), y(data[i].r)-y(data[i-1].r));

    <path class="area" d="${area}"/><path class="ln" d="${line}" style="--len:${Math.ceil(len)+2}"/><circle class="end" cx="${x(data.length-1)}" cy="${y(last.r)}" r="6"/><text x="${Math.min(W-pr-4, x(data.length-1))}" y="${Math.max(14, y(last.r)-14)}" text-anchor="end" style="fill:#fff;font-weight:700;font-size:15px">${last.r}%</text></svg>`;

function filmData(){
  /* the same persona everywhere: Salma's full story, read by the built-in reader, matched to Junior Business Analyst */
  const text = EXAMPLE[LK()], found = withState(Object.assign(blank(), {ops:S.ops}), () => rulesDiscover(text)), have = new Set(found.map(f => f.id));
  const fitWith = o => { let tot = 0, got = 0; for(const [id, core] of o.req){ const w = core ? 2 : 1; tot += w; if(have.has(id)) got += w; } return Math.round(100*got/tot); };
  const o = opp("analyst") || liveOpps().concat(OPPS).map(o => ({o, p:fitWith(o)})).sort((a,b) => b.p - a.p)[0].o;
  const miss = o.req.filter(([id]) => !have.has(id)).map(r => r[0]);
  return {text, found, o, p:fitWith(o), have:o.req.length - miss.length, miss, gap:(o.req.find(([id, c]) => c && !have.has(id)) || [miss[0]])[0]};
}

    s = s.slice(0,a) + `<mark class="fm" data-i="${i}">` + s.slice(a,b) + "</mark>" + s.slice(b); });
  return s;
}

let PUB_IO = null;
function pubMount(){
  if(PUB_IO){ PUB_IO.disconnect(); PUB_IO = null; }
  tryMount();
  const f = $("#film");
  if(RM() || !("IntersectionObserver" in window)){ $$(".rv, .chain, .jy, .xl, .feat, .engine, .imp").forEach(el => el.classList.add("in")); return; }
  PUB_IO = new IntersectionObserver(es => es.forEach(e => { if(!e.isIntersecting) return; const el = e.target; el.classList.add("in"); if($("[data-w]", el)) setBars(el); PUB_IO && PUB_IO.unobserve(el);
    if(el.classList.contains("jy")) jyPlay(el); }), {rootMargin:"0px 0px -8% 0px"});
  $$(".rv, .chain, .jy, .xl, .feat, .engine, .imp").forEach((el,i) => PUB_IO.observe(el));
  $$(".rv-g").forEach(g => $$(":scope > *", g).forEach((c,i) => { c.classList.add("rv"); c.style.transitionDelay = (i % 4) * 80 + "ms"; PUB_IO.observe(c); }));
  if(f){ new IntersectionObserver((es, io) => { if(!f.isConnected){ io.disconnect(); return; } es.forEach(e => { if(!e.isIntersecting && !FILM.paused){ FILM.tok++; f.dataset.idle = "1"; } else if(e.isIntersecting && f.dataset.idle && !FILM.paused){ delete f.dataset.idle; filmPlay(FILM.scene); } }); }).observe(f); }
}
function jyPlay(el){
  const g = $(".jy-g .g-val", el), tsp = $(".jy-g tspan", el), steps = $$(".jy-s", el); let k = 0;
  const vals = JY.map(x => x.r);
  const tick = () => { if(!el.isConnected) return; steps.forEach((s,i) => s.classList.toggle("on", i <= k)); if(g){ g.style.strokeDasharray = vals[k] + " 100"; } if(tsp) tsp.textContent = nfmt(vals[k]) + "%"; const dot = $(".jy-g .g-dot", el); if(dot) dot.classList.toggle("on", vals[k] >= 70); k++; if(k < steps.length) setTimeout(tick, 700); };
  tick();
}
