function demoState(){
  if(demoState.c && demoState.c.lang === L() && demoState.c.v === JSON.stringify(S.ops.skillOff)) return demoState.c.s;
  const st = Object.assign(blank(), {lang:S.lang, ops:S.ops});
  const sel = ui.sel; withState(st, () => buildDemo()); ui.sel = sel;
  /* the example passport shows Salma on day 30: two gaps proven, a published project, an interview score, three skills verified */
  withState(st, () => { const o = opp("analyst"); if(!o || !S.plan) return; const day = 864e5, t0 = Date.now() - 31*day;
    for(let d = 1; d <= 30; d++) if(!S.plan.done[d]) S.plan.done[d] = {at:t0 + d*day, proof:""};
    [["powerbi","ex_pf_pbi"],["sql","ex_pf_sql"],["excel","ex_pf_xl"]].forEach(([id, k]) => { if(SK[id] && !S.ops.skillOff[id]) addSkill(id, t(k), "plan"); });
    S.portfolio = [{id:"pf1", goal:"analyst", title:tx(o.project), proof:"https://github.com/salma-demo/hcp-powerbi-dashboard", at:Date.now() - day}];
    S.ivBest[o.id] = 82; S.share.iv = true; });
  st.verify = {status:"verified", at:Date.now() - 2*864e5}; ["sales","customer_service","negotiation"].forEach(id => { if(st.skills[id]) st.skills[id].ver = true; });
  demoState.c = {lang:L(), v:JSON.stringify(S.ops.skillOff), s:st}; return st;
}
function buildDemo(){
  /* the pitch persona: a final-year Economics student, two skills (Power BI, SQL) away from Junior Business Analyst, five days into the path */
  const day = 864e5, start = Date.now() - 9*day, G = "analyst";
  S.created = start; S.profile = {name:t("demo_name"), field:"f_eco", year:"y_final"};
  const text = EXAMPLE[LK()], items = rulesDiscover(text);
  S.stories.push({id:uid(), text, at:start, type:"ty_family", skills:items.map(x => x.id)});
  S.events.push({t:start, type:"story"});
  items.forEach(f => { addSkill(f.id, f.evidence, "story"); S.skills[f.id].at = start; decide(f.id, true); });
  S.events.push({t:start + 6e5, type:"skills", n:confirmed().length});
  S.log.push({t:start + 6e5, r:0, g:G});
  if(!opp(G) || S.ops.oppOff[G]){ S.demo = true; return; }
  applyGoal(G); S.events[S.events.length-1].t = start + 9e5; S.log.pop();
  S.log.push({t:start + 9e5, r:readiness(opp(G)), g:G});
  for(let d = 1; d <= 5; d++){ S.plan.done[d] = {at:start + d*day, proof:""}; S.log.push({t:start + d*day, r:readiness(opp(G)), g:G}); }
  S.log.sort((a,b) => a.t - b.t); S.demo = true;
}
function loadDemoStudent(){
  const lang = S.lang, keep = {ops:S.ops, auth:S.auth, pilots:S.pilots, feedback:S.feedback, uni:S.uni, runs:S.runs, prefs:S.prefs, tours:S.tours, access:S.access, sponsors:S.sponsors};

}

function tryRead(text){
  const found = withState(Object.assign(blank(), {ops:S.ops}), () => rulesDiscover(text)), have = new Set(found.map(f => f.id));
  const fitWith = o => { let tot = 0, got = 0; for(const [id, core] of o.req){ const w = core ? 2 : 1; tot += w; if(have.has(id)) got += w; } return Math.round(100*got/tot); };
  const roles = found.length ? liveOpps().map(o => ({o, p:fitWith(o)})).filter(x => x.p > 0).sort((a,b) => b.p - a.p).slice(0, 3) : [];
  return {found, roles, have};
}

function liveWires(){
  const lv = $("#lv"); if(!lv) return; const st = $(".lv-stage", lv), R = st.getBoundingClientRect(), svg = $(".lv-wires", st);
  svg.setAttribute("viewBox", `0 0 ${R.width} ${R.height}`); svg.setAttribute("width", R.width); svg.setAttribute("height", R.height);
  const box = el => { const r = el.getBoundingClientRect(); return {l:r.left - R.left, t:r.top - R.top, r:r.right - R.left, b:r.bottom - R.top, cx:(r.left + r.right)/2 - R.left, cy:(r.top + r.bottom)/2 - R.top}; };
  const link = (A, B) => {
    const a = box(A), b = box(B), side = Math.abs(a.cx - b.cx) > Math.abs(a.cy - b.cy) * .9;
    if(side){ const fromR = b.cx > a.cx, x1 = fromR ? a.r : a.l, x2 = fromR ? b.l : b.r, y1 = a.cy, y2 = b.cy, m = (x1 + x2)/2; return `M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}`; }
    const down = b.cy > a.cy, y1 = down ? a.b : a.t, y2 = down ? b.t : b.b, x1 = a.cx, x2 = b.cx, m = (y1 + y2)/2; return `M${x1} ${y1} C${x1} ${m} ${x2} ${m} ${x2} ${y2}`;
  };
  $(".w1", svg).setAttribute("d", link($(".lv-a", st), $(".lv-b", st)));
  $(".w2", svg).setAttribute("d", link($(".lv-b", st), $(".lv-c", st)));
}
function liveAt(fn, ms, tok){ setTimeout(() => { if(tok !== LIVE.tok || !$("#lv")) return; fn(); }, ms); }
function liveStep(i){ const lv = $("#lv"); if(!lv) return; LIVE.step = i; lv.dataset.step = i; $$(".lv-steps li", lv).forEach((li,k) => { li.classList.toggle("on", k === i); li.classList.toggle("done", k < i); }); $("#lvCap").textContent = t("lv_c" + (i+1)); }
function liveReset(){
  const lv = $("#lv"); if(!lv) return; const d = liveData();
  lv.classList.remove("s1","s2","s3","s4","fin"); $("#lvT").innerHTML = "&nbsp;"; $("#lvN").textContent = nfmt(0); $("#lvP").textContent = nfmt(0) + "%";
  $$(".lv-slot", lv).forEach(s => s.classList.remove("on")); $$(".lv-path i", lv).forEach(x => x.classList.remove("on"));
  const g = $(".lv-ring .g-val", lv); if(g){ g.style.transition = "none"; g.style.strokeDasharray = "0 100"; void g.getBoundingClientRect(); g.style.transition = ""; }
  $$(".lv-fly", lv).forEach(x => x.remove());
}
function liveFinal(){
  const lv = $("#lv"); if(!lv) return; const d = liveData();
  lv.classList.add("s1","s2","s3","s4","fin"); $("#lvT").innerHTML = markAll(d.text, d.found.map(f => f.term)).replace(/class="fm"/g, 'class="fm on"');
  $("#lvN").textContent = nfmt(d.found.length); $$(".lv-slot", lv).forEach(s => s.classList.add("on")); $$(".lv-path i", lv).forEach(x => x.classList.add("on"));
  $("#lvP").textContent = nfmt(d.to) + "%"; const g = $(".lv-ring .g-val", lv); if(g) g.style.strokeDasharray = d.to + " 100";
  liveStep(2); liveWires();
}
function liveFly(mark, slot, done){
  const lv = $("#lv"), L0 = lv.getBoundingClientRect(), a = mark.getBoundingClientRect(), b = slot.getBoundingClientRect();
  const chip = slot.firstElementChild.cloneNode(true); chip.classList.add("lv-fly"); chip.style.left = (a.left - L0.left) + "px"; chip.style.top = (a.top - L0.top - 4) + "px"; lv.appendChild(chip);
  const dx = b.left - a.left, dy = b.top - a.top + 4;
  const an = chip.animate([{transform:"translate(0,0) scale(.7)", opacity:0}, {transform:`translate(${dx*.5}px,${dy*.5 - 28}px) scale(1.06)`, opacity:1, offset:.55}, {transform:`translate(${dx}px,${dy}px) scale(1)`, opacity:1}], {duration:820, easing:"cubic-bezier(.2,.8,.2,1)", fill:"forwards"});
  an.onfinish = () => { chip.remove(); done && done(); };
}
function liveType(el, text, tok, done){
  const ch = [...text]; let i = 0; const caret = `<span class="caret"></span>`;
  const tick = () => { if(tok !== LIVE.tok || !el.isConnected) return; i++; el.innerHTML = esc(ch.slice(0, i).join("")) + caret; if(i < ch.length) setTimeout(tick, 22 + Math.random()*26); else setTimeout(() => { if(tok === LIVE.tok) done(); }, 260); };
  tick();
}
function livePlay(){
  const tok = ++LIVE.tok, lv = $("#lv"); if(!lv) return;
  if(RM()){ liveFinal(); return; }
  liveReset(); liveStep(0); liveWires();
  const d = liveData(), T = $("#lvT");
  lv.classList.add("s1");
  liveAt(() => liveType(T, d.text, tok, () => {
    T.innerHTML = markAll(d.text, d.found.map(f => f.term)); lv.classList.add("s2"); liveStep(1);
    const marks = $$(".fm", T), slots = $$(".lv-slot", lv);
    slots.forEach((slot, k) => {
      const m = marks[k] || T;
      liveAt(() => m.classList && m.classList.add("on"), 200 + k*320, tok);
      liveAt(() => liveFly(m, slot, () => { if(tok !== LIVE.tok) return; slot.classList.add("on"); $("#lvN").textContent = nfmt(k+1); bounce($(".lv-cnt", lv), "pop"); SND.play("tick"); }), 850 + k*360, tok);
    });
    const t3 = 850 + slots.length*360 + 900;
    const ringTo = v => { const g = $(".lv-ring .g-val", lv); if(g) g.style.strokeDasharray = v + " 100"; };
    liveAt(() => { lv.classList.add("s3"); liveStep(2); ringTo(d.from); countUp($("#lvP"), d.from, 900, "%"); }, t3, tok);
    $$(".lv-path i", lv).forEach((x, k) => liveAt(() => { x.classList.add("on"); const v = Math.round(d.from + (d.to - d.from)*(k+1)/7); ringTo(v); $("#lvP").textContent = nfmt(v) + "%"; }, t3 + 1500 + k*260, tok));
    liveAt(() => { lv.classList.add("s4", "fin"); bounce($(".lv-ring", lv), "pop"); }, t3 + 1500 + 7*260 + 200, tok);
    liveAt(() => { if(!LIVE.paused) lv.classList.add("out"); }, t3 + 6800, tok);
    liveAt(() => { lv.classList.remove("out"); if(!LIVE.paused) livePlay(); }, t3 + 7300, tok);
  }), 350, tok);
}
function liveMount(){
  const lv = $("#lv"); if(!lv) return;
  LIVE.paused = false; liveWires();
  if(LIVE.ro) LIVE.ro.disconnect();
  if("ResizeObserver" in window){ LIVE.ro = new ResizeObserver(() => liveWires()); LIVE.ro.observe($(".lv-stage", lv)); }
  if(RM()){ liveFinal(); lv.classList.add("static"); return; }
  if("IntersectionObserver" in window) new IntersectionObserver((es, io) => { if(!lv.isConnected){ io.disconnect(); return; } es.forEach(e => {
    if(!e.isIntersecting){ LIVE.tok++; lv.dataset.idle = "1"; } else if(lv.dataset.idle && !LIVE.paused){ delete lv.dataset.idle; livePlay(); } }); }, {threshold:.2}).observe(lv);
  livePlay();
}
function liveToggle(){
  const lv = $("#lv"); if(!lv) return; LIVE.paused = !LIVE.paused; lv.classList.toggle("paused", LIVE.paused);
  const b = $(".lv-btn", lv); b.innerHTML = filmIcon(LIVE.paused); b.setAttribute("aria-label", t(LIVE.paused ? "lv_play" : "lv_pause"));
  if(LIVE.paused){ LIVE.tok++; liveFinal(); } else livePlay();

/* ---------- guided tours: a calm first walk-through for every product ---------- */
const TOURS = {
  student:[[".next","ts1"],[".dest","ts2"],['.rail-nav [data-to="passport"]','.tabbar [data-to="passport"]',"ts3"],[".fab","ts4"]],
  uni:[[".attn-grid","tu1"],['.rail [data-to="ver"]','.tabbar [data-to="ver"]',"tu2"],['.rail [data-to="stu"]','.tabbar [data-to="stu"]',"tu3"]],
  ops:[[".attn-list",".empty-c","to1"],['.rail [data-to="quality"]','.tabbar [data-act="c-more"]',"to2"],['.rail [data-to="set"]','.tabbar [data-act="c-more"]',"to3"]]
};
const TOUR = {k:null, i:0};
function visibleOf(sels){ for(const s of sels){ const el = $$(s).find(e => { const r = e.getBoundingClientRect(); return r.width && r.height && getComputedStyle(e).visibility !== "hidden"; }); if(el) return el; } return null; }
function startTour(k){ if(!TOURS[k]) return; closePop(); closeModal(); TOUR.k = k; TOUR.i = 0; tourShow(); }
function tourEnd(){ const o = $("#tour"); if(o) o.remove(); if(TOUR.k){ S.tours = S.tours || {}; S.tours[TOUR.k] = true; save(); } TOUR.k = null; removeEventListener("resize", tourPlace); removeEventListener("scroll", tourPlace, true); }
function tourShow(){
  const steps = TOURS[TOUR.k], st = steps[TOUR.i]; if(!st) return tourEnd();
  const key = st[st.length - 1], el = visibleOf(st.slice(0, -1));
  if(!el){ TOUR.i++; return TOUR.i < steps.length ? tourShow() : tourEnd(); }
  el.scrollIntoView({block:"center", behavior:RM() ? "auto" : "smooth"});
  let o = $("#tour"); if(!o){ o = document.createElement("div"); o.id = "tour"; o.innerHTML = `<div class="tour-spot"></div><div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tourT"></div>`; document.body.appendChild(o); addEventListener("resize", tourPlace); addEventListener("scroll", tourPlace, true); }
  const last = TOUR.i === steps.length - 1;
  $(".tour-card", o).innerHTML = `<p class="tour-n num">${te("tour_of", {a:nfmt(TOUR.i+1), b:nfmt(steps.length)})}</p><h3 id="tourT">${te(key + "t")}</h3><p>${te(key + "d")}</p>
    <div class="tour-dots">${steps.map((_,j) => `<i class="${j === TOUR.i ? "on" : ""}"></i>`).join("")}</div>
    <div class="tour-acts">${last ? "" : `<button class="linkbtn dim" data-act="tour-skip">${te("tour_skip")}</button>`}<button class="btn sm" data-act="tour-next">${te(last ? "tour_done" : "tour_next")}${last ? "" : " " + ic("arrow")}</button></div>`;
  TOUR.el = el; setTimeout(tourPlace, RM() ? 0 : 320); tourPlace();
  const nb = $('.tour-card [data-act="tour-next"]'); if(nb) nb.focus({preventScroll:true});
}
function tourPlace(){
  const o = $("#tour"), el = TOUR.el; if(!o || !el || !el.isConnected) return;
  const r = el.getBoundingClientRect(), pad = 8, sp = $(".tour-spot", o), cd = $(".tour-card", o);
  sp.style.left = (r.left - pad) + "px"; sp.style.top = (r.top - pad) + "px"; sp.style.width = (r.width + pad*2) + "px"; sp.style.height = (r.height + pad*2) + "px";
  const cw = cd.offsetWidth, ch = cd.offsetHeight, below = r.bottom + 16 + ch < innerHeight, rtl = document.documentElement.dir === "rtl";
  let x = rtl ? r.right - cw : r.left; x = Math.max(12, Math.min(innerWidth - cw - 12, x));
  let y = below ? r.bottom + 16 : r.top - ch - 16; if(y < 12) y = Math.min(innerHeight - ch - 12, Math.max(12, r.top + 12));
  cd.style.left = x + "px"; cd.style.top = y + "px";
}
function maybeTour(){

function sparkline(vals, w=120, h=32){
  const mx = Math.max(...vals), mn = Math.min(...vals), r = mx - mn || 1, pts = vals.map((v,i) => [i*(w/(vals.length-1)), h - 3 - (v-mn)/r*(h-6)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="direction:ltr" aria-hidden="true"><path d="M${pts.map(p => p.map(n => n.toFixed(1)).join(" ")).join(" L")}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.6"/></svg>`;
}
function areaChart(vals, labels, label){
  const W = 620, H = 230, P = {l:52, r:16, t:30, b:28}, mx = Math.ceil(Math.max(...vals)*1.08/50)*50 || 50, iw = W - P.l - P.r, ih = H - P.t - P.b;

function completeTask(day){
  const tk = task(day), o = opp(S.plan.goal), box = $("#proof"), proof = box ? box.value.trim() : "";
  if((tk.kind === "prove" || tk.kind === "portfolio") && !proofOK(proof)){ shake(box); toast(t("tk_proof_need"), "file"); if(box){ box.setAttribute("aria-invalid", "true"); box.focus(); } return; }
  const before = readiness(o);
  S.plan.done[day] = {at:Date.now(), proof};
  let proven = null;
  if(tk.kind === "prove" && tk.skill){ const was = owned(tk.skill) && skillState(tk.skill) !== "conf"; addSkill(tk.skill, proof, "plan"); if(!was){ proven = tk.skill; event("proven", {id:tk.skill}); } }
  else if(tk.skill && proof && owned(tk.skill)) addSkill(tk.skill, proof, "note");
  if(tk.kind === "portfolio"){ S.portfolio = (S.portfolio || []).filter(x => x.goal !== o.id); S.portfolio.push({id:uid(), goal:o.id, title:tx(o.project), proof, at:Date.now()}); event("portfolio", {id:o.id}); }
  logReady(); save();
  const after_ = readiness(o);
  closeModal(); if(S.screen === "plan" || S.screen === "home") renderMain();
  const dot = $(`[data-d="${day}"]`);
  bounce(dot); SND.play("ok");
  if(proven){ burstFrom(dot, 36, .7); setTimeout(() => { toast(t("tk_proven", {skill:skName(proven)}), "file"); SND.play("pop"); }, 700); }
  toast(t("tk_toast", {p:Math.max(0, after_ - before), d:day}));
  say(t("say_day"), "happy");
  if(day === 30) setTimeout(celebrate, 600);
}

async function sendCopilot(text){

  chat.scrollTop = chat.scrollHeight; setMood("thinking", $(".dr-h") || document);
  let reply = null; const acts = [];
  if(aiOn()){
    const instr = `You are "Bawsala" (البوصلة, "the compass"), the career copilot inside the BAWSALA app for Moroccan university students.
Persona: calm, precise, warm. A smart friend, not a motivational coach. Short sentences. Say "you" before "we". No hype, no emojis.

${AI.tools ? "You can act inside the app with tools: open_screen, set_goal, add_skill. Use them only when the student asks to go somewhere, choose a goal, or add a skill they clearly describe. After using a tool, say in one short line what you did." : ""}
Student data (JSON): ${profileBrief()}`;

    if(reply === null && !aiOn()) reply = offlineReply(text);
  } else { const t0 = performance.now(); await sleep(550); reply = offlineReply(text); logRun("copilot", "rules", performance.now() - t0); save(); }
  const l = $("#cpLive");
  if(reply){ S.chat.push({role:"assistant", content:reply, acts}); save();
    if(l){ l.removeAttribute("id"); if(aiOn()) l.textContent = reply; else typeInto(l, reply, 8); acts.forEach(a => l.insertAdjacentHTML("beforeend", `<div class="act">${ic("bolt")}${esc(a)}</div>`)); } }
  else if(l){ l.removeAttribute("id"); l.textContent = t("cp_err"); }
  setMood("happy", $(".dr-h") || document); ui.cpBusy = false; const c = $("#chat"); if(c) c.scrollTop = c.scrollHeight;
}

async function startDiscover(text, fromApp){
  ui.disc = {phase:"reading", story:text, items:[], i:0, src:"rules", ret:fromApp ? "passport" : null, skipped:0};
  if(!fromApp) S.draft = text;
  S.stage = "discover"; save(); closeModal(); await render(true); window.scrollTo(0,0);
  const token = ++ui.run, t0 = performance.now();
  /* The scan is not decoration: it highlights the exact words the reader is matching, and lists what it finds as it finds it. */
  const words = $$("#scan .w"), hitSkill = new Map();
  words.forEach((w,i) => { for(const [id, re] of Object.entries(HINT)){ if(re.test(w.textContent)){ hitSkill.set(i, id); break; } } });
  const nSent = sentences(text).length, seen = new Set(); let wi = 0, verbs = 0;
  $("#rdline").textContent = t("rd_1");
  const scanT = setInterval(() => { if(token !== ui.run || !words[0] || !words[0].isConnected){ clearInterval(scanT); return; } const step = Math.max(1, Math.ceil(words.length/36));
    for(let k=0;k<step && wi<words.length;k++,wi++){ words[wi].classList.add("lit"); if(hitSkill.has(wi)){ words[wi].classList.add("hit"); verbs++; const id = hitSkill.get(wi); if(!seen.has(id)){ seen.add(id); const box = $("#foundLive"); if(box) box.insertAdjacentHTML("beforeend", `<span class="state s-sugg">${ic("spark")}${esc(skName(id))}</span>`); SND.play("tick"); } } } }, 70);
  const lines = ["rd_2","rd_3","rd_4"]; let li = 0;
  const lineT = setInterval(() => { const el = $("#rdline"); if(token !== ui.run || !el){ clearInterval(lineT); return; } el.textContent = t(lines[Math.min(li++, lines.length-1)]); }, 1200);
  const minWait = sleep(RM() ? 300 : 2800);
  let items = null, src = "rules";
  if(aiOn()){ items = await aiDiscover(text); if(items) src = "ai"; }
  if(!items){ items = rulesDiscover(text); logRun("discover", "rules", performance.now() - t0, true, {v:"rules-v1"}); }
  await minWait; clearInterval(scanT); clearInterval(lineT);
  if(token !== ui.run) return;
  S.stories.push({id:uid(), text, at:Date.now(), type:ui.cmType || null, skills:items.map(x => x.id)}); ui.cmType = null; event("story");
  const fresh = items.filter(x => !owned(x.id)); ui.disc.skipped = items.length - fresh.length;
  items.filter(x => owned(x.id)).forEach(x => addSkill(x.id, x.evidence, "story"));
  ui.disc.items = fresh; ui.disc.src = src; ui.disc.phase = fresh.length ? "reveal" : "none";
  save(); render(true);
}

  heat(el){ ui.heatSel = ui.heatSel === el.dataset.k ? null : el.dataset.k; renderMain(); const b = $(`[data-act="heat"][data-k="${el.dataset.k}"]`); if(b) b.focus({preventScroll:true}); },
  "u-share-op"(el){ const o = opp(el.dataset.id); S.uni.handled["op_" + o.id] = true; uniLog(t("u_share_op") + " · " + tx(o.title)); save(); renderMain(); toast(t("u_shared_toast", {x:tx(o.short)}), "send"); },
  "u-ins-plan"(el){ S.uni.handled["ins" + el.dataset.i] = "planned"; uniLog(t("u_planned") + " · " + t("u_nav_ins")); save(); renderMain(); toast(t("u_planned"), "plan"); },
  async "u-rep"(el){ const k = +el.dataset.k; el.disabled = true; const ok = await saveFile(`bawsala-${["summary","programmes","verifications"][k-1]}.csv`, reportCSV(k), "text/csv;charset=utf-8"); if(el.isConnected) el.disabled = false; if(ok === null) return; if(ok){ uniLog(t("ur"+k+"t") + " · CSV"); save(); toast(t("ur_saved"), "download"); SND.play("ok"); } else toast(t("ur_fail"), "x"); },
  "u-min"(el){ S.uni.minGroup = +el.dataset.n; (S.role === "ops" ? opsLog : uniLog)(t("us_priv") + " · " + t("us_min", {n:nfmt(S.uni.minGroup)})); save(); renderMain(); toast(t("us_saved"), "lock"); },
  /* operations */
  ogo(el){ ui.ops = el.dataset.to; ui.instSel = null; closePop(); render(true).then(scrollTop); },
  "o-inst-f"(el){ ui.instF = el.dataset.f; renderMain(); },
  "o-inst"(el){ const i = allInsts().find(x => x.id === el.dataset.id); S.ops.inst[el.dataset.id] = el.dataset.s; opsLog(t("audit_inst", {x:i ? i.name : el.dataset.id, s:t("ost_" + el.dataset.s)})); save(); render(); toast(t("ost_" + el.dataset.s) + " · " + (i ? i.name : ""), "building"); SND.play("ok"); },
  "o-invite"(){ inviteModal(); },
  "o-user"(el){ S.ops.userOff = S.ops.userOff || {}; S.ops.userOff[el.dataset.id] = !el.checked; const u = allUsers().find(x => x.id === el.dataset.id); opsLog(t(el.checked ? "audit_user_on" : "audit_user_off", {x:u ? u.name : ""})); save(); renderMain(); },
  "o-skill"(el){ S.ops.skillOff[el.dataset.id] = !el.checked; opsLog(t(el.checked ? "audit_sk_on" : "audit_sk_off", {x:skName(el.dataset.id)})); save(); renderMain(); toast(t(el.checked ? "os_on_t" : "os_off_t", {x:skName(el.dataset.id)}), "layers"); },
  "o-opp"(el){ S.ops.oppOff[el.dataset.id] = !el.checked; opsLog(t(el.checked ? "audit_op_on" : "audit_op_off", {x:tx(opp(el.dataset.id).title)})); save(); renderMain(); toast(t(el.checked ? "oo_on_t" : "oo_off_t"), "brief"); },
  async "o-bench"(){
    const ta = $("#oqT"), text = ta ? ta.value.trim() : ""; if(text.length < 12){ shake(ta); return; }
    ui.benchText = text; ui.benchBusy = true; renderMain();
    const t0 = performance.now(), rules = rulesDiscover(text).map(x => x.id), rms = Math.max(1, Math.round(performance.now() - t0));
    logRun("bench", "rules", rms, true, {v:"rules-v1"});
    let ai = null, ams = 0; if(aiOn()){ const t1 = performance.now(); const r = await aiDiscover(text); ams = Math.round(performance.now() - t1); if(r) ai = r.map(x => x.id).filter(id => SK[id]); }
    const uni_ = new Set(rules.concat(ai || [])), both = rules.filter(id => (ai || []).includes(id)).length;
    ui.bench = {rules, ai, rms, ams, agree:uni_.size ? Math.round(both/uni_.size*100) : 100}; ui.benchBusy = false; opsLog(t("audit_bench")); save(); if(S.role === "ops" && ui.ops === "quality") renderMain(); },
  "o-aud-f"(el){ ui.audF = el.dataset.f; renderMain(); },
  async "o-audit-dl"(){ const ok = await saveFile("bawsala-audit.csv", csv([[t("oa_when"), t("oa_who"), t("oa_what")]].concat(auditRows().map(r => [new Date(r.t).toISOString(), t(r.who), r.what]))), "text/csv;charset=utf-8"); if(ok) toast(t("ur_saved"), "download"); },
  "o-engine"(el){ S.ops.rulesOnly = el.dataset.v === "1"; opsLog(t("audit_engine", {x:t(S.ops.rulesOnly ? "oset_e_rules" : "oset_e_ai")})); save(); renderMain(); refreshPills(); toast(t("saved"), "spark"); },
  "o-maint"(el){ S.ops.maint = el.checked; opsLog(t(el.checked ? "audit_maint_on" : "audit_maint_off")); save(); render(); toast(t(el.checked ? "o_maint_on" : "o_maint_off"), "alert"); },
  "o-ret"(el){ S.ops.retention = el.dataset.v; opsLog(t("oset_ret") + " · " + t("months_n", {n:nfmt(+el.dataset.v)})); save(); renderMain(); },
  "o-fb-done"(el){ const f = S.feedback.find(x => x.id === el.dataset.id); if(f) f.done = true; opsLog(t("audit_fb_done")); save(); render(); },
  "o-reset-ask"(){ $("#oResetBox").innerHTML = `<div class="confirm">${te("oset_reset_q")}<button class="btn sm danger" data-act="o-reset-do">${te("yes_reset")}</button><button class="btn ghost sm" data-act="o-reset-no">${te("cancel")}</button></div>`; },
  "o-reset-no"(){ $("#oResetBox").innerHTML = ""; },
  "o-reset-do"(){ const lang = S.lang; try{ localStorage.removeItem(KEY); }catch(e){} S = blank(); S.lang = lang; S.role = "ops"; S.auth.ops = true; ui.disc = null; ui.bench = null; opsLog(t("audit_reset")); save(); render(true); toast(t("oset_reset_ok"), "refresh"); },
  "reset-do"(){ const lang = S.lang, keep = {ops:S.ops, auth:S.auth, pilots:S.pilots, feedback:S.feedback, uni:S.uni, prefs:S.prefs, tours:S.tours}; try{ localStorage.removeItem(KEY); }catch(e){} S = Object.assign(blank(), keep); S.lang = lang; ui.disc = null; ui.flip = false; ui.setupStep = "name"; ui.pubForce = true; ui.pub = "home"; save(); render(true).then(scrollTop); }
});

/* institution "ask for more" tells the student, too */
const _uMore = ACT["u-more"];
ACT["u-more"] = el => { if(el.dataset.id === "me") event("vermore"); _uMore(el); };

/* ---------- forms ---------- */
document.addEventListener("submit", e => {
  const f = e.target, kind = f.dataset && f.dataset.form; if(!kind) return; e.preventDefault();
  if(kind === "si"){ const i = $("#siE"), v = i.value.trim(); if(!valid(v) && !validPhone(v)) return fieldErr("siErr", t("err_id"), i); ui.siSent = v; render(); return; }
  if(kind === "pilot"){
    const n = $("#plN"), inst = $("#plI"), em = $("#plE");
    if(!n.value.trim()) return fieldErr("plErr", t("err_name"), n);
    if(!inst.value.trim()) return fieldErr("plErr", t("err_inst"), inst);
    if(!valid(em.value)) return fieldErr("plErr", t("err_email"), em);
    const p = {id:"req" + uid(), name:n.value.trim().slice(0, 60), role:$("#plR").value.trim().slice(0, 60), inst:inst.value.trim().slice(0, 80), email:em.value.trim(), city:$("#plC").value, size:["<1k","1–5k","5k+"][ui.pfSize || 0], at:Date.now(), mine:true};
    S.pilots.push(p); save(); const box = $(".pilot-f"); if(box) box.innerHTML = pilotDone(p); SND.play("win"); toast(t("pf_ok_t"), "check"); return; }
  if(kind === "usi" || kind === "osi"){ const i = $("#csiE"); if(!valid(i.value)){ i.setAttribute("aria-invalid", "true"); shake(i); i.focus(); $("#csiState").innerHTML = `<p class="f-err" role="alert">${te("err_email")}</p>`; return; } i.setAttribute("aria-invalid", "false");
    if(kind === "usi"){ $("#csiState").innerHTML = `<div class="keywait">${ic("mail")}<span>${te("usi_sent", {email:i.value.trim()})}</span><button class="linkbtn" data-act="csi-demo" data-k="uni">${te("si_open")}</button></div>`; return; }
    return consoleSignIn("ops", "key"); }
  if(kind === "access"){ const n = $("#acN"), c = $("#acC"), e = $("#acE");
    if(!n.value.trim()) return fieldErr("acErr", t("err_name"), n);
    if(!c.value.trim()) return fieldErr("acErr", t("err_place"), c);
    if(e.value.trim().length < 6) return fieldErr("acErr", t("err_contact"), e);
    S.access.push({id:"ac" + uid(), name:n.value.trim().slice(0, 60), place:c.value.trim().slice(0, 60), school:$("#acS").value.trim().slice(0, 80), contact:e.value.trim().slice(0, 80), why:$$('input[name=acW]:checked').map(x => +x.value), at:Date.now(), mine:true});
    save(); render(); SND.play("win"); toast(t("ac_ok_t"), "check"); return; }
  if(kind === "sponsor"){ const o = $("#spO"), e = $("#spE");
    if(!o.value.trim()) return fieldErr("spErr", t("err_org"), o);
    if(!valid(e.value)) return fieldErr("spErr", t("err_email"), e);
    S.sponsors.push({id:"sp" + uid(), org:o.value.trim().slice(0, 80), email:e.value.trim(), seats:ui.spSeats || 25, at:Date.now(), mine:true}); save(); render(); SND.play("win"); toast(t("sp_ok_t"), "star"); return; }
  if(kind === "emp"){ const o = $("#emO"), n = $("#emN"), e = $("#emE");
    if(!o.value.trim()) return fieldErr("emErr", t("err_org"), o);
    if(!n.value.trim()) return fieldErr("emErr", t("err_name"), n);
    if(!valid(e.value)) return fieldErr("emErr", t("err_email"), e);
    S.employers = (S.employers || []).concat({id:"em" + uid(), org:o.value.trim().slice(0, 80), name:n.value.trim().slice(0, 60), email:e.value.trim(), roles:$("#emR").value.trim().slice(0, 120), intern:$("#emI").checked, at:Date.now(), mine:true}); save(); render(); SND.play("win"); toast(t("em_ok_t"), "check"); return; }
  if(kind === "partner"){ const o = $("#paO"), e = $("#paE");
    if(!o.value.trim()) return fieldErr("paErr", t("err_org"), o);
    if(e.value.trim().length < 6) return fieldErr("paErr", t("err_contact"), e);
    S.partners = (S.partners || []).concat({id:"pa" + uid(), org:o.value.trim().slice(0, 80), contact:e.value.trim().slice(0, 80), skills:$("#paS").value.trim().slice(0, 160), fmt:$$('form[data-form=partner] input[type=checkbox]:checked').map(x => x.value), at:Date.now(), mine:true}); save(); render(); SND.play("win"); toast(t("em_ok_t"), "check"); return; }
  if(kind === "fb"){ const ta = $("#fbT"), v = ta.value.trim(); if(v.length < 5) return fieldErr("fbErr", t("err_fb"), ta); S.feedback.push({id:uid(), t:Date.now(), text:v.slice(0, 600), screen:S.screen}); save(); ta.value = ""; fieldErr("fbErr", ""); toast(t("fb_ok"), "send"); SND.play("ok"); return; }
  if(kind === "invite"){ const em = $("#ivE"); if(!valid(em.value)) return fieldErr("ivErr", t("err_email"), em);
    const u = {id:"inv" + uid(), e:em.value.trim(), r:$("#ivR").value, org:$("#ivO").value, last:0}; S.ops.users.push(u); opsLog(t("audit_invite", {x:u.e})); save(); closeModal(); renderMain(); toast(t("ou_sent"), "mail"); return; }
});
document.addEventListener("input", e => {
  const tg = e.target;
  if(tg.id === "uQ" || tg.id === "oQ"){ const k = tg.id, pos = tg.selectionStart; ui[k] = tg.value; renderMain(); const n = $("#" + k); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(_){} } }
});
document.addEventListener("keydown", e => {
  const tg = e.target;
  if((e.key === "Enter" || e.key === " ") && tg.matches && tg.matches("tr[data-act]")){ e.preventDefault(); tg.click(); }
});

/* =====================================================================
   BOOT
   ===================================================================== */
function applyPrefs(){ document.body.classList.toggle("calm", !!(S.prefs.calm || S.prefs.lite)); document.body.classList.toggle("lite", !!S.prefs.lite); document.body.style.zoom = S.prefs.fs && S.prefs.fs !== 1 ? S.prefs.fs : ""; }
(function boot(){
  applyTheme(); applyPrefs();
  if(!["student","uni","ops"].includes(S.role)) S.role = "student";
  if(S.stage === "discover") S.stage = confirmed().length ? (S.profile.name ? "app" : "setup") : "compose";
  if(S.stage === "setup" && S.profile.name) ui.setupStep = "goal";
  if(location.hash && location.hash !== "#/" && location.hash !== "#") applyHash(location.hash);
  render(); ui.booted = true;
  initAI().then(() => { if(curPortal() === "student" ? S.stage === "app" : (curPortal() !== "site" && S.auth[S.role])) renderMain(); else refreshPills(); });
  initDownloads();
  addEventListener("resize", () => { if(FX.cv) FX.cv.width = 0; closePop(); }, {passive:true});
})();

})();
</script>
